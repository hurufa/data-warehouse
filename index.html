er, jumlah mahasiswa angkatan</td><td>prodi, angkatan, jalur masuk</td></tr><tr><td>Prodi mana yang tunggakan UKT-nya naik tiap semester?</td><td>rasio tunggakan</td><td>nominal tagihan, nominal bayar</td><td>prodi, semester, jalur masuk</td></tr><tr><td>Produk apa yang paling laku di tiap kanal penjualan?</td><td>omzet per kanal</td><td>jumlah terjual, nilai penjualan</td><td>produk, kanal, tanggal</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.7em\">Tips: kata sesudah <b>\"per\"</b>, <b>\"menurut\"</b>, atau <b>\"berdasarkan\"</b> biasanya dimensi; angka yang dijumlah atau dirata-rata biasanya fakta.</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi. Tips \"per/menurut\" adalah definisi kerja mata kuliah ini.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Langkah 1</span><span>Indikator 1</span></div><h2>Memilih <button type=\"button\" class=\"term\" data-term=\"business-process\">proses bisnis</button></h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.02em\">Proses bisnis adalah kegiatan operasional organisasi, seperti menerima pesanan, memproses klaim, atau <b>mendaftarkan mahasiswa ke kelas</b>, yang menghasilkan ukuran kinerja.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Kimball &amp; Ross, 2013, terjemahan bebas)</span></div></div><ul style=\"margin-top:.7em\"><li>Biasanya berupa <b>kata kerja</b>: mendaftar, membayar, menilai, menjual, melayani.</li><li>Punya <b>sistem sumber</b> yang mencatatnya.</li><li>Satu proses bisnis ≈ satu (atau beberapa) tabel fakta.</li></ul></div><div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Proses bisnis</h3><p>pendaftaran PMB · registrasi KRS · pembayaran UKT · penilaian · yudisium</p></div><div class=\"card warn\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Bukan proses bisnis</h3><p>\"Bagian Keuangan\" (unit) · \"Laporan Akreditasi\" (keluaran) · \"Data Mahasiswa\" (subjek/dimensi)</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Langkah 2</span><span>Indikator 2</span></div><h2>Menyatakan <button type=\"button\" class=\"term\" data-term=\"grain\">grain</button></h2><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.02em\">Menyatakan grain berarti menetapkan dengan tepat apa yang diwakili oleh <b>satu baris</b> tabel fakta.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Kimball &amp; Ross, 2013, terjemahan bebas)</span></div></div><figure class=\"fig\"><svg viewBox=\"0 0 880 210\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Tiga tingkat grain data penjualan UMKM. Paling kiri, grain atomik: satu baris per item produk per struk, sekitar 30 ribu baris per bulan. Tengah: satu baris per produk per hari, sekitar 1.800 baris. Kanan: satu baris per kategori per bulan, sekitar 12 baris. Data dapat diringkas dari kiri ke kanan, tetapi ringkasan tidak dapat dirinci kembali ke kiri. Angka adalah data ilustrasi.\"><defs><marker id=\"gr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><defs><marker id=\"grw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-acc\"/><text x=\"140\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">ATOMIK</text><text x=\"140\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per item per struk</text><text x=\"140\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 30.000 baris/bulan</text><rect x=\"310\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-soft\"/><text x=\"440\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">RINGKASAN</text><text x=\"440\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per produk per hari</text><text x=\"440\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 1.800 baris/bulan</text><rect x=\"610\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-box\"/><text x=\"740\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">RINGKASAN</text><text x=\"740\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per kategori per bulan</text><text x=\"740\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 12 baris/bulan</text><line x1=\"272\" y1=\"64\" x2=\"306\" y2=\"64\" class=\"s-line\" marker-end=\"url(#gr)\"/><line x1=\"572\" y1=\"64\" x2=\"606\" y2=\"64\" class=\"s-line\" marker-end=\"url(#gr)\"/><path d=\"M740 130 C740 186 140 186 140 132\" class=\"s-warnline\" style=\"fill:none;stroke-dasharray:7 6\" marker-end=\"url(#grw)\"/><text x=\"440\" y=\"160\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">roll-up (diringkas) selalu bisa →</text><text x=\"440\" y=\"200\" text-anchor=\"middle\" class=\"s-tw\">← ringkasan tidak bisa dirinci kembali (drill-down ke detail yang tidak disimpan)</text></svg><figcaption>Mengapa grain atomik dianjurkan, diadaptasi dari Kimball &amp; Ross (2013). Jumlah baris adalah data ilustrasi UMKM kasir.</figcaption></figure><p style=\"margin-top:.3em\">Utamakan <button type=\"button\" class=\"term\" data-term=\"atomic-grain\">grain atomik</button>: paling rinci, paling fleksibel untuk pertanyaan yang belum terpikirkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 10 menit · kasus ilustrasi</span></div><h2>Tentukan proses bisnis dan grain-nya</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>UMKM kasir</h3><p>Toko oleh-oleh memakai aplikasi kasir. Pemilik ingin tahu produk terlaris per jam dan per hari.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Kelurahan</h3><p>Warga mengajukan surat pengantar (domisili, SKTM, usaha). Lurah ingin memantau lama layanan per jenis surat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pesantren</h3><p>Santri menyetor hafalan kepada ustaz setiap hari. Pengasuh ingin memantau kemajuan per kelas dan per ustaz.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Tulis: (1) nama proses bisnis (kata kerja), (2) kalimat grain \"satu baris per …\", (3) satu pertanyaan yang <b>tidak</b> bisa dijawab bila grain-nya diringkas.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh utuh</span><span>Kasus ilustrasi · indikator 1–2</span></div><h2>PMB kampus: dari pertanyaan ke grain</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Tahap</th><th>Hasil</th></tr></thead><tbody><tr><td><b>Kebutuhan</b></td><td>Wakil rektor ingin tahu jalur promosi dan sekolah asal mana yang paling banyak menghasilkan mahasiswa yang benar-benar daftar ulang.</td></tr><tr><td><b>Pertanyaan analitik</b></td><td>Berapa rasio pendaftar yang daftar ulang per jalur, per sumber informasi, per asal kabupaten, per gelombang?</td></tr><tr><td><b>KPI</b></td><td>rasio konversi pendaftar → daftar ulang</td></tr><tr><td><b>Proses bisnis</b></td><td>pendaftaran mahasiswa baru (PMB)</td></tr><tr><td><b>Grain</b></td><td>satu baris per pendaftar per gelombang, diperbarui saat tahapannya berubah (daftar, tes, lulus, daftar ulang)</td></tr><tr><td><b>Calon dimensi &amp; fakta</b></td><td class=\"muted\">jalur, sumber informasi, sekolah asal, wilayah, gelombang, tanggal · status tiap tahap, jumlah hari antartahap <i>(dirinci di Pertemuan 4–5)</i></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hati-hati</span><span>Indikator 1–2</span></div><h2>Kesalahan umum dalam tahap kebutuhan</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Mulai dari tabel</h3><p>Menyalin struktur SIAKAD lalu mencari-cari kegunaannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Per departemen</h3><p>Membuat model per unit, bukan per proses bisnis.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Grain campur</h3><p>Baris harian dan bulanan dalam satu tabel fakta.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 3H2l8 9.46V19l4 2v-8.54L22 3z\"/></svg>Grain terlalu ringkas</h3><p>Hanya menyimpan rekap bulanan sehingga pertanyaan baru tidak terjawab.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>KPI tanpa definisi</h3><p>\"Tepat waktu\" atau \"aktif\" belum disepakati artinya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Satu narasumber</h3><p>Hanya bertanya ke tim TI; pengguna bisnis tidak didengar.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen berdasarkan prinsip Kimball &amp; Ross (2013) dan Kimball et al. (2008).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih kasus</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 3–4 orang. Tetapkan peran awal:</p><ul><li>Koordinator dan penghubung mitra</li><li>Analis kebutuhan (wawancara, KPI)</li><li>Pemodel data</li><li>Penanggung jawab data dan dokumentasi</li></ul><p class=\"muted\">Peran boleh bergilir; semua anggota tetap harus menguasai seluruh tahap.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria kasus yang baik</h3><ul><li>Organisasi nyata: perguruan tinggi, UMKM, instansi pemerintah, atau pesantren/lembaga NU.</li><li>Punya <b>minimal dua proses bisnis</b> yang tercatat.</li><li>Ada <b>data sampel</b> (ekspor, spreadsheet, atau basis data) yang boleh dipakai dengan izin.</li><li>Ada narahubung yang bersedia diwawancarai.</li><li>Data pribadi <b>dianonimkan</b> sebelum dipakai <span class=\"cite\">(UU No. 27 Tahun 2022)</span>.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Rancangan data warehouse kelompok</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>P2–3 · 10%</h3><p>Dokumen kebutuhan (pertanyaan analitik, KPI, proses bisnis, grain) dan enterprise bus matrix.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>P4–5 · 10%</h3><p>Model dimensional: tabel fakta, dimensi, hierarki, surrogate key, dan SCD.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>P6–7 · 10%</h3><p>Skema fisik yang diimplementasikan di DBMS, laporan, dan presentasi di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai kasus yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Desain data warehouse dimulai dari <b>kebutuhan bisnis</b>, dipertemukan dengan <b>realitas data</b>.</li><li>Empat langkah Kimball: <b>proses bisnis → grain → dimensi → fakta</b>.</li><li>Kebutuhan digali lewat wawancara stakeholder, lalu dirumuskan menjadi <b>pertanyaan analitik dan KPI</b> yang terdefinisi.</li><li><b>Proses bisnis</b> adalah kegiatan (kata kerja), bukan unit atau laporan.</li><li><b>Grain</b> = arti satu baris tabel fakta; utamakan grain <b>atomik</b> dan jangan mencampur grain.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Urutannya: proses bisnis, grain, dimensi, fakta. Grain dinyatakan sebelum dimensi dan fakta.\"><p class=\"q\">Dalam proses desain dimensional Kimball &amp; Ross (2013), langkah kedua adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. identify the facts</button><button type=\"button\" data-o=\"b\">B. declare the grain</button><button type=\"button\" data-o=\"c\">C. identify the dimensions</button><button type=\"button\" data-o=\"d\">D. build the ETL</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Proses bisnis adalah kegiatan yang menghasilkan ukuran kinerja; unit, laporan, dan subjek bukan proses bisnis.\"><p class=\"q\">Manakah yang merupakan proses bisnis?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Bagian Keuangan</button><button type=\"button\" data-o=\"b\">B. Laporan Akreditasi</button><button type=\"button\" data-o=\"c\">C. Pembayaran UKT</button><button type=\"button\" data-o=\"d\">D. Data Mahasiswa</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Item per struk adalah detail terendah yang dicatat; bisa diringkas ke tingkat mana pun.\"><p class=\"q\">Grain paling atomik untuk penjualan di aplikasi kasir UMKM adalah satu baris per…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. kategori per bulan</button><button type=\"button\" data-o=\"b\">B. produk per hari</button><button type=\"button\" data-o=\"c\">C. struk (total belanja)</button><button type=\"button\" data-o=\"d\">D. item produk per struk</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 2 Kimball &amp; Ross (2013) tentang teknik dimensional modeling (bagian proses desain empat langkah) dan bagian enterprise bus matrix sebagai persiapan Pertemuan 3.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan kasus, narahubung, dan izin pemakaian data.</li><li>Wawancarai minimal satu pengguna bisnis dan satu pemegang data.</li><li>Susun draf dokumen kebutuhan: profil organisasi, 5 pertanyaan analitik, KPI beserta definisinya, daftar proses bisnis, dan kalimat grain tiap proses.</li><li>Daftar sistem sumber dan contoh data (sudah dianonimkan).</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf dan contoh data ke Pertemuan 3 untuk disusun menjadi bus matrix.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Dimensional modeling</span></dt><dd>Teknik merancang basis data analitik dalam bentuk tabel fakta (ukuran) dan tabel dimensi (konteks) agar mudah dipahami dan cepat dikueri. <i>(pemodelan dimensional)</i></dd></div><div><dt><span class=\"en\">Business requirements</span></dt><dd>Kebutuhan informasi pengguna bisnis: keputusan apa yang diambil, pertanyaan apa yang harus dijawab, dan ukuran apa yang dipakai. <i>(kebutuhan bisnis)</i></dd></div><div><dt><span class=\"en\">Business process</span></dt><dd>Kegiatan operasional organisasi yang menghasilkan atau mencatat ukuran kinerja, mis. registrasi KRS atau pembayaran UKT. <i>(proses bisnis)</i></dd></div><div><dt><span class=\"en\">Grain</span></dt><dd>Pernyataan tentang apa yang diwakili oleh satu baris tabel fakta. <i>(butir / tingkat kerincian)</i></dd></div><div><dt><span class=\"en\">Atomic grain</span></dt><dd>Tingkat kerincian paling rendah yang dicatat oleh proses bisnis; tidak dapat dipecah lagi. <i>(kerincian atomik)</i></dd></div><div><dt><span class=\"en\">Fact</span></dt><dd>Ukuran numerik hasil proses bisnis, mis. jumlah SKS, nominal bayar, atau jumlah pendaftar. <i>(fakta / ukuran)</i></dd></div><div><dt><span class=\"en\">Dimension</span></dt><dd>Konteks deskriptif sebuah fakta: siapa, apa, di mana, kapan, mengapa, dan bagaimana. <i>(dimensi)</i></dd></div><div><dt><span class=\"en\">Fact table</span></dt><dd>Tabel yang menyimpan ukuran-ukuran sebuah proses bisnis pada grain tertentu, beserta kunci ke tabel dimensi. <i>(tabel fakta)</i></dd></div><div><dt><span class=\"en\">Dimension table</span></dt><dd>Tabel yang menyimpan atribut deskriptif, mis. nama prodi, fakultas, atau kategori produk, untuk menyaring dan mengelompokkan fakta. <i>(tabel dimensi)</i></dd></div><div><dt><span class=\"en\">KPI</span></dt><dd>Key Performance Indicator: ukuran kinerja utama yang dipantau untuk menilai tercapainya tujuan. <i>(indikator kinerja utama)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang atau kelompok yang berkepentingan terhadap sistem, mis. pimpinan, analis, operator sistem sumber. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Enterprise bus matrix</span></dt><dd>Matriks proses bisnis (baris) terhadap dimensi (kolom) yang menjadi peta rencana data warehouse. <i>(matriks bus)</i></dd></div><div><dt><span class=\"en\">Conformed dimension</span></dt><dd>Dimensi yang dipakai bersama oleh beberapa tabel fakta dengan isi dan arti yang sama, sehingga hasil analisis bisa digabung. <i>(dimensi terkonformasi / seragam)</i></dd></div><div><dt><span class=\"en\">Data profiling</span></dt><dd>Pemeriksaan isi data sumber: jumlah baris, nilai kosong, nilai unik, pola, dan anomali. <i>(profil data)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Kimball, R., Ross, M., Thornthwaite, W., Mundy, J., &amp; Becker, B. (2008). <i>The data warehouse lifecycle toolkit</i> (2nd ed.). Wiley.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Enterprise Bus Matrix & Data Sumber","subtitle":"Enterprise bus matrix, conformed dimension, profiling awal data sumber","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Sub-CPMK-2 (Pertemuan 2–3) · CPMK-1 · CPL-5</span></div><h1>Enterprise Bus Matrix & Data Sumber</h1><p class=\"lead\">Enterprise bus matrix, conformed dimension, profiling awal data sumber</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi kebutuhan bisnis dan menyusun bus matrix serta grain proses bisnis (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":4,"title":"Tabel Fakta & Tabel Dimensi","subtitle":"Jenis tabel fakta dan ukuran (aditif, semi-aditif, non-aditif), dimensi dan hierarki, star vs snowflake","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-5</span></div><h1>Tabel Fakta & Tabel Dimensi</h1><p class=\"lead\">Jenis tabel fakta dan ukuran (aditif, semi-aditif, non-aditif), dimensi dan hierarki, star vs snowflake</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merancang model dimensional lengka (function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    v.innerHTML='<div class="stage" id="stage"><section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section></div>'+
      '<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();



</script>
</body>

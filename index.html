stg_pembayaran;</pre><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Contoh kueri profiling sederhana (ilustrasi).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hasil</span><span>Data ilustrasi · indikator 4</span></div><h2>Profil ekspor data pembayaran UKT</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Kolom</th><th>Temuan</th><th>Dampak ke desain</th></tr></thead><tbody><tr><td><b>nim</b></td><td>0% kosong; 3.912 NIM unik dari 4.050 baris</td><td>wajar: satu mahasiswa bisa membayar lebih dari sekali (cicilan); cek grain</td></tr><tr><td><b>kode_prodi</b></td><td>6% kosong; 9 kode berbeda untuk 7 prodi</td><td>perlu tabel pemetaan ke kode baku dimensi Prodi</td></tr><tr><td><b>tgl_bayar</b></td><td>2021-08-02 s.d. 2026-09-28; 12 baris bertanggal 1900-01-01</td><td>riwayat ±5 tahun; tanggal 1900 adalah nilai bawaan, tandai sebagai tidak diketahui</td></tr><tr><td><b>nominal</b></td><td>14 baris bernilai negatif</td><td>kemungkinan pengembalian dana; tanyakan ke bagian keuangan</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.7em\">Kesimpulan: data <b>tersedia dan layak</b> dengan tiga perbaikan di ETL. Proses pembayaran UKT bisa diprioritaskan.</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Prioritas</span><span>Indikator 4</span></div><h2>Proses mana yang dibangun lebih dulu?</h2><figure class=\"fig\"><svg viewBox=\"0 0 780 285\" style=\"max-height:13em\" role=\"img\" aria-label=\"Kisi prioritas dua sumbu: kelayakan di sumbu mendatar, nilai bisnis di sumbu tegak. Kuadran kanan atas, nilai tinggi dan layak: mulai di sini; di sana ada Registrasi KRS dan Pembayaran UKT. Kiri atas, nilai tinggi tetapi data belum siap: perbaiki data dulu; di sana ada Kelulusan. Kanan bawah: mudah tetapi nilai kecil; ada PMB di dekat garis tengah. Kiri bawah: tunda; ada survei kepuasan.\"><line x1=\"70\" y1=\"250\" x2=\"560\" y2=\"250\" class=\"s-line\"/><line x1=\"70\" y1=\"250\" x2=\"70\" y2=\"16\" class=\"s-line\"/><text x=\"315\" y=\"276\" text-anchor=\"middle\" class=\"s-hd\">KELAYAKAN (FEASIBILITY) →</text><text x=\"22\" y=\"133\" text-anchor=\"middle\" class=\"s-hd\" transform=\"rotate(-90 22 133)\">NILAI BISNIS →</text><rect x=\"72\" y=\"18\" width=\"242\" height=\"114\" class=\"s-box\"/><rect x=\"316\" y=\"18\" width=\"242\" height=\"114\" class=\"s-acc\"/><rect x=\"72\" y=\"134\" width=\"242\" height=\"114\" class=\"s-box\"/><rect x=\"316\" y=\"134\" width=\"242\" height=\"114\" class=\"s-box\"/><text x=\"437\" y=\"40\" text-anchor=\"middle\" class=\"s-hd\">MULAI DI SINI</text><text x=\"193\" y=\"40\" text-anchor=\"middle\" class=\"s-hd\">PERBAIKI DATA DULU</text><text x=\"437\" y=\"240\" text-anchor=\"middle\" class=\"s-hd\">MUDAH, NILAI KECIL</text><text x=\"193\" y=\"240\" text-anchor=\"middle\" class=\"s-hd\">TUNDA</text><circle cx=\"420\" cy=\"76\" r=\"8\" class=\"s-hl\"/><text x=\"433\" y=\"81\" class=\"s-t\" style=\"font-size:13px\">Registrasi KRS</text><circle cx=\"385\" cy=\"106\" r=\"8\" class=\"s-hl\"/><text x=\"398\" y=\"111\" class=\"s-t\" style=\"font-size:13px\">Pembayaran UKT</text><circle cx=\"210\" cy=\"72\" r=\"8\" class=\"s-hl\"/><text x=\"223\" y=\"77\" class=\"s-t\" style=\"font-size:13px\">Kelulusan</text><circle cx=\"360\" cy=\"170\" r=\"8\" class=\"s-hl\"/><text x=\"373\" y=\"175\" class=\"s-t\" style=\"font-size:13px\">PMB</text><circle cx=\"150\" cy=\"196\" r=\"8\" class=\"s-hl\"/><text x=\"163\" y=\"201\" class=\"s-t\" style=\"font-size:13px\">Survei kepuasan</text><text x=\"590\" y=\"60\" class=\"s-s\">Nilai bisnis: dari wawancara</text><text x=\"590\" y=\"80\" class=\"s-s\">(seberapa penting bagi</text><text x=\"590\" y=\"100\" class=\"s-s\">keputusan pimpinan).</text><text x=\"590\" y=\"150\" class=\"s-s\">Kelayakan: dari profiling</text><text x=\"590\" y=\"170\" class=\"s-s\">(data ada, lengkap, bisa</text><text x=\"590\" y=\"190\" class=\"s-s\">diakses, berizin).</text></svg><figcaption>Kisi prioritas proses bisnis, diadaptasi dari Kimball et al. (2008). Posisi titik adalah contoh ilustrasi kampus.</figcaption></figure><p style=\"margin-top:.2em\"><button type=\"button\" class=\"term\" data-term=\"prioritization-grid\">Kisi prioritas</button> mempertemukan <b>nilai bisnis</b> (hasil wawancara) dengan <b>kelayakan</b> (hasil profiling).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Studi kasus</span><span>Kelompok · 20 menit · kasus ilustrasi</span></div><h2>Pesantren yang ingin memantau santri</h2><div class=\"cols w\"><div><p>Pesantren di Sidoarjo dengan 900 santri. Pengasuh ingin memantau <b>kemajuan hafalan</b> dan kaitannya dengan <b>kehadiran</b> serta <b>tunggakan syahriah</b>, per kelas dan per kamar.</p><ul style=\"font-size:.92em\"><li><b>Pendaftaran santri</b>: Google Form → Sheets, sejak 2022.</li><li><b>Pembayaran syahriah</b>: aplikasi keuangan, sejak 2019, bisa ekspor CSV.</li><li><b>Setoran hafalan</b>: buku kertas; sebagian kelas memakai Sheets sejak 2025.</li><li><b>Presensi kegiatan</b>: mesin sidik jari asrama; hanya menyimpan 3 bulan terakhir.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas kelompok</h3><ol><li>Susun bus matrix (proses × dimensi).</li><li>Tandai dimensi yang wajib dikonformasi.</li><li>Nilai ketersediaan data tiap proses.</li><li>Tempatkan di kisi prioritas dan pilih proses pertama.</li></ol></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 25 menit</span></div><h2>Bus matrix dan profil data kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Proses bisnis</th><th>Sumber</th><th>Riwayat</th><th>Mutu (profiling)</th><th>Izin</th><th>Keputusan</th></tr></thead><tbody><tr><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td><td>siap / perbaiki / tunda</td></tr><tr><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Susun bus matrix dari daftar proses dan pertanyaan analitik.</li><li>Isi tabel ketersediaan di kiri.</li><li>Jalankan profiling pada satu contoh data.</li><li>Pilih proses pertama untuk dimodelkan di Pertemuan 4.</li><li>Tetapkan kasus final hari ini.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Enterprise bus matrix</b>: baris = proses bisnis, kolom = dimensi bersama; peta rencana data warehouse.</li><li><b>Conformed dimension</b>: nama kolom dan isi sama, sehingga proses bisa digabung lewat <b>drill across</b>.</li><li>Konformasi juga berlaku untuk <b>shrunken dimension</b> dan <b>conformed fact</b> (nama sama = definisi sama).</li><li>Kebutuhan harus dipertemukan dengan <b>realitas data</b>: ada, riwayat, mutu, akses dan izin.</li><li><b>Profiling</b> memberi bukti; <b>kisi prioritas</b> memutuskan proses yang dibangun lebih dulu.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Baris = proses bisnis; kolom = dimensi bersama.\"><p class=\"q\">Dalam enterprise bus matrix Kimball, baris matriks berisi…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. departemen</button><button type=\"button\" data-o=\"b\">B. proses bisnis</button><button type=\"button\" data-o=\"c\">C. laporan</button><button type=\"button\" data-o=\"d\">D. dimensi</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Drill across membutuhkan atribut dimensi yang namanya dan isinya sama.\"><p class=\"q\">Hasil fakta KRS dan fakta pembayaran bisa digabung per prodi bila…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. grain keduanya sama</button><button type=\"button\" data-o=\"b\">B. dimensi Prodi terkonformasi</button><button type=\"button\" data-o=\"c\">C. datanya di server yang sama</button><button type=\"button\" data-o=\"d\">D. faktanya aditif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Kode yang tidak seragam diperbaiki di ETL dan disepakati bersama pemilik data.\"><p class=\"q\">Profiling: kolom kode_prodi berisi 9 kode untuk 7 prodi. Tindak lanjut terbaik…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. hapus kolomnya</button><button type=\"button\" data-o=\"b\">B. seragamkan kode lewat tabel pemetaan dan sepakati kode baku</button><button type=\"button\" data-o=\"c\">C. ganti grain tabel fakta</button><button type=\"button\" data-o=\"d\">D. abaikan saja</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Kimball &amp; Ross (2013): bagian enterprise data warehouse bus matrix dan conformed dimensions. Persiapan Pertemuan 4: bab Retail Sales tentang tabel fakta dan tabel dimensi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P2–3)</h3><ul><li>Dokumen kebutuhan final: pertanyaan analitik, KPI terdefinisi, proses bisnis, grain.</li><li>Enterprise bus matrix lengkap; tandai dimensi terkonformasi dan definisinya.</li><li>Tabel ketersediaan data dan ringkasan profiling (minimal satu sumber).</li><li>Kisi prioritas dan alasan pemilihan proses pertama.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa bus matrix dan contoh data proses pertama ke Pertemuan 4; kita mulai merancang tabel fakta dan dimensinya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Enterprise bus matrix</span></dt><dd>Matriks proses bisnis (baris) terhadap dimensi (kolom) yang menjadi peta rencana data warehouse. <i>(matriks bus)</i></dd></div><div><dt><span class=\"en\">Conformed dimension</span></dt><dd>Dimensi yang dipakai bersama oleh beberapa tabel fakta dengan isi dan arti yang sama, sehingga hasil analisis bisa digabung. <i>(dimensi terkonformasi / seragam)</i></dd></div><div><dt><span class=\"en\">Bus architecture</span></dt><dd>Arsitektur Kimball: dibangun per proses bisnis, disatukan dimensi bersama (conformed). <i>(arsitektur bus)</i></dd></div><div><dt><span class=\"en\">Business process</span></dt><dd>Kegiatan operasional organisasi yang menghasilkan atau mencatat ukuran kinerja, mis. registrasi KRS atau pembayaran UKT. <i>(proses bisnis)</i></dd></div><div><dt><span class=\"en\">Grain</span></dt><dd>Pernyataan tentang apa yang diwakili oleh satu baris tabel fakta. <i>(butir / tingkat kerincian)</i></dd></div><div><dt><span class=\"en\">Drill across</span></dt><dd>Menggabungkan hasil kueri dari dua atau lebih tabel fakta berdasarkan atribut dimensi terkonformasi yang sama. <i>(analisis lintas proses)</i></dd></div><div><dt><span class=\"en\">Shrunken dimension</span></dt><dd>Dimensi terkonformasi yang berisi sebagian baris atau kolom dimensi induknya, mis. dimensi Bulan dari dimensi Tanggal. <i>(dimensi ringkas)</i></dd></div><div><dt><span class=\"en\">Conformed fact</span></dt><dd>Fakta di beberapa tabel fakta yang memakai nama sama dan definisi teknis yang benar-benar sama. <i>(fakta terkonformasi)</i></dd></div><div><dt><span class=\"en\">Data steward</span></dt><dd>Orang dari pihak bisnis yang bertanggung jawab menyepakati definisi, kode, dan mutu data suatu subjek. <i>(pengampu data)</i></dd></div><div><dt><span class=\"en\">Source system</span></dt><dd>Sistem atau berkas asal data yang akan dimuat ke data warehouse, mis. SIAKAD, aplikasi keuangan, spreadsheet. <i>(sistem sumber)</i></dd></div><div><dt><span class=\"en\">Data profiling</span></dt><dd>Pemeriksaan isi data sumber: jumlah baris, nilai kosong, nilai unik, pola, dan anomali. <i>(profil data)</i></dd></div><div><dt><span class=\"en\">Null value</span></dt><dd>Nilai kosong: kolom yang tidak berisi data sama sekali. <i>(nilai kosong)</i></dd></div><div><dt><span class=\"en\">Prioritization grid</span></dt><dd>Kisi dua sumbu (nilai bisnis dan kelayakan) untuk menentukan proses bisnis yang dibangun lebih dulu. <i>(kisi prioritas)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Kimball, R., Ross, M., Thornthwaite, W., Mundy, J., &amp; Becker, B. (2008). <i>The data warehouse lifecycle toolkit</i> (2nd ed.). Wiley.</li><li>Reis, J., &amp; Housley, M. (2022). <i>Fundamentals of data engineering: Plan and build robust data systems</i>. O'Reilly Media.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Tabel Fakta &amp; Tabel Dimensi","subtitle":"Jenis tabel fakta dan ukuran (aditif, semi-aditif, non-aditif), dimensi dan hierarki, star vs snowflake","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Data Warehouse · SII047</span></div><h1>Tabel Fakta &amp; Tabel Dimensi</h1><p class=\"lead\">Jenis tabel fakta dan ukuran, atribut dan hierarki dimensi, star vs snowflake</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Konsep + workshop skema dimensional</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu merancang model dimensional lengkap, termasuk tabel fakta, dimensi, dan slowly changing dimension (C6).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: 1, 2, dan 4)</span></h3><ol><li>Ketepatan memilih jenis tabel fakta (transaksi, snapshot periodik, snapshot akumulasi, factless).</li><li>Kelengkapan atribut dan hierarki dimensi. <span class=\"muted\">(+ Pertemuan 5)</span></li><li>Ketepatan menerapkan surrogate key dan SCD tipe 1, 2, dan 3. <span class=\"muted\">(Pertemuan 5)</span></li><li>Ketepatan memilih star atau snowflake schema.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Dalam bus matrix, apa isi baris dan apa isi kolom?</li><li>Kapan sebuah dimensi disebut terkonformasi?</li><li>Apa yang dibutuhkan agar drill across per prodi bisa dilakukan?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Bus matrix kasus sudah lengkap?</li><li>Proses pertama sudah dipilih dari kisi prioritas?</li><li>Contoh data proses itu sudah dibawa?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta langkah</span><span>Empat langkah desain dimensional</span></div><h2>Langkah 3 dan 4: dimensi dan fakta</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Langkah</th><th>Pertanyaan</th><th>Status</th></tr></thead><tbody><tr><td><b>1</b> Select the business process</td><td>Kegiatan apa yang diukur?</td><td class=\"muted\">Pertemuan 2–3</td></tr><tr><td><b>2</b> Declare the grain</td><td>Satu baris tabel fakta mewakili apa?</td><td class=\"muted\">Pertemuan 2–3</td></tr><tr><td><b>3</b> Identify the dimensions</td><td>Siapa, apa, di mana, kapan, mengapa, bagaimana?</td><td><b>hari ini</b> + Pertemuan 5</td></tr><tr><td><b>4</b> Identify the facts</td><td>Angka apa yang dihasilkan peristiwa itu?</td><td><b>hari ini</b></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Nama langkah sesuai Kimball &amp; Ross (2013).</p><div class=\"callout\" style=\"margin-top:.6em\">Dimensi dan fakta harus <b>sesuai grain</b>. Bila sebuah kolom tidak cocok dengan grain, kolom itu milik tabel fakta lain.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"fact-table\">Tabel fakta</button>: tempat ukuran disimpan</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The fact table in a dimensional model stores the performance measurements resulting from an organization's business process events.\"</p><p class=\"tr\">\"Tabel fakta dalam sebuah model dimensional menyimpan ukuran-ukuran kinerja yang dihasilkan dari peristiwa-peristiwa proses bisnis sebuah organisasi.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Isi satu baris</h3><ul><li><b>Kunci</b> ke setiap tabel dimensi.</li><li><b>Fakta</b>: angka hasil peristiwa, umumnya dijumlahkan.</li><li>Kadang nomor transaksi tanpa tabel dimensi (<button type=\"button\" class=\"term\" data-term=\"degenerate-dimension\">degenerate dimension</button>).</li></ul><p class=\"muted\" style=\"font-size:.85em\">Baris banyak dan sempit; terus bertambah.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"dimension-table\">Tabel dimensi</button>: konteks bagi angka</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Dimension tables contain the descriptive attributes used by BI applications for filtering and grouping the facts.\"</p><p class=\"tr\">\"Tabel-tabel dimensi berisi atribut-atribut deskriptif yang digunakan oleh aplikasi-aplikasi BI untuk menyaring dan mengelompokkan fakta-fakta.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote><p style=\"font-size:.92em;margin-top:.5em\">Dimensi menjawab <b>siapa, apa, di mana, kapan, mengapa, bagaimana</b> di sekitar sebuah peristiwa.</p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Pertanyaan</th><th>Proses Penilaian kampus</th></tr></thead><tbody><tr><td>Siapa</td><td>Mahasiswa, Dosen</td></tr><tr><td>Apa</td><td>Mata kuliah</td></tr><tr><td>Di mana</td><td>Prodi</td></tr><tr><td>Kapan</td><td>Semester, Tanggal</td></tr><tr><td>Bagaimana</td><td>Kelas reguler / karyawan</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skema bintang</span><span>Kasus ilustrasi · indikator 1–2</span></div><h2>Satu proses, satu <button type=\"button\" class=\"term\" data-term=\"star-schema\">skema bintang</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 290\" style=\"max-height:15.5em\" role=\"img\" aria-label=\"Skema bintang penjualan UMKM. Di tengah tabel Fakta Penjualan dengan grain satu baris per item per struk, berisi enam kunci ke tabel dimensi, nomor struk sebagai degenerate dimension, dan fakta qty, nilai jual, diskon, HPP. Di kiri Dim Tanggal, Dim Produk, Dim Kanal; di kanan Dim Kasir, Dim Promosi, Dim Metode Bayar.\"><rect x=\"20\" y=\"20\" width=\"200\" height=\"50\" rx=\"6\" class=\"s-acc\"/><text x=\"120\" y=\"41\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Tanggal</text><text x=\"120\" y=\"60\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">tanggal, bulan, hari libur</text><line x1=\"220\" y1=\"45\" x2=\"320\" y2=\"150\" class=\"s-line\"/><rect x=\"20\" y=\"125\" width=\"200\" height=\"50\" rx=\"6\" class=\"s-acc\"/><text x=\"120\" y=\"146\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Produk</text><text x=\"120\" y=\"165\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">nama, kategori, ukuran</text><line x1=\"220\" y1=\"150\" x2=\"320\" y2=\"150\" class=\"s-line\"/><rect x=\"20\" y=\"230\" width=\"200\" height=\"50\" rx=\"6\" class=\"s-acc\"/><text x=\"120\" y=\"251\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Kanal</text><text x=\"120\" y=\"270\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">toko, marketplace, WhatsApp</text><line x1=\"220\" y1=\"255\" x2=\"320\" y2=\"150\" class=\"s-line\"/><rect x=\"680\" t></svg><figcaption>Skema bintang penjualan UMKM kasir, mengikuti pola studi kasus Retail Sales dalam Kimball &amp; Ross (2013). Nama tabel dan kolom adalah ilustrasi.</figcaption></figure><p style=\"margin-top:.2em;font-size:.95em\">Grain sama dengan Pertemuan 2: <b>satu baris per item produk per struk</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Jenis fakta</span><span>Indikator 1</span></div><h2>Boleh dijumlahkan atau tidak?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Jenis</th><th>Aturan</th><th>Contoh</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"additive-fact\">Additive</button></b></td><td>boleh dijumlahkan menurut <b>semua</b> dimensi</td><td>qty terjual, nilai jual, SKS diambil, nominal bayar</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"semi-additive-fact\">Semi-additive</button></b></td><td>boleh menurut sebagian dimensi, <b>tidak menurut waktu</b></td><td>stok gudang, saldo tunggakan UKT, jumlah santri aktif</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"non-additive-fact\">Non-additive</button></b></td><td>tidak boleh dijumlahkan</td><td>rasio, persentase, harga satuan, IPK</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.8em\">Untuk rasio, simpan <b>pembilang</b> dan <b>penyebut</b> yang aditif, lalu hitung rasionya setelah dijumlahkan.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Tiga jenis fakta menurut Kimball &amp; Ross (2013); contoh oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan cepat</span><span>Berpasangan · 5 menit · indikator 1</span></div><h2>Aditif, semi-aditif, atau non-aditif?</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 },{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Jenis tabel fakta</span><span>Indikator 1</span></div><h2>Empat jenis tabel fakta</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Jenis</th><th>Satu baris mewakili</th><th>Contoh kasus ilustrasi</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"transaction-fact-table\">Transaction</button></b></td><td>satu peristiwa pada satu titik waktu</td><td>item per struk kasir; satu pembayaran syahriah</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"periodic-snapshot\">Periodic snapshot</button></b></td><td>kondisi atau rangkuman pada periode baku</td><td>saldo tunggakan UKT per mahasiswa per bulan; stok per produk per hari</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"accumulating-snapshot\">Accumulating snapshot</button></b></td><td>satu kejadian berproses, diperbarui tiap tahap</td><td>satu pendaftar PMB: daftar → tes → lulus → daftar ulang</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"factless-fact-table\">Factless</button></b></td><td>pertemuan beberapa dimensi, tanpa ukuran</td><td>presensi santri per kegiatan; mata kuliah yang ditawarkan per semester</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Tiga jenis dasar dan factless fact table mengikuti Kimball &amp; Ross (2013); contoh oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Accumulating snapshot</span><span>Data ilustrasi · indikator 1</span></div><h2>Satu baris pendaftar yang terus diperbarui</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em;text-align:center\"><thead><tr><th style=\"text-align:left\">Kondisi baris</th><th>tgl_daftar</th><th>tgl_tes</th><th>tgl_lulus</th><th>tgl_daftar_ulang</th><th>hari daftar→ulang</th></tr></thead><tbody><tr><td style=\"text-align:left\">dimuat 5 Mei</td><td>3 Mei</td><td>–</td><td>–</td><td>–</td><td>–</td></tr><tr><td style=\"text-align:left\">diperbarui 20 Mei</td><td>3 Mei</td><td>18 Mei</td><td>–</td><td>–</td><td>–</td></tr><tr><td style=\"text-align:left\">diperbarui 12 Juni</td><td>3 Mei</td><td>18 Mei</td><td>25 Mei</td><td>10 Juni</td><td><b>38</b></td></tr></tbody></table></div><div class=\"cols\" style=\"margin-top:.7em\"><div class=\"card\"><p>Grain: <b>satu baris per pendaftar per gelombang</b> (Pertemuan 2). Baris yang <b>sama</b> diperbarui, tidak ditambah.</p></div><div class=\"card hl\"><p>Pertanyaan yang terjawab: berapa lama rata-rata pendaftar sampai daftar ulang? Di tahap mana paling banyak yang berhenti?</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi. \"–\" berarti tahap belum terjadi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Factless fact table</span><span>Kasus ilustrasi · indikator 1</span></div><h2>Mencatat peristiwa tanpa angka</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Peristiwa: presensi</h3><p><b>Fakta Presensi Kegiatan</b> pesantren: kunci Tanggal, Santri, Kegiatan, Kamar.</p><p>Tidak ada ukuran; hanya \"santri ini hadir di kegiatan ini\". Menghitung baris = menghitung kehadiran.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Cakupan: yang seharusnya terjadi</h3><p><b>Fakta Jadwal Wajib</b>: santri mana wajib ikut kegiatan apa, tanggal berapa.</p><p>Jadwal wajib <b>dikurangi</b> presensi = siapa yang <b>tidak hadir</b>.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Konsep factless dan coverage mengikuti Kimball &amp; Ross (2013); contoh ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Atribut dimensi</span><span>Indikator 2</span></div><h2>Atribut yang enak dibaca dan disaring</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Dim Mahasiswa</th><th>Kurang baik</th><th>Lebih baik</th></tr></thead><tbody><tr><td>Kode diterjemahkan</td><td><span class=\"phrase\">jalur = 2</span></td><td><span class=\"phrase\">Prestasi</span> (kode tetap disimpan)</td></tr><tr><td>Penanda berupa teks</td><td><span class=\"phrase\">bidikmisi = Y</span></td><td><span class=\"phrase\">Penerima KIP-K</span> / <span class=\"phrase\">Bukan penerima</span></td></tr><tr><td>Satu kolom, satu isi</td><td><span class=\"phrase\">angkatan_prodi = 2023SI</span></td><td><span class=\"phrase\">angkatan = 2023</span>, <span class=\"phrase\">prodi = Sistem Informasi</span></td></tr><tr><td>Hierarki ikut disimpan</td><td>hanya <span class=\"phrase\">kode_prodi</span></td><td>prodi, fakultas, universitas dalam satu tabel</td></tr><tr><td>Data pribadi seperlunya</td><td>NIK, alamat lengkap, nomor HP</td><td>kabupaten asal, kelompok usia</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Empat baris pertama mengikuti anjuran Kimball &amp; Ross (2013); baris terakhir prinsip minimisasi data (UU No. 27 Tahun 2022). Contoh ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hierarki</span><span>Indikator 2</span></div><h2>Hierarki di dalam dimensi</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Dim Prodi</h3><p>Prodi → Fakultas → Universitas</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Dim Wilayah</h3><p>Kelurahan/desa → Kecamatan → Kabupaten/kota → Provinsi</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Dim Produk</h3><p>Produk → Kategori → Jenis</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Dim Tanggal</h3><p>Tanggal → Bulan → Tahun; juga Tanggal → Semester → Tahun akademik</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Semua tingkat disimpan sebagai <b>kolom</b> di satu tabel dimensi. Roll-up dan drill-down cukup dengan GROUP BY kolom yang berbeda.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Hierarki tetap (fixed depth) dan beberapa hierarki dalam satu dimensi mengikuti Kimball &amp; Ross (2013). Dimensi tanggal dirinci di Pertemuan 5.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Star vs snowflake</span><span>Indikator 4</span></div><h2>Satu tabel datar atau beberapa tabel bertingkat?</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 218\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Perbandingan. Kiri, skema bintang: Fakta Penjualan terhubung ke satu tabel Dim Produk datar berisi kunci, nama produk, kategori, jenis produk, dan ukuran. Kanan, snowflake: Fakta Penjualan terhubung ke Dim Produk, yang terhubung ke Dim Kategori, yang terhubung ke Dim Jenis.\"><text x=\"215\" y=\"18\" text-anchor=\"middle\" class=\"s-hd\">STAR · DIMENSI DATAR</text><text x=\"680\" y=\"18\" text-anchor=\"middle\" class=\"s-hd\">SNOWFLAKE · DINORMALISASI</text><line x1=\"450\" y1=\"8\" x2=\"450\" y2=\"212\" class=\"s-dash\"/><rect x=\"20\" y=\"80\" width=\"140\" height=\"54\" rx=\"6\" class=\"s-soft\"/><text x=\"90\" y=\"112\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Fakta Penjualan</text><line x1=\"160\" y1=\"107\" x2=\"200\" y2=\"107\" class=\"s-line\"/><rect x=\"200\" y=\"40\" width=\"230\" height=\"140\" rx=\"6\" class=\"s-acc\"/><text x=\"315\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Dim Produk</text><text x=\"315\" y=\"84\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">produk_key</text><text x=\"315\" y=\"101\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">nama_produk</text><text x=\"315\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">kategori</text><text x=\"315\" y=\"135\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">jenis_produk</text><text x=\"315\" y=\"152\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">ukuran</text><rect x=\"462\" y=\"82\" width=\"134\" height=\"54\" rx=\"6\" class=\"s-soft\"/><text x=\"529\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Fakta Penjualan</text><line x1=\"596\" y1=\"109\" x2=\"610\" y2=\"60\" class=\"s-line\"/><rect x=\"610\" y=\"28\" width=\"130\" height=\"80\" rx=\"6\" class=\"s-acc\"/><text x=\"675\" y=\"52\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Dim Produk</text><text x=\"675\" y=\"72\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">nama_produk</text><text x=\"675\" y=\"89\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">kategori_key</text><line x1=\"675\" y1=\"108\" x2=\"675\" y2=\"128\" class=\"s-line\"/><rect x=\"610\" y=\"128\" width=\"130\" height=\"80\" rx=\"6\" class=\"s-box\"/><text x=\"675\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Dim Kategori</text><text x=\"675\" y=\"172\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">nama_kategori</text><text x=\"675\" y=\"189\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">jenis_key</text><line x1=\"740\" y1=\"168\" x2=\"760\" y2=\"168\" class=\"s-line\"/><rect x=\"760\" y=\"128\" width=\"125\" height=\"80\" rx=\"6\" class=\"s-box\"/><text x=\"822.5\" y=\"152\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Dim Jenis</text><text x=\"822.5\" y=\"172\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">nama_jenis</text></svg><figcaption>Dimensi Produk sebagai skema bintang dan sebagai snowflake. Isi informasinya sama; yang berbeda jumlah tabel dan join. Konsep mengikuti Kimball &amp; Ross (2013); contoh ilustrasi.</figcaption></figure><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A flattened denormalized dimension table contains exactly the same information as a snowflaked dimension.\"</p><p class=\"tr\">\"Sebuah tabel dimensi yang didatarkan dan didenormalisasi berisi informasi yang persis sama dengan sebuah dimensi yang di-snowflake.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Memilih</span><span>Indikator 4</span></div><h2>Kapan star, kapan snowflake?</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Aspek</th><th><button type=\"button\" class=\"term\" data-term=\"star-schema\">Star</button></th><th><button type=\"button\" class=\"term\" data-term=\"snowflake-schema\">Snowflake</button></th></tr></thead><tbody><tr><td><b>Dipahami pengguna</b></td><td>mudah: satu tabel per dimensi</td><td>lebih sulit: banyak tabel kecil</td></tr><tr><td><b>Kueri</b></td><td>lebih sedikit join</td><td>lebih banyak join</td></tr><tr><td><b>Ruang simpan</b></td><td>ada pengulangan teks di dimensi</td><td>sedikit lebih hemat</td></tr><tr><td><b>Perubahan atribut</b></td><td>ditangani ETL (Pertemuan 5, 9–10)</td><td>terlihat lebih mudah, tetapi join bertambah</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.8em\">Anjuran Kimball: <b>pakai star</b>. Untuk proyek kelompok, star schema adalah pilihan bawaan; snowflake harus punya alasan yang ditulis.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Diringkas dari Kimball &amp; Ross (2013); baris \"Perubahan atribut\" rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh utuh</span><span>Kasus ilustrasi · indikator 1, 2, 4</span></div><h2>Skema bintang proses Penilaian</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Komponen</th><th>Rancangan</th></tr></thead><tbody><tr><td><b>Grain</b></td><td>satu baris per mata kuliah yang dinilai untuk seorang mahasiswa pada satu semester</td></tr><tr><td><b>Jenis tabel fakta</b></td><td>transaksi (satu peristiwa nilai akhir)</td></tr><tr><td><b>Dimensi</b></td><td>Semester · Mahasiswa · Prodi · Mata Kuliah · Dosen <span class=\"muted\">(Semester, Mahasiswa, Prodi terkonformasi)</span></td></tr><tr><td><b>Hierarki</b></td><td>Prodi → Fakultas · Semester → Tahun akademik</td></tr><tr><td><b>Fakta</b></td><td><span class=\"phrase\">sks</span> (aditif) · <span class=\"phrase\">bobot_nilai</span> 0–4 (non-aditif) · <span class=\"phrase\">mutu</span> = sks × bobot (aditif)</td></tr><tr><td><b>IPK/IPS</b></td><td>dihitung saat kueri: <span class=\"phrase\">SUM(mutu) / SUM(sks)</span></td></tr><tr><td><b>Skema</b></td><td>star; tidak ada alasan untuk snowflake</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi; nama kolom contoh.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop</span><span>Kelompok Tugas 1 · 35 menit</span></div><h2>Rancang skema bintang proses pertama Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Komponen</th><th>Isi kelompok</th></tr></thead><tbody><tr><td>Proses &amp; grain</td><td>…</td></tr><tr><td>Jenis tabel fakta + alasan</td><td>…</td></tr><tr><td>Dimensi (≥ 4) + atribut utama</td><td>…</td></tr><tr><td>Hierarki</td><td>…</td></tr><tr><td>Fakta + sifat aditif</td><td>…</td></tr><tr><td>Degenerate dimension</td><td>…</td></tr><tr><td>Star / snowflake + alasan</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Langkah</h3><ol><li>Tulis ulang kalimat grain.</li><li>Pakai dimensi terkonformasi dari bus matrix.</li><li>Cek setiap kolom terhadap grain.</li><li>Gambar skema di kertas atau draw.io.</li><li>Tukar dengan kelompok lain untuk dicek.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Tabel fakta</b> menyimpan ukuran peristiwa proses bisnis; <b>tabel dimensi</b> menyimpan konteks untuk menyaring dan mengelompokkan.</li><li>Fakta bisa <b>aditif</b>, <b>semi-aditif</b> (tidak menurut waktu), atau <b>non-aditif</b> (simpan pembilang dan penyebut).</li><li>Empat jenis tabel fakta: <b>transaksi</b>, <b>snapshot periodik</b>, <b>snapshot akumulasi</b>, <b>factless</b>.</li><li>Atribut dimensi berupa teks bermakna; <b>hierarki</b> disimpan sebagai kolom di satu dimensi.</li><li><b>Star</b> adalah pilihan bawaan; <b>snowflake</b> butuh alasan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Saldo boleh dijumlahkan antar-mahasiswa atau antar-prodi, tetapi tidak menurut waktu.\"><p class=\"q\">\"Saldo tunggakan UKT per mahasiswa per akhir bulan\" termasuk fakta…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. aditif</button><button type=\"button\" data-o=\"b\">B. semi-aditif</button><button type=\"button\" data-o=\"c\">C. non-aditif</button><button type=\"button\" data-o=\"d\">D. bukan fakta</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Accumulating snapshot: satu baris per kejadian berproses, diperbarui tiap tahap.\"><p class=\"q\">Satu baris per pendaftar PMB yang diperbarui saat tes, lulus, dan daftar ulang adalah tabel fakta…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. transaksi</button><button type=\"button\" data-o=\"b\">B. snapshot periodik</button><button type=\"button\" data-o=\"c\">C. snapshot akumulasi</button><button type=\"button\" data-o=\"d\">D. factless</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"IPK = jumlah mutu ÷ jumlah sks; keduanya aditif, sedangkan IPK sendiri non-aditif.\"><p class=\"q\">Agar IPK per prodi dapat dihitung dengan benar, tabel fakta Penilaian sebaiknya menyimpan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. IPK setiap mahasiswa</button><button type=\"button\" data-o=\"b\">B. sks dan mutu (sks × bobot)</button><button type=\"button\" data-o=\"c\">C. rata-rata nilai huruf</button><button type=\"button\" data-o=\"d\">D. persentase kelulusan</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Kimball &amp; Ross (2013): bab Retail Sales (skema bintang lengkap). Persiapan Pertemuan 5: bagian surrogate key dan slowly changing dimension.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5 · 10%)</h3><ul><li>Rapikan skema bintang proses pertama dari workshop.</li><li>Lengkapi daftar atribut tiap dimensi dan hierarkinya.</li><li>Tandai sifat aditif setiap fakta; untuk rasio, tulis komponennya.</li><li>Tulis alasan jenis tabel fakta dan pilihan star/snowflake.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Penilaian Hasil Produk. Tenggat: [PERLU DIISI]. Surrogate key dan SCD ditambahkan setelah Pertemuan 5.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Fact table</span></dt><dd>Tabel yang menyimpan ukuran-ukuran sebuah proses bisnis pada grain tertentu, beserta kunci ke tabel dimensi. <i>(tabel fakta)</i></dd></div><div><dt><span class=\"en\">Dimension table</span></dt><dd>Tabel yang menyimpan atribut deskriptif, mis. nama prodi, fakultas, atau kategori produk, untuk menyaring dan mengelompokkan fakta. <i>(tabel dimensi)</i></dd></div><div><dt><span class=\"en\">Grain</span></dt><dd>Pernyataan tentang apa yang diwakili oleh satu baris tabel fakta. <i>(butir / tingkat kerincian)</i></dd></div><div><dt><span class=\"en\">Additive fact</span></dt><dd>Fakta yang dapat dijumlahkan menurut semua dimensi, mis. jumlah terjual atau SKS diambil. <i>(fakta aditif)</i></dd></div><div><dt><span class=\"en\">Semi-additive fact</span></dt><dd>Fakta yang dapat dijumlahkan menurut sebagian dimensi saja; saldo dan stok tidak boleh dijumlahkan menurut waktu. <i>(fakta semi-aditif)</i></dd></div><div><dt><span class=\"en\">Non-additive fact</span></dt><dd>Fakta yang tidak boleh dijumlahkan, mis. rasio, persentase, atau harga satuan; simpan pembilang dan penyebutnya. <i>(fakta non-aditif)</i></dd></div><div><dt><span class=\"en\">Transaction fact table</span></dt><dd>Tabel fakta dengan satu baris per peristiwa pengukuran pada satu titik waktu dan tempat. <i>(tabel fakta transaksi)</i></dd></div><div><dt><span class=\"en\">Periodic snapshot fact table</span></dt><dd>Tabel fakta dengan satu baris per periode baku (hari, minggu, bulan) yang merangkum kondisi atau aktivitas periode itu. <i>(tabel fakta snapshot periodik)</i></dd></div><div><dt><span class=\"en\">Accumulating snapshot fact table</span></dt><dd>Tabel fakta dengan satu baris per kejadian berproses (mis. satu pendaftar) yang diperbarui setiap kali tahapan terlewati. <i>(tabel fakta snapshot akumulasi)</i></dd></div><div><dt><span class=\"en\">Factless fact table</span></dt><dd>Tabel fakta tanpa ukuran numerik; hanya mencatat pertemuan beberapa dimensi, mis. presensi atau cakupan. <i>(tabel fakta tanpa fakta)</i></dd></div><div><dt><span class=\"en\">Degenerate dimension</span></dt><dd>Kunci dimensi tanpa tabel dimensi, disimpan langsung di tabel fakta, mis. nomor struk atau nomor KRS. <i>(dimensi degenerat)</i></dd></div><div><dt><span class=\"en\">Hierarchy</span></dt><dd>Rangkaian atribut bertingkat banyak-ke-satu dalam satu dimensi, mis. prodi → fakultas → universitas. <i>(hierarki)</i></dd></div><div><dt><span class=\"en\">Star schema</span></dt><dd>Model dimensional di basis data relasional: satu tabel fakta di tengah, dikelilingi tabel dimensi yang tidak dinormalisasi. <i>(skema bintang)</i></dd></div><div><dt><span class=\"en\">Snowflake schema</span></dt><dd>Variasi skema bintang yang tabel dimensinya dinormalisasi menjadi beberapa tabel bertingkat. <i>(skema kepingan salju)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Surrogate Key &amp; Slowly Changing Dimension","subtitle":"Surrogate key, SCD tipe 1, 2, 3, dimensi tanggal, role-playing dan junk dimension","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Data Warehouse · SII047</span></div><h1>Surrogate Key &amp; Slowly Changing Dimension</h1><p class=\"lead\">Surrogate key, SCD tipe 1, 2, 3, dimensi tanggal, role-playing dan junk dimension</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Konsep + simulasi + workshop &amp; penilaian sejawat</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu merancang model dimensional lengkap, termasuk tabel fakta, dimensi, dan slowly changing dimension (C6).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: 2 dan 3)</span></h3><ol><li>Ketepatan memilih jenis tabel fakta (transaksi, snapshot periodik, snapshot akumulasi, factless). <span class=\"muted\">(Pertemuan 4)</span></li><li>Kelengkapan atribut dan hierarki dimensi. <span class=\"muted\">(lanjutan P4)</span></li><li>Ketepatan menerapkan surrogate key dan SCD tipe 1, 2, dan 3.</li><li>Ketepatan memilih star atau snowflake schema. <span class=\"muted\">(Pertemuan 4)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan empat jenis tabel fakta.</li><li>Mengapa IPK tidak disimpan sebagai fakta?</li><li>Apa anjuran Kimball: star atau snowflake?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Skema bintang proses pertama sudah rapi?</li><li>Atribut tiap dimensi sudah didaftar?</li><li>Ada atribut yang bisa berubah dari waktu ke waktu?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Kasus ilustrasi</span></div><h2>Mahasiswa yang pindah prodi</h2><div class=\"cols w\"><div><p class=\"lead\">Ani masuk <b>Sistem Informasi</b> tahun 2021. Mulai September 2023 ia pindah ke <b>Informatika</b>. SIAKAD langsung menimpa kolom prodi.</p><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Laporan jumlah SKS diambil, 2022</th><th>Dibuat 2022</th><th>Dibuat ulang 2024</th></tr></thead><tbody><tr><td>Sistem Informasi</td><td>12.480</td><td>12.440</td></tr><tr><td>Informatika</td><td>15.960</td><td>16.000</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi. Selisih 40 SKS = SKS Ani tahun 2022.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Diskusikan berpasangan</h3><ol><li>Mengapa laporan tahun 2022 berubah angka?</li><li>Laporan mana yang benar?</li><li>Apa yang harus disimpan agar keduanya bisa dijawab?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"natural-key\">Natural key</button> vs <button type=\"button\" class=\"term\" data-term=\"surrogate-key\">surrogate key</button></h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>mahasiswa_key</th><th>nim</th><th>nama</th><th>prodi</th></tr></thead><tbody><tr><td><b>1041</b></td><td>2110001</td><td>Ani</td><td>Sistem Informasi</td></tr><tr><td><b>2307</b></td><td>2110001</td><td>Ani</td><td>Informatika</td></tr><tr><td><b>1042</b></td><td>2110002</td><td>Budi</td><td>Sistem Informasi</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi. Satu NIM bisa punya beberapa baris; kuncinya tetap unik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Mengapa surrogate key?</h3><ul><li>Satu natural key bisa punya <b>beberapa versi</b> baris.</li><li>Natural key dari beberapa sistem bisa <b>bentrok</b> atau tidak terkelola.</li><li>Data warehouse <b>mengendalikan</b> kunci dimensinya sendiri.</li><li>Bilangan bulat berurutan mulai 1, tanpa makna.</li></ul><p class=\"muted\" style=\"font-size:.82em\">Diringkas dari Kimball &amp; Ross (2013).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Baris bawaan</span><span>Indikator 2–3</span></div><h2>Kunci fakta tidak boleh kosong</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>promosi_key</th><th>nama_promosi</th><th>Dipakai bila…</th></tr></thead><tbody><tr><td><b>-1</b></td><td>Tidak diketahui</td><td>data sumber kosong atau rusak</td></tr><tr><td><b>-2</b></td><td>Tanpa promosi</td><td>transaksi memang tidak memakai promosi</td></tr><tr><td><b>1</b></td><td>Diskon Ramadan</td><td>baris biasa</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Nilai -1 dan -2 adalah konvensi mata kuliah ini; contoh ilustrasi.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Mengapa?</h3><ul><li>Join fakta–dimensi tidak kehilangan baris.</li><li>Laporan menampilkan label jelas, bukan kosong.</li><li>Dimensi tanggal punya baris <b>Belum terjadi</b> untuk snapshot akumulasi (P4).</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SCD</span><span>Indikator 3</span></div><h2>Tiga cara menyimpan perubahan</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Tipe</th><th>Kalimat asli</th><th>Terjemahan harfiah</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"scd-type-1\">Tipe 1</button></b></td><td lang=\"en\"><i>With slowly changing dimension type 1, the old attribute value in the dimension row is overwritten with the new value; type 1 attributes always reflects the most recent assignment …</i></td><td>Dengan slowly changing dimension tipe 1, nilai atribut lama di baris dimensi ditimpa dengan nilai baru; atribut-atribut tipe 1 selalu mencerminkan penetapan yang paling baru …</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"scd-type-2\">Tipe 2</button></b></td><td lang=\"en\"><i>Slowly changing dimension type 2 changes add a new row in the dimension with the updated attribute values.</i></td><td>Perubahan-perubahan slowly changing dimension tipe 2 menambahkan sebuah baris baru di dalam dimensi dengan nilai-nilai atribut yang diperbarui.</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"scd-type-3\">Tipe 3</button></b></td><td lang=\"en\"><i>Slowly changing dimension type 3 changes add a new attribute in the dimension to preserve the old attribute value; the new value overwrites the main attribute as in a type 1 change.</i></td><td>Perubahan-perubahan slowly changing dimension tipe 3 menambahkan sebuah atribut baru di dalam dimensi untuk mempertahankan nilai atribut lama; nilai baru menimpa atribut utama seperti dalam sebuah perubahan tipe 1.</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun. Buku membahas tipe 0 sampai 7; RPS memfokuskan tipe 1, 2, 3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SCD tipe 1</span><span>Kasus ilustrasi · indikator 3</span></div><h2>Tipe 1: timpa saja</h2><div class=\"cols\"><div><h3>Sebelum</h3><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>key</th><th>nim</th><th>nama</th><th>no_hp</th></tr></thead><tbody><tr><td>1042</td><td>2110002</td><td>Budy</td><td>0812…11</td></tr></tbody></table></div><h3 style=\"margin-top:.6em\">Sesudah</h3><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>key</th><th>nim</th><th>nama</th><th>no_hp</th></tr></thead><tbody><tr><td>1042</td><td>2110002</td><td><b>Budi</b></td><td><b>0857…29</b></td></tr></tbody></table></div></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cocok untuk</h3><ul><li>Koreksi salah ketik (Budy → Budi).</li><li>Atribut yang riwayatnya tidak dibutuhkan analisis.</li></ul><h3 style=\"margin-top:.5em\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko</h3><ul><li>Riwayat hilang; laporan lama bisa berubah.</li><li>Agregat yang sudah dihitung perlu dihitung ulang.</li></ul></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Data ilustrasi; nomor HP disamarkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SCD tipe 2</span><span>Simulasi bertahap · indikator 3</span></div><h2>Tipe 2: baris baru, riwayat terjaga</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;dw5-scd2&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Deteksi perubahan&quot;,&quot;en&quot;:&quot;compare&quot;,&quot;d&quot;:&quot;ETL membandingkan data SIAKAD dengan baris Dim Mahasiswa yang berlaku. NIM 2110001: prodi di sumber &lt;b&gt;Informatika&lt;/b&gt;, di dimensi &lt;b&gt;Sistem Informasi&lt;/b&gt;. Prodi ditetapkan sebagai atribut tipe 2.&quot;,&quot;ex&quot;:&quot;Baris berlaku: key 1041 · Sistem Informasi · berlaku 2021-09-01 s.d. 9999-12-31 · current = Ya.&quot;},{&quot;t&quot;:&quot;Tutup baris lama&quot;,&quot;en&quot;:&quot;expire&quot;,&quot;d&quot;:&quot;Baris 1041 tidak dihapus. Tanggal akhirnya diisi sehari sebelum perubahan, dan penandanya diubah.&quot;,&quot;ex&quot;:&quot;key 1041 · berlaku sampai &lt;b&gt;2023-08-31&lt;/b&gt; · current = &lt;b&gt;Tidak&lt;/b&gt;.&quot;},{&quot;t&quot;:&quot;Sisipkan baris baru&quot;,&quot;en&quot;:&quot;insert&quot;,&quot;d&quot;:&quot;Baris baru untuk NIM yang sama dengan surrogate key berikutnya dalam urutan dan nilai atribut terbaru.&quot;,&quot;ex&quot;:&quot;key &lt;b&gt;2307&lt;/b&gt; · NIM 2110001 · Informatika · berlaku &lt;b&gt;2023-09-01&lt;/b&gt; s.d. 9999-12-31 · current = Ya.&quot;},{&quot;t&quot;:&quot;Fakta baru pakai key baru&quot;,&quot;en&quot;:&quot;lookup&quot;,&quot;d&quot;:&quot;Saat memuat fakta KRS semester Ganjil 2023/2024, ETL mencari baris NIM 2110001 yang berlaku pada tanggal transaksi.&quot;,&quot;ex&quot;:&quot;KRS 2023-09-12 → key 2307 (Informatika).&quot;},{&quot;t&quot;:&quot;Fakta lama tetap&quot;,&quot;en&quot;:&quot;history&quot;,&quot;d&quot;:&quot;Fakta KRS tahun 2022 masih menunjuk key 1041. Laporan menurut keadaan saat itu tetap menghitung SKS Ani di Sistem Informasi.&quot;,&quot;ex&quot;:&quot;Laporan SKS 2022 per prodi kembali 12.480 (SI) dan 15.960 (Informatika), sama dengan laporan asli.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Klik Play atau pilih langkah. Data ilustrasi melanjutkan kasus pemantik.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SCD tipe 2</span><span>Kueri · indikator 3</span></div><h2>Saat itu atau sekarang?</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Menurut keadaan saat itu</h3><p>Join biasa lewat surrogate key.</p><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.68em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.6em .7em;overflow-x:auto;white-space:pre\">SELECT m.prodi, SUM(f.sks)\nFROM fakta_krs f\nJOIN dim_mahasiswa m\n  ON m.mahasiswa_key = f.mahasiswa_key\nWHERE f.tahun = 2022\nGROUP BY m.prodi;</pre></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Menurut keadaan sekarang</h3><p>Ambil prodi dari baris berlaku untuk NIM yang sama.</p><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.68em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.6em .7em;overflow-x:auto;white-space:pre\">SELECT c.prodi, SUM(f.sks)\nFROM fakta_krs f\nJOIN dim_mahasiswa m ON m.mahasiswa_key = f.mahasiswa_key\nJOIN dim_mahasiswa c ON c.nim = m.nim\n     AND c.is_current = 'Ya'\nWHERE f.tahun = 2022\nGROUP BY c.prodi;</pre></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Contoh kueri PostgreSQL; nama tabel dan kolom ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SCD tipe 3</span><span>Kasus ilustrasi · indikator 3</span></div><h2>Tipe 3: simpan nilai sebelumnya di kolom</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>prodi_key</th><th>prodi</th><th>fakultas</th><th>fakultas_sebelumnya</th></tr></thead><tbody><tr><td>3</td><td>Sistem Informasi</td><td><b>Fakultas Ilmu Komputer</b></td><td>Fakultas Teknik</td></tr><tr><td>4</td><td>Informatika</td><td><b>Fakultas Ilmu Komputer</b></td><td>Fakultas Teknik</td></tr><tr><td>5</td><td>Teknik Industri</td><td>Fakultas Teknik</td><td>Fakultas Teknik</td></tr></tbody></table></div><div class=\"cols\" style=\"margin-top:.7em\"><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Cocok untuk</h3><p>Perubahan besar sekali waktu (restrukturisasi fakultas) yang ingin dilihat <b>dari dua sisi</b>: struktur lama dan baru.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Batas</h3><p>Hanya satu nilai sebelumnya. Bila berubah lagi, nilai yang lebih lama hilang. Jarang dipakai.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi restrukturisasi fakultas.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Pilih jawaban · indikator 3</span></div><h2>Permintaan dari BAAK dan dekan</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;dw5-scd-scen&quot;,&quot;start&quot;:&quot;a&quot;,&quot;ask&quot;:&quot;Atribut fakultas di Dim Prodi sebaiknya ditangani dengan tipe apa?&quot;,&quot;nodes&quot;:{&quot;a&quot;:{&quot;text&quot;:&quot;Tahun 2026 Prodi SI dan Informatika pindah dari Fakultas Teknik ke Fakultas Ilmu Komputer. Data warehouse menyimpan lulusan 2022–2026.&quot;,&quot;say&quot;:[[&quot;BAAK&quot;,&quot;Untuk laporan akreditasi, jumlah lulusan per fakultas tiap tahun harus sesuai struktur yang berlaku pada tahun itu.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Tipe 1: timpa fakultas dengan nilai baru&quot;,&quot;tag&quot;:&quot;Tipe 1&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Semua lulusan 2022–2025 ikut tercatat di Fakultas Ilmu Komputer, padahal fakultas itu belum ada. Laporan akreditasi menjadi salah.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Tipe 2: tutup baris lama, sisipkan baris baru per 2026&quot;,&quot;tag&quot;:&quot;Tipe 2&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Lulusan sebelum 2026 tetap menunjuk baris Fakultas Teknik, lulusan 2026 menunjuk baris baru. Laporan menurut keadaan saat itu benar.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Tipe 3: tambah kolom fakultas_sebelumnya&quot;,&quot;tag&quot;:&quot;Tipe 3&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Setengah tepat. Struktur lama dan baru bisa dibandingkan, tetapi kedua kolom berlaku untuk semua tahun sekaligus, bukan per tahun. Untuk laporan per tahun menurut keadaan saat itu, tipe 2 lebih tepat.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Sebulan kemudian dekan Fakultas Ilmu Komputer meminta grafik tren lulusan 2022–2026 seolah-olah struktur baru sudah berlaku sejak awal.&quot;,&quot;say&quot;:[[&quot;Dekan&quot;,&quot;Saya ingin melihat perkembangan prodi-prodi yang sekarang ada di fakultas saya.&quot;]],&quot;ask&quot;:&quot;Dengan dimensi yang sudah memakai tipe 2, bagaimana menjawabnya?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Kelompokkan menurut fakultas di baris yang sedang berlaku (current) untuk tiap prodi&quot;,&quot;tag&quot;:&quot;Pakai baris current&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Sama seperti kueri \\&quot;menurut keadaan sekarang\\&quot;: ambil fakultas dari baris berlaku lewat natural key prodi.&quot;,&quot;to&quot;:&quot;end1&quot;},{&quot;t&quot;:&quot;Ubah semua baris lama menjadi Fakultas Ilmu Komputer&quot;,&quot;tag&quot;:&quot;Timpa riwayat&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Ini mengubah tipe 2 menjadi tipe 1 dan merusak laporan akreditasi yang diminta BAAK.&quot;,&quot;to&quot;:&quot;end2&quot;},{&quot;t&quot;:&quot;Buat salinan data warehouse khusus fakultas&quot;,&quot;tag&quot;:&quot;Salin data&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Data ganda membuat angka mudah berbeda antarlaporan, melanggar tujuan konsistensi (Pertemuan 1).&quot;,&quot;to&quot;:&quot;end2&quot;}]},&quot;end1&quot;:{&quot;end&quot;:&quot;Tipe 2 menjaga laporan menurut keadaan saat itu, dan kueri lewat baris current tetap bisa menjawab menurut keadaan sekarang. Keduanya dari satu sumber data.&quot;,&quot;title&quot;:&quot;Dua pertanyaan, satu model&quot;,&quot;k&quot;:&quot;good&quot;},&quot;end2&quot;:{&quot;end&quot;:&quot;Riwayat yang sudah dijaga jangan ditimpa atau digandakan. Kembali ke awal dan coba jalur lain.&quot;,&quot;title&quot;:&quot;Riwayat terancam&quot;,&quot;k&quot;:&quot;bad&quot;}}}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi. Formatif, tidak dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Keputusan per atribut</span><span>Indikator 3</span></div><h2>Satu dimensi, beberapa tipe</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Atribut Dim Mahasiswa</th><th>Tipe</th><th>Alasan</th></tr></thead><tbody><tr><td>jalur_masuk, angkatan</td><td><b>0</b></td><td>nilai asli tidak boleh berubah</td></tr><tr><td>nama (koreksi ejaan)</td><td><b>1</b></td><td>nilai lama memang salah</td></tr><tr><td>prodi</td><td><b>2</b></td><td>laporan per prodi menurut saat itu</td></tr><tr><td>kabupaten_asal</td><td><b>2</b></td><td>analisis sebaran wilayah per tahun</td></tr><tr><td>status_beasiswa</td><td><b>2</b> atau fakta</td><td>bila berubah tiap semester, lebih cocok di tabel fakta snapshot</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Contoh ilustrasi. Tipe 0 (retain original) disebut Kimball &amp; Ross (2013), di luar fokus RPS.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dimensi tanggal</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"date-dimension\">Dim Tanggal</button>: satu baris per hari</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.85em\"><thead><tr><th>Atribut</th><th>Contoh (2026-03-20)</th></tr></thead><tbody><tr><td>tanggal_key</td><td><b>20260320</b></td></tr><tr><td>nama_hari · hari_kerja</td><td>Jumat · Ya</td></tr><tr><td>bulan · tahun</td><td>Maret · 2026</td></tr><tr><td>semester · tahun_akademik</td><td>Genap · 2025/2026</td></tr><tr><td>libur_nasional · nama_libur</td><td>Ya · Idulfitri 1447 H</td></tr><tr><td>periode_khusus</td><td>Libur lebaran</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Mengapa tabel, bukan fungsi SQL?</h3><ul><li>Libur nasional dan kalender akademik tidak bisa dihitung rumus.</li><li>Label konsisten di semua laporan.</li><li>Kunci YYYYMMDD boleh; baris khusus untuk tanggal tidak diketahui.</li><li>Jam dalam sehari: dimensi terpisah.</li></ul></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Konsep mengikuti Kimball &amp; Ross (2013). Contoh ilustrasi; tanggal libur harus dicek dengan SKB libur nasional yang berlaku.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Role-playing</span><span>Indikator 2</span></div><h2>Satu Dim Tanggal, banyak peran</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 250\" style=\"max-height:12em\" role=\"img\" aria-label=\"Tabel fakta PMB punya empat kunci tanggal: tanggal daftar, tes, lulus, dan daftar ulang. Masing-masing melalui view berbeda menunjuk ke satu tabel fisik Dim Tanggal.\"><rect x=\"20\" y=\"40\" width=\"230\" height=\"200\" rx=\"6\" class=\"s-soft\"/><text x=\"135\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">FAKTA PMB</text><text x=\"135\" y=\"86\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">accumulating snapshot</text><text x=\"38\" y=\"112\" class=\"s-t\" style=\"font-size:12.5px\">tgl_daftar_key</text><line x1=\"250\" y1=\"108\" x2=\"330\" y2=\"108\" class=\"s-line\"/><rect x=\"330\" y=\"92\" width=\"200\" height=\"28\" rx=\"4\" class=\"s-box\"/><text x=\"430\" y=\"111\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">v_tgl_daftar (view)</text><line x1=\"530\" y1=\"106\" x2=\"640\" y2=\"140\" class=\"s-dash\"/><text x=\"38\" y=\"144\" class=\"s-t\" style=\"font-size:12.5px\">tgl_tes_key</text><line x1=\"250\" y1=\"140\" x2=\"330\" y2=\"140\" class=\"s-line\"/><rect x=\"330\" y=\"124\" width=\"200\" height=\"28\" rx=\"4\" class=\"s-box\"/><text x=\"430\" y=\"143\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">v_tgl_tes (view)</text><line x1=\"530\" y1=\"138\" x2=\"640\" y2=\"140\" class=\"s-dash\"/><text x=\"38\" y=\"176\" class=\"s-t\" style=\"font-size:12.5px\">tgl_lulus_key</text><line x1=\"250\" y1=\"172\" x2=\"330\" y2=\"172\" class=\"s-line\"/><rect x=\"330\" y=\"156\" width=\"200\" height=\"28\" rx=\"4\" class=\"s-box\"/><text x=\"430\" y=\"175\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">v_tgl_lulus (view)</text><line x1=\"530\" y1=\"170\" x2=\"640\" y2=\"140\" class=\"s-dash\"/><text x=\"38\" y=\"208\" class=\"s-t\" style=\"font-size:12.5px\">tgl_daftar_ulang_key</text><line x1=\"250\" y1=\"204\" x2=\"330\" y2=\"204\" class=\"s-line\"/><rect x=\"330\" y=\"188\" width=\"200\" height=\"28\" rx=\"4\" class=\"s-box\"/><text x=\"430\" y=\"207\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">v_tgl_daftar_ulang (view)</text><line x1=\"530\" y1=\"202\" x2=\"640\" y2=\"140\" class=\"s-dash\"/><rect x=\"640\" y=\"95\" width=\"240\" height=\"90\" rx=\"6\" class=\"s-acc\"/><text x=\"760\" y=\"125\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">Dim Tanggal</text><text x=\"760\" y=\"147\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">satu tabel fisik</text><text x=\"760\" y=\"166\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">satu baris per hari</text></svg><figcaption>Role-playing dimension: satu Dim Tanggal fisik, empat view dengan nama kolom berbeda. Konsep mengikuti Kimball &amp; Ross (2013); nama tabel ilustrasi.</figcaption></figure><pre style=\"margin:.4em 0 0;font-family:var(--mono);font-size:.66em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;overflow-x:auto;white-space:pre\">CREATE VIEW v_tgl_tes AS\nSELECT tanggal_key AS tgl_tes_key, tanggal AS tgl_tes, bulan AS bulan_tes\nFROM dim_tanggal;</pre>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Junk dimension</span><span>Contoh hitung · indikator 2</span></div><h2>Menghimpun penanda kecil</h2><div class=\"cols w\"><div><p>Fakta Penilaian punya tiga penanda <button type=\"button\" class=\"term\" data-term=\"low-cardinality\">berkardinalitas rendah</button>:</p><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Langkah</th><th>Hitung</th></tr></thead><tbody><tr><td>1. Jenis kelas</td><td>Reguler, Karyawan → <b>2</b></td></tr><tr><td>2. Status ambil</td><td>Baru, Mengulang → <b>2</b></td></tr><tr><td>3. Mode kuliah</td><td>Luring, Daring, Hibrida → <b>3</b></td></tr><tr><td>4. Kombinasi maksimum</td><td>2 × 2 × 3 = <b>12</b> baris</td></tr><tr><td>5. Yang muncul di data</td><td><b>9</b> baris → dimuat ke dimensi</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"junk-dimension\">Junk dimension</button></h3><p>Satu kunci <span class=\"phrase\">profil_kelas_key</span> menggantikan tiga kolom penanda di tabel fakta.</p><p class=\"muted\" style=\"font-size:.85em\">Simpan hanya kombinasi yang benar-benar muncul <span class=\"cite\">(Kimball &amp; Ross, 2013)</span>.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Data ilustrasi: 3 kombinasi tidak pernah muncul, mis. kelas Karyawan tidak pernah Hibrida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh utuh</span><span>Kasus ilustrasi · indikator 2–3</span></div><h2>Dim Mahasiswa yang siap dimuat</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Kolom</th><th>Peran</th></tr></thead><tbody><tr><td><span class=\"phrase\">mahasiswa_key</span></td><td>surrogate key (urut mulai 1; baris bawaan −1)</td></tr><tr><td><span class=\"phrase\">nim</span></td><td>natural key (dipakai ETL untuk lookup)</td></tr><tr><td><span class=\"phrase\">nama</span></td><td>tipe 1</td></tr><tr><td><span class=\"phrase\">angkatan</span>, <span class=\"phrase\">jalur_masuk</span></td><td>tipe 0</td></tr><tr><td><span class=\"phrase\">prodi</span>, <span class=\"phrase\">fakultas</span>, <span class=\"phrase\">kabupaten_asal</span></td><td>tipe 2 (hierarki prodi → fakultas ikut tersimpan)</td></tr><tr><td><span class=\"phrase\">berlaku_mulai</span>, <span class=\"phrase\">berlaku_sampai</span>, <span class=\"phrase\">is_current</span></td><td>kolom administrasi tipe 2</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi; nama kolom contoh. Data kontak pribadi tidak dimuat (UU No. 27 Tahun 2022).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop</span><span>Kelompok Tugas 1 · 30 menit</span></div><h2>Lengkapi model dimensional kelompok</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Tambahkan ke skema P4</th><th>Isi kelompok</th></tr></thead><tbody><tr><td>Surrogate key tiap dimensi + natural key</td><td>…</td></tr><tr><td>Baris bawaan (tidak diketahui, tidak berlaku)</td><td>…</td></tr><tr><td>Tipe SCD tiap atribut + alasan</td><td>…</td></tr><tr><td>Dim Tanggal dengan atribut kasus</td><td>…</td></tr><tr><td>Role-playing (bila ada)</td><td>…</td></tr><tr><td>Junk dimension (bila ada)</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Langkah</h3><ol><li>20 menit melengkapi skema.</li><li>Tukar dengan kelompok sebelah.</li><li>Nilai skema mereka di slide berikut.</li><li>Kirim ringkasan penilaian ke kelompok itu.</li></ol></div></div>"}

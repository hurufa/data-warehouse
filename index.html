<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}



/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

const GLOSSARY={"data-warehouse":{"t":"Data warehouse","d":"Kumpulan data terintegrasi dari berbagai sistem, disimpan beserta riwayatnya, untuk analisis dan keputusan.","id":"gudang data"},"oltp":{"t":"OLTP","d":"Online Transaction Processing: sistem pencatat transaksi harian, mis. SIAKAD atau kasir.","id":"pemrosesan transaksi daring"},"olap":{"t":"OLAP","d":"Online Analytical Processing: analisis data dalam jumlah besar dari berbagai sudut pandang (waktu, wilayah, produk).","id":"pemrosesan analitik daring"},"business-intelligence":{"t":"Business intelligence (BI)","d":"Proses, teknologi, dan aplikasi yang mengubah data menjadi informasi untuk keputusan.","id":"kecerdasan bisnis"},"subject-oriented":{"t":"Subject-oriented","d":"Data disusun menurut subjek utama organisasi (mahasiswa, pelanggan, produk), bukan menurut aplikasi.","id":"berorientasi subjek"},"integrated":{"t":"Integrated","d":"Data dari berbagai sumber diseragamkan kode, format, dan satuannya.","id":"terintegrasi"},"time-variant":{"t":"Time-variant","d":"Data menyimpan dimensi waktu sehingga perubahan dari waktu ke waktu dapat dianalisis.","id":"bervariasi menurut waktu / historis"},"nonvolatile":{"t":"Nonvolatile","d":"Data yang sudah dimuat tidak diubah oleh transaksi harian; umumnya hanya dimuat dan dibaca.","id":"tidak mudah berubah"},"etl":{"t":"ETL","d":"Extract, Transform, Load: mengambil data dari sumber, membersihkan dan mengubahnya, lalu memuatnya ke gudang.","id":"ekstraksi, transformasi, pemuatan"},"presentation-area":{"t":"Presentation area","d":"Bagian DW menurut Kimball berisi data dimensional yang dikueri pengguna dan aplikasi BI.","id":"area presentasi"},"data-mart":{"t":"Data mart","d":"Bagian data warehouse untuk satu area bisnis atau departemen.","id":"gudang data subjek / departemen"},"cif":{"t":"Corporate Information Factory (CIF)","d":"Arsitektur Inmon: sumber → EDW ternormalisasi → data mart.","id":"arsitektur pabrik informasi korporat"},"bus-architecture":{"t":"Bus architecture","d":"Arsitektur Kimball: dibangun per proses bisnis, disatukan dimensi bersama (conformed).","id":"arsitektur bus"},"data-vault":{"t":"Data Vault","d":"Pendekatan Linstedt: kunci bisnis (hub), hubungan (link), atribut dan riwayatnya (satellite).","id":"Data Vault"},"data-lake":{"t":"Data lake","d":"Penyimpanan data mentah berbagai format; skema ditentukan saat dibaca.","id":"danau data"},"lakehouse":{"t":"Lakehouse","d":"Fitur data warehouse (ACID, skema, kinerja) di atas penyimpanan data lake berformat terbuka.","id":"lakehouse"},"modern-data-stack":{"t":"Modern data stack","d":"Rangkaian layanan cloud: ingest, cloud DW, transformasi (mis. dbt), dan BI.","id":"tumpukan data modern"},"schema-on-read":{"t":"Schema-on-read","d":"Struktur data ditentukan saat dibaca, bukan saat disimpan (lawan: schema-on-write).","id":"skema saat dibaca"},"dimensional-modeling":{"t":"Dimensional modeling","d":"Teknik merancang basis data analitik dalam bentuk tabel fakta (ukuran) dan tabel dimensi (konteks) agar mudah dipahami dan cepat dikueri.","id":"pemodelan dimensional"},"business-requirements":{"t":"Business requirements","d":"Kebutuhan informasi pengguna bisnis: keputusan apa yang diambil, pertanyaan apa yang harus dijawab, dan ukuran apa yang dipakai.","id":"kebutuhan bisnis"},"business-process":{"t":"Business process","d":"Kegiatan operasional organisasi yang menghasilkan atau mencatat ukuran kinerja, mis. registrasi KRS atau pembayaran UKT.","id":"proses bisnis"},"grain":{"t":"Grain","d":"Pernyataan tentang apa yang diwakili oleh satu baris tabel fakta.","id":"butir / tingkat kerincian"},"atomic-grain":{"t":"Atomic grain","d":"Tingkat kerincian paling rendah yang dicatat oleh proses bisnis; tidak dapat dipecah lagi.","id":"kerincian atomik"},"fact":{"t":"Fact","d":"Ukuran numerik hasil proses bisnis, mis. jumlah SKS, nominal bayar, atau jumlah pendaftar.","id":"fakta / ukuran"},"dimension":{"t":"Dimension","d":"Konteks deskriptif sebuah fakta: siapa, apa, di mana, kapan, mengapa, dan bagaimana.","id":"dimensi"},"fact-table":{"t":"Fact table","d":"Tabel yang menyimpan ukuran-ukuran sebuah proses bisnis pada grain tertentu, beserta kunci ke tabel dimensi.","id":"tabel fakta"},"dimension-table":{"t":"Dimension table","d":"Tabel yang menyimpan atribut deskriptif, mis. nama prodi, fakultas, atau kategori produk, untuk menyaring dan mengelompokkan fakta.","id":"tabel dimensi"},"kpi":{"t":"KPI","d":"Key Performance Indicator: ukuran kinerja utama yang dipantau untuk menilai tercapainya tujuan.","id":"indikator kinerja utama"},"stakeholder":{"t":"Stakeholder","d":"Orang atau kelompok yang berkepentingan terhadap sistem, mis. pimpinan, analis, operator sistem sumber.","id":"pemangku kepentingan"},"bus-matrix":{"t":"Enterprise bus matrix","d":"Matriks proses bisnis (baris) terhadap dimensi (kolom) yang menjadi peta rencana data warehouse.","id":"matriks bus"},"conformed-dimension":{"t":"Conformed dimension","d":"Dimensi yang dipakai bersama oleh beberapa tabel fakta dengan isi dan arti yang sama, sehingga hasil analisis bisa digabung.","id":"dimensi terkonformasi / seragam"},"data-profiling":{"t":"Data profiling","d":"Pemeriksaan isi data sumber: jumlah baris, nilai kosong, nilai unik, pola, dan anomali.","id":"profil data"}};
const QUOTES=[{"q":"The DW/BI system must serve as the authoritative and trustworthy foundation for improved decision making.","a":"Ralph Kimball & Margy Ross","s":"The Data Warehouse Toolkit, 3rd ed., 2013"},{"q":"The business community must accept the DW/BI system to deem it successful.","a":"Ralph Kimball & Margy Ross","s":"The Data Warehouse Toolkit, 3rd ed., 2013"},{"q":"A data warehouse is a subject-oriented, integrated, nonvolatile, and time-variant collection of data in support of management's decisions.","a":"W. H. Inmon","s":"Building the Data Warehouse, 4th ed., 2005"},{"q":"The ability to take data—to be able to understand it, to process it, to extract value from it, to visualize it, to communicate it—that's going to be a hugely important skill in the next decades.","a":"Hal Varian","s":"\"Hal Varian on how the Web challenges managers\", McKinsey Quarterly, January 2009"},{"q":"O you who have believed, if there comes to you a disobedient one with information, investigate, lest you harm a people out of ignorance and become, over what you have done, regretful.","a":"Al-Qur'an","s":"QS Al-Hujurat 49:6 (tr. Sahih International)"}];
const MEETINGS=[{"no":1,"title":"Konsep & Arsitektur Data Warehouse","subtitle":"OLTP vs OLAP, arsitektur Inmon, Kimball, Data Vault, data lake dan lakehouse","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Data Warehouse · SII047</span></div><h1>Konsep &amp; Arsitektur Data Warehouse</h1><p class=\"lead\">OLTP vs OLAP, arsitektur Inmon, Kimball, Data Vault, data lake dan lakehouse</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>7 · 3 SKS · prasyarat Sistem Basis Data</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis perbedaan OLTP dan OLAP serta membandingkan arsitektur data warehouse (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan karakteristik OLTP dan OLAP.</li><li>Ketepatan membandingkan pendekatan Inmon, Kimball, dan Data Vault.</li><li>Ketepatan menjelaskan posisi data lake dan lakehouse dalam arsitektur data modern.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 3 SKS · Project Based Learning</span></div><h2>Satu semester, satu gudang data</h2><p>Setiap kelompok membangun data warehouse untuk <b>satu kasus nyata</b>: data akademik perguruan tinggi, penjualan UMKM, layanan publik instansi pemerintah, atau administrasi pesantren.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Tugas 1 · Merancang</h3><p>Dokumen kebutuhan, bus matrix, model dimensional, dan skema fisik yang sudah diimplementasikan. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Tugas 2 · Membangun &amp; memanfaatkan</h3><p>Pipeline ETL, laporan kualitas data dan metadata, kueri OLAP dan dashboard, serta laporan akhir dan demo di Pertemuan 15.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tugas dikumpulkan sesuai tenggat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran dan kontribusi yang tercatat di repositori atau log kerja.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/></svg>Menjaga data</h3><p>Data mitra dipakai hanya untuk tugas, dianonimkan, dan tidak disebarkan.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Kode dan laporan karya sendiri; pemakaian AI generatif dan kode dari luar disebutkan sumbernya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Buntu saat praktik? Tanyakan lebih awal, jangan menunggu tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>5 menit · berpasangan · kasus ilustrasi</span></div><h2>Pertanyaan sederhana, jawaban sulit</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.05em\">Wakil rektor bertanya: \"Berapa persen mahasiswa angkatan 2021 yang lulus tepat waktu, per prodi? Bagaimana trennya lima tahun terakhir, dan apakah ada kaitannya dengan status pembayaran UKT?\"</span></div><p style=\"margin-top:.8em\">Diskusikan dengan pasangan:</p><ol><li>Data apa saja yang dibutuhkan, dan di sistem mana data itu berada?</li><li>Apa yang membuat pertanyaan ini sulit dijawab dengan cepat?</li></ol></div><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>SIAKAD</h3><p>KRS, nilai, status mahasiswa</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Sistem keuangan</h3><p>tagihan dan pembayaran UKT</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Aplikasi PMB</h3><p>data pendaftar dan jalur masuk</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Spreadsheet prodi</h3><p>yudisium, kelulusan</p></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>OLTP vs OLAP: mencatat vs menganalisis</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th><button type=\"button\" class=\"term\" data-term=\"oltp\">OLTP</button> (sistem operasional)</th><th><button type=\"button\" class=\"term\" data-term=\"olap\">OLAP</button> (data warehouse)</th></tr></thead><tbody><tr><td><b>Tujuan</b></td><td>menjalankan operasi harian</td><td>mendukung analisis dan keputusan</td></tr><tr><td><b>Pengguna</b></td><td>operator, mahasiswa, kasir</td><td>pimpinan, analis, pengambil keputusan</td></tr><tr><td><b>Operasi</b></td><td>INSERT/UPDATE/DELETE kecil, sangat sering</td><td>SELECT besar dan agregasi, dimuat berkala</td></tr><tr><td><b>Data</b></td><td>kondisi terkini, detail satu transaksi</td><td>historis, terintegrasi dari banyak sumber</td></tr><tr><td><b>Desain</b></td><td>ternormalisasi (3NF) untuk integritas</td><td>dimensional (fakta dan dimensi) untuk kemudahan dan kecepatan kueri</td></tr><tr><td><b>Kueri khas</b></td><td>\"Tampilkan KRS NIM 2201…\"</td><td>\"Rata-rata IPK per prodi per angkatan, 5 tahun\"</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Dirangkum dari Kimball &amp; Ross (2013) dan Inmon (2005); contoh kueri adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 1</span></div><h2>Empat ciri data warehouse <span class=\"cite\">(Inmon, 2005)</span></h2><div class=\"callout\"><span class=\"quote\" style=\"font-size:1em\"><button type=\"button\" class=\"term\" data-term=\"data-warehouse\">Data warehouse</button> adalah kumpulan data yang berorientasi subjek, terintegrasi, tidak mudah berubah, dan bervariasi menurut waktu untuk mendukung keputusan manajemen.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Inmon, 2005, terjemahan bebas)</span></div></div><div class=\"grid4\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"subject-oriented\">Subject-oriented</button></h3><p>Disusun per subjek: mahasiswa, pembayaran, pendaftar. Bukan per aplikasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"integrated\">Integrated</button></h3><p>Kode prodi \"SI\", \"S1-SI\", \"Sistem Informasi\" diseragamkan menjadi satu.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg><button type=\"button\" class=\"term\" data-term=\"time-variant\">Time-variant</button></h3><p>Status mahasiswa tiap semester tersimpan, bukan hanya status terakhir.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/></svg><button type=\"button\" class=\"term\" data-term=\"nonvolatile\">Nonvolatile</button></h3><p>Data dimuat berkala lalu dibaca; tidak diubah oleh transaksi harian.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tujuan DW/BI</span><span>Sudut pandang Kimball</span></div><h2>Apa yang harus dipenuhi sistem DW/BI?</h2><div class=\"cols w\"><div><ol><li>Membuat informasi <b>mudah diakses</b>.</li><li>Menyajikan informasi secara <b>konsisten</b>.</li><li>Mampu <b>beradaptasi</b> terhadap perubahan.</li><li>Menyajikan informasi <b>tepat waktu</b>.</li><li>Menjadi <b>benteng aman</b> yang melindungi aset informasi.</li><li>Menjadi <b>fondasi tepercaya</b> untuk keputusan yang lebih baik.</li><li><b>Diterima</b> oleh komunitas bisnis agar dianggap berhasil.</li></ol><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Kimball &amp; Ross, 2013, terjemahan bebas)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Artinya bagi kita</h3><p>Data warehouse bukan proyek teknologi semata. Tujuan 7 menegaskan: bila pimpinan tetap memakai spreadsheet sendiri karena tidak percaya angka di dashboard, proyek dianggap <b>gagal</b>, secanggih apa pun teknologinya.</p><p class=\"muted\">Tujuan 5 terkait keamanan dan UU PDP (Pertemuan 14).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur</span><span>Indikator 2</span></div><h2>Empat komponen arsitektur DW/BI <span class=\"cite\">(Kimball &amp; Ross, 2013)</span></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 250\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Empat komponen arsitektur DW/BI menurut Kimball dan Ross, dari kiri ke kanan: operational source systems (SIAKAD, PMB, keuangan, spreadsheet), ETL system (extract, transform, load), presentation area (model dimensional, data atomik dan ringkasan, conformed dimensions), dan BI applications (laporan, dashboard, analitik). Sumber dan ETL disebut back room; presentation area dan BI applications disebut front room.\"><defs><marker id=\"kb\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"245\" y=\"20\" class=\"s-hd\">BACK ROOM</text><text x=\"480\" y=\"20\" class=\"s-hd\">FRONT ROOM</text><line x1=\"455\" y1=\"8\" x2=\"455\" y2=\"236\" class=\"s-dash\"/><rect x=\"10\" y=\"40\" width=\"190\" height=\"150\" rx=\"14\" class=\"s-box\"/><text x=\"105\" y=\"78\" text-anchor=\"middle\" class=\"s-t\">Operational Source</text><text x=\"105\" y=\"98\" text-anchor=\"middle\" class=\"s-t\">Systems</text><text x=\"105\" y=\"136\" text-anchor=\"middle\" class=\"s-s\">SIAKAD, PMB,</text><text x=\"105\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">keuangan, spreadsheet</text><rect x=\"240\" y=\"40\" width=\"190\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"335\" y=\"88\" text-anchor=\"middle\" class=\"s-t\">ETL System</text><text x=\"335\" y=\"136\" text-anchor=\"middle\" class=\"s-s\">extract, transform,</text><text x=\"335\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">load (+ staging)</text><rect x=\"480\" y=\"40\" width=\"200\" height=\"150\" rx=\"14\" class=\"s-acc\"/><text x=\"580\" y=\"88\" text-anchor=\"middle\" class=\"s-t\">Presentation Area</text><text x=\"580\" y=\"136\" text-anchor=\"middle\" class=\"s-s\">model dimensional,</text><text x=\"580\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">atomik + ringkasan</text><rect x=\"720\" y=\"40\" width=\"170\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"805\" y=\"88\" text-anchor=\"middle\" class=\"s-t\">BI Applications</text><text x=\"805\" y=\"136\" text-anchor=\"middle\" class=\"s-s\">laporan, dashboard,</text><text x=\"805\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">analitik, data mining</text><line x1=\"202\" y1=\"115\" x2=\"236\" y2=\"115\" class=\"s-line\" marker-end=\"url(#kb)\"/><line x1=\"432\" y1=\"115\" x2=\"476\" y2=\"115\" class=\"s-line\" marker-end=\"url(#kb)\"/><line x1=\"682\" y1=\"115\" x2=\"716\" y2=\"115\" class=\"s-line\" marker-end=\"url(#kb)\"/><text x=\"580\" y=\"222\" text-anchor=\"middle\" class=\"s-s\">conformed dimensions menyatukan area presentasi</text></svg><figcaption>Komponen arsitektur DW/BI, diadaptasi dari Kimball &amp; Ross (2013). Nama komponen ditulis sesuai sumber; contoh sistem sumber adalah ilustrasi kampus.</figcaption></figure><p style=\"margin-top:.3em\"><button type=\"button\" class=\"term\" data-term=\"etl\">ETL</button> bekerja di balik layar; pengguna hanya melihat <button type=\"button\" class=\"term\" data-term=\"presentation-area\">presentation area</button> dan aplikasi <button type=\"button\" class=\"term\" data-term=\"business-intelligence\">BI</button>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur</span><span>Indikator 2</span></div><h2>Inmon vs Kimball: dua jalan membangun DW</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 300\" style=\"max-height:14em\" role=\"img\" aria-label=\"Dua arsitektur berdampingan. Kiri, Inmon Corporate Information Factory: sistem sumber, ETL, enterprise data warehouse ternormalisasi 3NF berisi data atomik, lalu diturunkan ke data mart akademik, keuangan, dan PMB yang dimensional. Kanan, Kimball bus architecture: sistem sumber, ETL, lalu area presentasi dimensional berisi proses KRS, pembayaran, dan PMB yang dihubungkan oleh bus conformed dimensions waktu, mahasiswa, dan prodi.\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"225\" y=\"18\" text-anchor=\"middle\" class=\"s-hd\">INMON · CIF (HUB-AND-SPOKE)</text><text x=\"675\" y=\"18\" text-anchor=\"middle\" class=\"s-hd\">KIMBALL · BUS ARCHITECTURE</text><line x1=\"450\" y1=\"8\" x2=\"450\" y2=\"292\" class=\"s-dash\"/><rect x=\"25\" y=\"30\" width=\"400\" height=\"40\" rx=\"10\" class=\"s-box\"/><text x=\"225\" y=\"56\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sistem sumber</text><line x1=\"225\" y1=\"72\" x2=\"225\" y2=\"104\" class=\"s-line\" marker-end=\"url(#ar)\"/><text x=\"235\" y=\"92\" class=\"s-s\">ETL</text><rect x=\"25\" y=\"108\" width=\"400\" height=\"62\" rx=\"12\" class=\"s-soft\"/><text x=\"225\" y=\"134\" text-anchor=\"middle\" class=\"s-t\">Enterprise Data Warehouse</text><text x=\"225\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">ternormalisasi (3NF), data atomik, satu sumber kebenaran</text><line x1=\"85\" y1=\"172\" x2=\"85\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"25\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"85\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart Akademik</text><line x1=\"225\" y1=\"172\" x2=\"225\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"165\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"225\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart Keuangan</text><line x1=\"365\" y1=\"172\" x2=\"365\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"305\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"365\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart PMB</text><text x=\"225\" y=\"282\" text-anchor=\"middle\" class=\"s-s\">data mart dependen, dimensional, per departemen</text><rect x=\"475\" y=\"30\" width=\"400\" height=\"40\" rx=\"10\" class=\"s-box\"/><text x=\"675\" y=\"56\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sistem sumber</text><line x1=\"675\" y1=\"72\" x2=\"675\" y2=\"104\" class=\"s-line\" marker-end=\"url(#ar)\"/><text x=\"685\" y=\"92\" class=\"s-s\">ETL</text><rect x=\"475\" y=\"108\" width=\"400\" height=\"164\" rx=\"12\" class=\"s-dash\"/><text x=\"491\" y=\"128\" class=\"s-hd\">PRESENTATION AREA · DIMENSIONAL</text><rect x=\"495\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"550\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta KRS</text><line x1=\"550\" y1=\"188\" x2=\"550\" y2=\"214\" class=\"s-line\"/><rect x=\"615\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"670\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta Bayar</text><line x1=\"670\" y1=\"188\" x2=\"670\" y2=\"214\" class=\"s-line\"/><rect x=\"735\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"790\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta PMB</text><line x1=\"790\" y1=\"188\" x2=\"790\" y2=\"214\" class=\"s-line\"/><rect x=\"490\" y=\"214\" width=\"370\" height=\"34\" rx=\"17\" class=\"s-hl\"/><text x=\"675\" y=\"236\" text-anchor=\"middle\" class=\"s-ta\" style=\"font-size:13px\">Bus: Waktu · Mahasiswa · Prodi (conformed)</text><text x=\"675\" y=\"288\" text-anchor=\"middle\" class=\"s-s\">dibangun bertahap per proses bisnis</text></svg><figcaption>Dua arsitektur klasik, diadaptasi dari Kimball &amp; Ross (2013) dan Inmon (2005). Label kotak (akademik, KRS, PMB) adalah contoh ilustrasi.</figcaption></figure><p style=\"margin-top:.3em\"><button type=\"button\" class=\"term\" data-term=\"cif\">CIF</button> membangun gudang terpusat dulu, lalu <button type=\"button\" class=\"term\" data-term=\"data-mart\">data mart</button>; <button type=\"button\" class=\"term\" data-term=\"bus-architecture\">bus architecture</button> membangun per proses bisnis, disatukan dimensi bersama.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"data-vault\">Data Vault</button>: hub, link, satellite</h2><figure class=\"fig\"><svg viewBox=\"0 0 760 230\" style=\"max-height:12em\" role=\"img\" aria-label=\"Contoh Data Vault. Hub Mahasiswa berisi kunci bisnis NIM, Hub Mata Kuliah berisi kode mata kuliah, dan Link KRS menghubungkan keduanya. Tiap hub dan link punya satellite: satellite mahasiswa berisi nama dan alamat beserta riwayat perubahan, satellite mata kuliah berisi nama dan SKS, satellite KRS berisi nilai.\"><rect x=\"20\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-soft\"/><text x=\"115\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Hub Mahasiswa</text><text x=\"115\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">kunci bisnis: NIM</text><rect x=\"285\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-acc\"/><text x=\"380\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Link KRS</text><text x=\"380\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">NIM ↔ kode MK</text><rect x=\"550\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-soft\"/><text x=\"645\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Hub Mata Kuliah</text><text x=\"645\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">kunci bisnis: kode MK</text><line x1=\"210\" y1=\"75\" x2=\"285\" y2=\"75\" class=\"s-line\"/><line x1=\"475\" y1=\"75\" x2=\"550\" y2=\"75\" class=\"s-line\"/><line x1=\"115\" y1=\"110\" x2=\"115\" y2=\"150\" class=\"s-dash\"/><rect x=\"20\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"115\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat Mahasiswa</text><text x=\"115\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nama, alamat + riwayat</text><line x1=\"380\" y1=\"110\" x2=\"380\" y2=\"150\" class=\"s-dash\"/><rect x=\"285\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"380\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat KRS</text><text x=\"380\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nilai, status</text><line x1=\"645\" y1=\"110\" x2=\"645\" y2=\"150\" class=\"s-dash\"/><rect x=\"550\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"645\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat Mata Kuliah</text><text x=\"645\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nama, SKS + riwayat</text><text x=\"10\" y=\"24\" class=\"s-hd\">HUB = KUNCI BISNIS · LINK = HUBUNGAN · SATELLITE = ATRIBUT + RIWAYAT</text></svg><figcaption>Tiga jenis tabel Data Vault, diadaptasi dari Linstedt &amp; Olschimke (2015). Contoh akademik adalah ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>Kekuatan</b>: tahan terhadap perubahan sumber; riwayat lengkap; mudah ditambah sumber baru.</p></div><div class=\"card\"><p><b>Keterbatasan</b>: jumlah tabel banyak; sulit dikueri langsung oleh pengguna bisnis.</p></div><div class=\"card hl\"><p><b>Praktiknya</b>: di atas Data Vault tetap dibangun <b>information mart</b> dimensional untuk BI.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Perbandingan</span><span>Indikator 2</span></div><h2>Inmon, Kimball, Data Vault</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Inmon (CIF)</th><th>Kimball (bus)</th><th>Data Vault</th></tr></thead><tbody><tr><td><b>Arah</b></td><td>top-down, EDW dulu</td><td>bertahap per proses bisnis</td><td>bertahap per kunci bisnis</td></tr><tr><td><b>Model inti</b></td><td>ternormalisasi (3NF)</td><td>dimensional (fakta, dimensi)</td><td>hub, link, satellite</td></tr><tr><td><b>Integrasi</b></td><td>di EDW</td><td>lewat conformed dimensions</td><td>lewat kunci bisnis di hub</td></tr><tr><td><b>Kelebihan</b></td><td>satu sumber kebenaran terpusat</td><td>cepat terlihat hasilnya, mudah dipahami pengguna</td><td>tahan perubahan, jejak audit lengkap</td></tr><tr><td><b>Tantangan</b></td><td>investasi awal besar, lama</td><td>disiplin dimensi bersama</td><td>banyak tabel, perlu mart untuk BI</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Dirangkum dari Inmon (2005), Kimball &amp; Ross (2013), dan Linstedt &amp; Olschimke (2015). Baris \"Kelebihan\" dan \"Tantangan\" adalah rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur modern</span><span>Indikator 3</span></div><h2>Data warehouse, data lake, lakehouse</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 230\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Tiga generasi arsitektur. Data warehouse: data terstruktur, schema-on-write, untuk BI dan laporan. Data lake: data mentah semua format di penyimpanan murah, schema-on-read, untuk data science, dengan risiko menjadi data swamp. Lakehouse: penyimpanan data lake dengan format tabel terbuka ditambah transaksi ACID, skema, dan kinerja kueri, melayani BI dan machine learning dari satu salinan data.\"><defs><marker id=\"lv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"145\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Data Warehouse</text><text x=\"145\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">terstruktur (tabel)</text><text x=\"145\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">schema-on-write</text><text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ BI, laporan</text><line x1=\"282\" y1=\"105\" x2=\"308\" y2=\"105\" class=\"s-line\" marker-end=\"url(#lv)\"/><rect x=\"310\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-box\"/><text x=\"445\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Data Lake</text><text x=\"445\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">mentah, semua format</text><text x=\"445\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">schema-on-read, murah</text><text x=\"445\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ data science</text><line x1=\"582\" y1=\"105\" x2=\"608\" y2=\"105\" class=\"s-line\" marker-end=\"url(#lv)\"/><rect x=\"610\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-acc\"/><text x=\"745\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Lakehouse</text><text x=\"745\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">lake + format tabel terbuka</text><text x=\"745\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">+ ACID, skema, kinerja</text><text x=\"745\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ BI dan ML sekaligus</text><text x=\"445\" y=\"206\" text-anchor=\"middle\" class=\"s-tw\">risiko data lake tanpa tata kelola: \"data swamp\"</text></svg><figcaption>Posisi data lake dan lakehouse, diadaptasi dari Armbrust et al. (2021) dan Serra (2024). Ketiganya masih dipakai berdampingan; lakehouse tidak otomatis menggantikan data warehouse.</figcaption></figure><p style=\"margin-top:.3em\"><button type=\"button\" class=\"term\" data-term=\"data-lake\">Data lake</button> memakai <button type=\"button\" class=\"term\" data-term=\"schema-on-read\">schema-on-read</button>; <button type=\"button\" class=\"term\" data-term=\"lakehouse\">lakehouse</button> menambahkan fitur gudang data di atasnya <span class=\"cite\">(Armbrust et al., 2021)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur modern</span><span>Indikator 3</span></div><h2>Membaca <button type=\"button\" class=\"term\" data-term=\"modern-data-stack\">modern data stack</button></h2><div class=\"grid4\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Sumber</h3><p>aplikasi, basis data OLTP, spreadsheet, API marketplace</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Ingest &amp; transformasi</h3><p>ELT: muat dulu, ubah di gudang (mis. dengan SQL/dbt); orkestrasi terjadwal</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z\"/></svg>Penyimpanan &amp; komputasi</h3><p>cloud data warehouse atau lakehouse; komputasi terpisah dari penyimpanan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Penyajian</h3><p>semantic layer, dashboard, notebook analitik</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Alat berganti cepat; <b>prinsip</b> tidak. Reis &amp; Housley (2022) menyarankan memilih alat berdasarkan siklus hidup data dan kebutuhan, bukan tren.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Pengelompokan lapisan: definisi kerja mata kuliah ini, merujuk siklus data engineering Reis &amp; Housley (2022). Di proyek kelompok kita memakai perangkat gratis: PostgreSQL, SQL/Python atau Apache Hop, dan alat BI gratis.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kasus</span><span>Kelompok 4–5 orang · 20 menit · kasus ilustrasi</span></div><h2>Arsitektur mana yang tepat?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>A · Perguruan tinggi</h3><p>4.000 mahasiswa; SIAKAD, keuangan, PMB beda vendor; tim TI 4 orang; dashboard kelulusan untuk akreditasi dalam 6 bulan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>B · UMKM</h3><p>Produsen camilan di Sidoarjo; penjualan dari kasir, dua marketplace, dan WhatsApp (spreadsheet); satu admin.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>C · Instansi pemerintah</h3><p>Dinas perizinan kabupaten; 12 aplikasi layanan yang sering berganti versi; wajib audit dan lapor ke pusat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>D · Pesantren</h3><p>1.500 santri; data pendaftaran, syahriah, setoran hafalan, kesehatan; memantau perkembangan per angkatan.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Pilih satu kasus. Tentukan: (1) pertanyaan analitik utama, (2) pendekatan arsitektur beserta alasannya, (3) apakah perlu data lake.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>OLTP</b> mencatat transaksi (kini, ternormalisasi); <b>OLAP/DW</b> menganalisis (historis, terintegrasi, dimensional).</li><li>Data warehouse menurut Inmon: <b>subject-oriented, integrated, time-variant, nonvolatile</b>.</li><li>Kimball: empat komponen (sumber, ETL, presentation area, BI) dan tujuh tujuan DW/BI.</li><li><b>Inmon</b> top-down lewat EDW 3NF; <b>Kimball</b> bertahap lewat conformed dimensions; <b>Data Vault</b> memakai hub, link, satellite.</li><li><b>Data lake</b> menyimpan data mentah; <b>lakehouse</b> menambahkan fitur gudang data di atasnya.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Kueri analitik historis lintas sumber adalah beban OLAP; menjalankannya di OLTP memperlambat transaksi.\"><p class=\"q\">Kueri \"rata-rata IPK per prodi per angkatan, lima tahun\" paling tepat dijalankan di…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. SIAKAD saat masa KRS</button><button type=\"button\" data-o=\"b\">B. data warehouse</button><button type=\"button\" data-o=\"c\">C. spreadsheet prodi</button><button type=\"button\" data-o=\"d\">D. log server</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Nonvolatile menurut Inmon.\"><p class=\"q\">Data di gudang hanya dimuat berkala lalu dibaca, tidak diubah transaksi harian. Ini ciri…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. subject-oriented</button><button type=\"button\" data-o=\"b\">B. integrated</button><button type=\"button\" data-o=\"c\">C. time-variant</button><button type=\"button\" data-o=\"d\">D. nonvolatile</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Data Vault (Linstedt & Olschimke, 2015).\"><p class=\"q\">Pendekatan yang memakai tabel hub, link, dan satellite adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Kimball bus</button><button type=\"button\" data-o=\"b\">B. Inmon CIF</button><button type=\"button\" data-o=\"c\">C. Data Vault</button><button type=\"button\" data-o=\"d\">D. Data lake</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 1 Kimball &amp; Ross (2013), <i>The Data Warehouse Toolkit</i>, tentang tujuan DW/BI dan arsitekturnya. Pengayaan: bab tentang arsitektur dalam Serra (2024).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Membandingkan dua arsitektur</h3><p>Pilih <b>satu kasus</b> (boleh dari diskusi tadi atau organisasi yang Anda kenal). Bandingkan dua arsitektur (mis. Inmon vs Kimball) dalam 400–500 kata, bahasa Indonesia, disertai sketsa diagram sederhana. Akhiri dengan rekomendasi dan alasannya.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan <b>kasus proyek kelompok</b> dan sumber datanya. Kelompok dan kasus dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Data warehouse</span></dt><dd>Kumpulan data terintegrasi dari berbagai sistem, disimpan beserta riwayatnya, untuk analisis dan keputusan. <i>(gudang data)</i></dd></div><div><dt><span class=\"en\">OLTP</span></dt><dd>Online Transaction Processing: sistem pencatat transaksi harian, mis. SIAKAD atau kasir. <i>(pemrosesan transaksi daring)</i></dd></div><div><dt><span class=\"en\">OLAP</span></dt><dd>Online Analytical Processing: analisis data dalam jumlah besar dari berbagai sudut pandang (waktu, wilayah, produk). <i>(pemrosesan analitik daring)</i></dd></div><div><dt><span class=\"en\">Business intelligence (BI)</span></dt><dd>Proses, teknologi, dan aplikasi yang mengubah data menjadi informasi untuk keputusan. <i>(kecerdasan bisnis)</i></dd></div><div><dt><span class=\"en\">ETL</span></dt><dd>Extract, Transform, Load: mengambil data dari sumber, membersihkan dan mengubahnya, lalu memuatnya ke gudang. <i>(ekstraksi, transformasi, pemuatan)</i></dd></div><div><dt><span class=\"en\">Presentation area</span></dt><dd>Bagian DW menurut Kimball berisi data dimensional yang dikueri pengguna dan aplikasi BI. <i>(area presentasi)</i></dd></div><div><dt><span class=\"en\">Data mart</span></dt><dd>Bagian data warehouse untuk satu area bisnis atau departemen. <i>(gudang data subjek / departemen)</i></dd></div><div><dt><span class=\"en\">Corporate Information Factory (CIF)</span></dt><dd>Arsitektur Inmon: sumber → EDW ternormalisasi → data mart. <i>(arsitektur pabrik informasi korporat)</i></dd></div><div><dt><span class=\"en\">Bus architecture</span></dt><dd>Arsitektur Kimball: dibangun per proses bisnis, disatukan dimensi bersama (conformed). <i>(arsitektur bus)</i></dd></div><div><dt><span class=\"en\">Data Vault</span></dt><dd>Pendekatan Linstedt: kunci bisnis (hub), hubungan (link), atribut dan riwayatnya (satellite). <i>(Data Vault)</i></dd></div><div><dt><span class=\"en\">Data lake</span></dt><dd>Penyimpanan data mentah berbagai format; skema ditentukan saat dibaca. <i>(danau data)</i></dd></div><div><dt><span class=\"en\">Lakehouse</span></dt><dd>Fitur data warehouse (ACID, skema, kinerja) di atas penyimpanan data lake berformat terbuka. <i>(lakehouse)</i></dd></div><div><dt><span class=\"en\">Modern data stack</span></dt><dd>Rangkaian layanan cloud: ingest, cloud DW, transformasi (mis. dbt), dan BI. <i>(tumpukan data modern)</i></dd></div><div><dt><span class=\"en\">Schema-on-read</span></dt><dd>Struktur data ditentukan saat dibaca, bukan saat disimpan (lawan: schema-on-write). <i>(skema saat dibaca)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Armbrust, M., Ghodsi, A., Xin, R., &amp; Zaharia, M. (2021). Lakehouse: A new generation of open platforms that unify data warehousing and advanced analytics. Dalam <i>Proceedings of the 11th Conference on Innovative Data Systems Research (CIDR 2021)</i>.</li><li>Inmon, W. H. (2005). <i>Building the data warehouse</i> (4th ed.). Wiley.</li><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Linstedt, D., &amp; Olschimke, M. (2015). <i>Building a scalable data warehouse with Data Vault 2.0</i>. Morgan Kaufmann.</li><li>Reis, J., &amp; Housley, M. (2022). <i>Fundamentals of data engineering: Plan and build robust data systems</i>. O'Reilly Media.</li><li>Serra, J. (2024). <i>Deciphering data architectures: Choosing between a modern data warehouse, data fabric, data lakehouse, and data mesh</i>. O'Reilly Media.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Kebutuhan Bisnis & Desain Dimensional","subtitle":"Proses desain empat langkah, wawancara kebutuhan dan KPI, proses bisnis dan grain","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Data Warehouse · SII047</span></div><h1>Kebutuhan Bisnis &amp; Desain Dimensional</h1><p class=\"lead\">Proses desain empat langkah, wawancara kebutuhan dan KPI, proses bisnis dan grain</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih kasus</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengevaluasi kebutuhan bisnis dan menyusun bus matrix serta grain proses bisnis (C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 3)</span></h3><ol><li>Ketepatan mengidentifikasi proses bisnis dan pertanyaan analitik.</li><li>Ketepatan menentukan grain setiap proses bisnis.</li><li>Kelengkapan enterprise bus matrix dan dimensi terkonformasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan menilai ketersediaan data sumber. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan dua perbedaan utama OLTP dan OLAP.</li><li>Apa empat komponen arsitektur DW/BI menurut Kimball?</li><li>Dalam bus architecture, apa yang menyatukan data dari berbagai proses bisnis?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Mulai dari kebutuhan</span></div><h2>Mengapa mulai dari kebutuhan bisnis?</h2><div class=\"cols w\"><div><div class=\"grid3\" style=\"grid-template-columns:1fr\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Mulai dari data</h3><p>\"Semua tabel SIAKAD kita salin ke gudang, nanti pasti berguna.\" Hasilnya: gudang besar yang tidak menjawab pertanyaan siapa pun.</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Mulai dari kebutuhan</h3><p>\"Pimpinan perlu memantau kelulusan tepat waktu per prodi.\" Data yang dimuat adalah data yang menjawab pertanyaan itu.</p></div></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Kimball Lifecycle</h3><p><b>Business requirements definition</b> adalah titik awal. Dari sana tiga jalur berjalan paralel: <b>teknologi</b>, <b>data</b> (pemodelan, desain fisik, ETL), dan <b>aplikasi BI</b>.</p><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Kimball et al., 2008)</span></p></div></div><p style=\"margin-top:.7em\">Rancangan yang baik mempertemukan <button type=\"button\" class=\"term\" data-term=\"business-requirements\">kebutuhan bisnis</button> dengan <b>realitas data</b> yang tersedia <span class=\"cite\">(Kimball &amp; Ross, 2013)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses desain</span><span>Indikator 1–2</span></div><h2>Empat langkah <button type=\"button\" class=\"term\" data-term=\"dimensional-modeling\">desain dimensional</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 230\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Proses desain dimensional empat langkah menurut Kimball dan Ross. Masukan: kebutuhan bisnis dan realitas data. Langkah 1 select the business process, langkah 2 declare the grain, langkah 3 identify the dimensions, langkah 4 identify the facts. Langkah 1 dan 2 dibahas hari ini, langkah 3 dan 4 di Pertemuan 4 sampai 5.\"><defs><marker id=\"fs\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"170\" height=\"60\" rx=\"12\" class=\"s-acc\"/><text x=\"95\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kebutuhan bisnis</text><text x=\"95\" y=\"77\" text-anchor=\"middle\" class=\"s-s\">business requirements</text><rect x=\"10\" y=\"110\" width=\"170\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"95\" y=\"137\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Realitas data</text><text x=\"95\" y=\"157\" text-anchor=\"middle\" class=\"s-s\">data realities</text><path d=\"M182 60 L206 60 L206 100 L222 100\" class=\"s-line\" style=\"fill:none\" marker-end=\"url(#fs)\"/><path d=\"M182 140 L206 140 L206 100\" class=\"s-line\" style=\"fill:none\"/><rect x=\"226\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-soft\"/><text x=\"301\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"301\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Select the</text><text x=\"301\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">business process</text><text x=\"301\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">pilih proses bisnis</text><line x1=\"377\" y1=\"100\" x2=\"392\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"394\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-soft\"/><text x=\"469\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"469\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Declare</text><text x=\"469\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the grain</text><text x=\"469\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">nyatakan grain</text><line x1=\"545\" y1=\"100\" x2=\"560\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"562\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-box\"/><text x=\"637\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"637\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Identify</text><text x=\"637\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the dimensions</text><text x=\"637\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">tentukan dimensi</text><line x1=\"713\" y1=\"100\" x2=\"728\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"730\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-box\"/><text x=\"805\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"805\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Identify</text><text x=\"805\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the facts</text><text x=\"805\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">tentukan fakta</text><path d=\"M226 170 v12 h318 v-12\" class=\"s-dash\"/><text x=\"385\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">hari ini (Pertemuan 2–3)</text><path d=\"M562 170 v12 h318 v-12\" class=\"s-dash\"/><text x=\"721\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">Pertemuan 4–5</text></svg><figcaption>Proses desain dimensional empat langkah, diadaptasi dari Kimball &amp; Ross (2013). Nama langkah ditulis sesuai sumber.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Menggali kebutuhan</span><span>Indikator 1</span></div><h2>Wawancara dan lokakarya kebutuhan</h2><div class=\"cols\"><div><h3>Siapa yang ditanya?</h3><ul><li><b>Pimpinan</b>: keputusan strategis dan target (rektor, kepala dinas, pemilik usaha).</li><li><b>Analis/pengguna laporan</b>: laporan yang sekarang dibuat manual.</li><li><b>Pemilik sistem sumber</b>: data apa yang ada, seberapa lengkap.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Semua adalah <button type=\"button\" class=\"term\" data-term=\"stakeholder\">stakeholder</button>. Pisahkan sesi pengguna bisnis dan sesi teknis.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Pertanyaan pemandu</h3><ol><li>Apa tanggung jawab dan target Anda?</li><li>Bagaimana Anda tahu kinerja sedang baik atau buruk?</li><li>Keputusan apa yang sering Anda ambil, dan data apa yang Anda perlukan?</li><li>Analisis apa yang ingin dilakukan tetapi sekarang sulit?</li><li>Laporan apa yang sekarang dibuat manual?</li></ol></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Diadaptasi dari Kimball et al. (2008). Tanyakan <b>apa yang dikerjakan</b> pengguna, bukan \"data apa yang Anda mau\".</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari kebutuhan ke rancangan</span><span>Indikator 1 · kasus ilustrasi</span></div><h2>Pertanyaan analitik → <button type=\"button\" class=\"term\" data-term=\"kpi\">KPI</button> → fakta &amp; dimensi</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Pertanyaan analitik</th><th>KPI</th><th>Diukur dari (<button type=\"button\" class=\"term\" data-term=\"fact\">fakta</button>)</th><th>Dilihat per (<button type=\"button\" class=\"term\" data-term=\"dimension\">dimensi</button>)</th></tr></thead><tbody><tr><td>Berapa persen mahasiswa lulus tepat waktu per prodi per angkatan?</td><td>tingkat kelulusan tepat waktu</td><td>jumlah lulus ≤ 8 semest

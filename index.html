,{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai skema kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;dw5-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Model dimensional kelompok (Data Warehouse P5)&quot;,&quot;levels&quot;:[&quot;Belum&quot;,&quot;Mulai&quot;,&quot;Cukup&quot;,&quot;Baik&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · penjualan UMKM&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di skema mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;mis. Kolom nim masih dipakai sebagai kunci fakta…&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu diperbaiki besar&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Grain dan jenis tabel fakta&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Grain belum ditulis atau kolom bercampur grain.&quot;,&quot;Grain ada, jenis tabel fakta belum sesuai cara proses diukur.&quot;,&quot;Grain jelas dan jenis tabel fakta tepat.&quot;,&quot;Grain jelas, jenis tepat, fakta diberi sifat aditif dan komponen rasio.&quot;]},{&quot;t&quot;:&quot;Atribut, hierarki, dimensi tanggal&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Dimensi hanya berisi kode.&quot;,&quot;Atribut ada, hierarki atau Dim Tanggal belum ada.&quot;,&quot;Atribut deskriptif, hierarki dan Dim Tanggal ada.&quot;,&quot;Lengkap, termasuk atribut khas kasus, role-playing atau junk bila perlu.&quot;]},{&quot;t&quot;:&quot;Surrogate key dan SCD&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Natural key dipakai sebagai kunci fakta.&quot;,&quot;Surrogate key ada, tipe SCD belum ditentukan.&quot;,&quot;Surrogate key dan tipe SCD per atribut ada.&quot;,&quot;Tipe SCD per atribut beralasan; kolom administrasi tipe 2 dan baris bawaan lengkap.&quot;]},{&quot;t&quot;:&quot;Star atau snowflake&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Skema masih mirip tabel OLTP ternormalisasi.&quot;,&quot;Sebagian dimensi dinormalisasi tanpa alasan.&quot;,&quot;Star schema.&quot;,&quot;Star schema; pengecualian (bila ada) beralasan.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Salin ringkasan lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Surrogate key</b>: kunci bilangan urut milik data warehouse; natural key tetap disimpan sebagai atribut.</li><li>Kunci fakta tidak pernah kosong: pakai <b>baris bawaan</b>.</li><li>SCD dipilih <b>per atribut</b>: tipe 1 timpa, tipe 2 baris baru, tipe 3 kolom nilai sebelumnya.</li><li><b>Dim Tanggal</b>: satu baris per hari, berisi kalender, akademik, dan hari libur; kunci YYYYMMDD boleh.</li><li><b>Role-playing</b>: satu dimensi, banyak peran lewat view; <b>junk</b>: penanda kecil dihimpun.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;dw5-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Mengapa NIM tidak dipakai sebagai kunci utama Dim Mahasiswa?&quot;,&quot;o&quot;:[&quot;NIM terlalu panjang&quot;,&quot;Satu NIM bisa punya beberapa versi baris&quot;,&quot;NIM bersifat rahasia&quot;,&quot;NIM tidak unik di SIAKAD&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Dengan SCD tipe 2, satu natural key bisa punya beberapa baris; kunci utama harus surrogate key.&quot;},{&quot;q&quot;:&quot;Koreksi salah ketik nama mahasiswa paling tepat memakai…&quot;,&quot;o&quot;:[&quot;SCD tipe 1&quot;,&quot;SCD tipe 2&quot;,&quot;SCD tipe 3&quot;,&quot;baris bawaan&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Nilai lama memang salah, jadi cukup ditimpa.&quot;},{&quot;q&quot;:&quot;Pada SCD tipe 2, fakta KRS tahun 2022 milik mahasiswa yang pindah prodi tahun 2023 menunjuk…&quot;,&quot;o&quot;:[&quot;baris dimensi terbaru&quot;,&quot;baris dimensi yang berlaku tahun 2022&quot;,&quot;baris bawaan Tidak diketahui&quot;,&quot;kedua baris sekaligus&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Fakta memakai surrogate key yang berlaku saat peristiwa terjadi.&quot;},{&quot;q&quot;:&quot;Fakta PMB punya kunci tanggal daftar, tes, lulus, dan daftar ulang yang semuanya menunjuk Dim Tanggal. Ini disebut…&quot;,&quot;o&quot;:[&quot;junk dimension&quot;,&quot;degenerate dimension&quot;,&quot;role-playing dimension&quot;,&quot;snowflake&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Satu dimensi fisik dipakai dengan beberapa peran, biasanya lewat view.&quot;},{&quot;q&quot;:&quot;Tiga penanda bernilai 2, 2, dan 4 nilai digabung menjadi junk dimension. Jumlah baris maksimumnya…&quot;,&quot;o&quot;:[&quot;8&quot;,&quot;12&quot;,&quot;16&quot;,&quot;24&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;2 × 2 × 4 = 16; yang dimuat hanya kombinasi yang benar-benar muncul.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Formatif, tidak masuk nilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Kimball &amp; Ross (2013): bagian dimensi tanggal, surrogate key, dan slowly changing dimension. Persiapan Pertemuan 6: bagian desain fisik dan agregat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5 · 10%)</h3><ul><li>Model dimensional lengkap proses pertama: grain, jenis tabel fakta, dimensi, fakta.</li><li>Tabel kolom tiap dimensi: surrogate key, natural key, tipe SCD dan alasannya, baris bawaan.</li><li>Dim Tanggal dengan atribut kasus; role-playing dan junk bila ada.</li><li>Tindak lanjut penilaian sejawat hari ini.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Penilaian Hasil Produk. Tenggat: [PERLU DIISI]. Skema ini diimplementasikan di DBMS pada Pertemuan 6–7.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Surrogate key</span></dt><dd>Kunci utama tabel dimensi berupa bilangan bulat berurutan yang dibuat data warehouse sendiri, tanpa makna bisnis. <i>(kunci pengganti)</i></dd></div><div><dt><span class=\"en\">Natural key</span></dt><dd>Kunci dari sistem sumber yang bermakna bagi bisnis, mis. NIM, kode produk, atau NIK. <i>(kunci alami)</i></dd></div><div><dt><span class=\"en\">Unknown / default row</span></dt><dd>Baris khusus dimensi (mis. Tidak diketahui, Belum terjadi) agar kunci di tabel fakta tidak pernah kosong. <i>(baris bawaan)</i></dd></div><div><dt><span class=\"en\">Slowly changing dimension (SCD)</span></dt><dd>Teknik menangani atribut dimensi yang sesekali berubah, mis. prodi atau alamat mahasiswa. <i>(dimensi yang berubah perlahan)</i></dd></div><div><dt><span class=\"en\">SCD type 1</span></dt><dd>Nilai lama ditimpa nilai baru; riwayat hilang. <i>(SCD tipe 1 (timpa))</i></dd></div><div><dt><span class=\"en\">SCD type 2</span></dt><dd>Perubahan disimpan sebagai baris baru dengan surrogate key baru; riwayat terjaga. <i>(SCD tipe 2 (baris baru))</i></dd></div><div><dt><span class=\"en\">SCD type 3</span></dt><dd>Nilai lama disimpan di kolom tambahan (mis. prodi_sebelumnya); hanya satu perubahan terakhir yang terekam. <i>(SCD tipe 3 (kolom baru))</i></dd></div><div><dt><span class=\"en\">Row effective/expiration date</span></dt><dd>Dua kolom tanggal yang mencatat sejak dan sampai kapan sebuah baris dimensi berlaku. <i>(tanggal berlaku baris)</i></dd></div><div><dt><span class=\"en\">Current row indicator</span></dt><dd>Kolom penanda baris dimensi yang berlaku saat ini (Ya/Tidak). <i>(penanda baris berlaku)</i></dd></div><div><dt><span class=\"en\">Calendar date dimension</span></dt><dd>Dimensi dengan satu baris per hari, berisi atribut kalender, akademik, dan hari libur. <i>(dimensi tanggal)</i></dd></div><div><dt><span class=\"en\">Role-playing dimension</span></dt><dd>Satu tabel dimensi yang dipakai beberapa kali oleh satu tabel fakta dengan peran berbeda, mis. tanggal daftar dan tanggal tes. <i>(dimensi berperan ganda)</i></dd></div><div><dt><span class=\"en\">Junk dimension</span></dt><dd>Satu dimensi yang menghimpun beberapa penanda berkardinalitas rendah, hanya untuk kombinasi yang benar-benar muncul. <i>(dimensi gabungan penanda)</i></dd></div><div><dt><span class=\"en\">Low cardinality</span></dt><dd>Kolom dengan sedikit nilai berbeda, mis. Ya/Tidak atau Reguler/Karyawan. <i>(kardinalitas rendah)</i></dd></div><div><dt><span class=\"en\">Dimension table</span></dt><dd>Tabel yang menyimpan atribut deskriptif, mis. nama prodi, fakultas, atau kategori produk, untuk menyaring dan mengelompokkan fakta. <i>(tabel dimensi)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Desain Fisik Data Warehouse","subtitle":"DDL tabel fakta dan dimensi, indexing (B-tree, bitmap), partitioning","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Data Warehouse · SII047</span></div><h1>Desain Fisik Data Warehouse</h1><p class=\"lead\">DDL tabel fakta dan dimensi, indexing (B-tree, bitmap), partitioning</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Konsep + praktikum PostgreSQL</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengimplementasikan skema fisik data warehouse dan mengoptimalkan kinerjanya (C3–C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: 1 dan 2)</span></h3><ol><li>Ketepatan DDL tabel fakta dan dimensi.</li><li>Ketepatan strategi indexing dan partitioning. <span class=\"muted\">(dilanjutkan P7)</span></li><li>Ketepatan menjelaskan kelebihan penyimpanan kolumnar. <span class=\"muted\">(Pertemuan 7)</span></li><li>Kualitas presentasi rancangan dan skema fisik. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu mengimplementasikan data warehouse, proses ETL/ELT, dan kueri OLAP dengan metode dan alat yang tepat.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 5 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Mengapa NIM tidak dipakai sebagai kunci utama Dim Mahasiswa?</li><li>Apa yang terjadi pada baris lama di SCD tipe 2?</li><li>Untuk apa baris bawaan −1?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Model dimensional (Tugas 1B) sudah ada diagramnya?</li><li>Setiap dimensi punya surrogate key dan natural key?</li><li>Sudah ada contoh data sumber yang dianonimkan?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Kasus ilustrasi</span></div><h2>Model benar, kueri tetap lambat</h2><div class=\"cols w\"><div><p class=\"lead\">BAAK sebuah kampus memuat skema bintang Penilaian ke DBMS. Model sudah mengikuti Kimball, tetapi:</p><ul><li>Kunci fakta memakai NIM bertipe teks.</li><li>Tidak ada kunci asing; ada fakta yang menunjuk mahasiswa yang tidak ada.</li><li>Laporan IPS per tahun akademik membaca seluruh 10 tahun data setiap kali dijalankan.</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Diskusikan berpasangan</h3><ol><li>Masalah mana yang menyangkut <b>ruang</b>, <b>kebenaran data</b>, dan <b>kecepatan</b>?</li><li>Keputusan apa yang belum dibuat saat merancang model?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1–2</span></div><h2>Keputusan <button type=\"button\" class=\"term\" data-term=\"physical-design\">desain fisik</button></h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Keputusan</th><th>Contoh di skema Penilaian</th><th>Kapan</th></tr></thead><tbody><tr><td><button type=\"button\" class=\"term\" data-term=\"data-type\">Tipe data</button> dan ukuran</td><td>kunci <code>integer</code>, sks <code>smallint</code>, mutu <code>numeric(4,1)</code></td><td>P6</td></tr><tr><td>Kunci dan constraint</td><td><button type=\"button\" class=\"term\" data-term=\"primary-key\">primary key</button>, <button type=\"button\" class=\"term\" data-term=\"foreign-key\">foreign key</button>, <code>NOT NULL</code></td><td>P6</td></tr><tr><td>Pemuatan data</td><td><button type=\"button\" class=\"term\" data-term=\"bulk-load\">bulk load</button> CSV dengan <code>\\copy</code></td><td>P6</td></tr><tr><td>Index dan partisi</td><td>B-tree pada kunci asing; partisi per tahun</td><td>P6–7</td></tr><tr><td>Agregat, materialized view, kolumnar</td><td>ringkasan IPS per semester</td><td>P7</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Diadaptasi dari Kimball &amp; Ross (2013) dan Reis &amp; Housley (2022); pengelompokan ini definisi kerja mata kuliah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tipe data</span><span>Indikator 1</span></div><h2>Kolom kecil, tabel fakta ramping</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.85em\"><thead><tr><th>Kolom fakta_penilaian</th><th>Tipe</th><th>Byte</th></tr></thead><tbody><tr><td>tanggal_key</td><td><code>integer</code> (YYYYMMDD)</td><td>4</td></tr><tr><td>mahasiswa_key, matakuliah_key</td><td><code>integer</code></td><td>4 + 4</td></tr><tr><td>profil_kelas_key, sks</td><td><code>smallint</code></td><td>2 + 2</td></tr><tr><td>nilai_huruf</td><td><code>varchar(2)</code></td><td>≈ 2,5</td></tr><tr><td>mutu</td><td><code>numeric(4,1)</code></td><td>≈ 6</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Prinsip</h3><ul><li>Kunci: bilangan bulat, bukan teks.</li><li>Pilih tipe terkecil yang cukup.</li><li>Uang dan nilai: <code>numeric</code>, bukan <code>real</code>.</li><li>Ukuran kolom dikali jumlah baris fakta.</li></ul></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Byte = rata-rata <code>pg_column_size</code> di PostgreSQL 16 pada data praktikum.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Simulasi bertahap · indikator 1</span></div><h2>Berapa ukuran tabel fakta?</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;dw6-ukuran&quot;,&quot;ms&quot;:3600,&quot;steps&quot;:[{&quot;t&quot;:&quot;Lebar data per baris&quot;,&quot;en&quot;:&quot;data&quot;,&quot;d&quot;:&quot;Jumlahkan ukuran kolom fakta_penilaian (slide sebelumnya).&quot;,&quot;ex&quot;:&quot;4 + 4 + 4 + 2 + 2,5 + 2 + 6 ≈ &lt;b&gt;25 byte&lt;/b&gt;&quot;},{&quot;t&quot;:&quot;Tambah overhead baris&quot;,&quot;en&quot;:&quot;overhead&quot;,&quot;d&quot;:&quot;PostgreSQL menambah kepala baris (23 byte, dibulatkan 24) dan penunjuk baris 4 byte.&quot;,&quot;ex&quot;:&quot;25 + 24 + 4 ≈ &lt;b&gt;53 byte per baris&lt;/b&gt;&quot;},{&quot;t&quot;:&quot;Kali jumlah baris&quot;,&quot;en&quot;:&quot;estimate&quot;,&quot;d&quot;:&quot;Data praktikum 4.140 baris; versi diperbanyak 1.035.000 baris.&quot;,&quot;ex&quot;:&quot;4.140 × 53 = 219.420 byte ≈ &lt;b&gt;214 KB&lt;/b&gt; · 1.035.000 × 53 = 54.855.000 byte ≈ &lt;b&gt;52 MB&lt;/b&gt;&quot;},{&quot;t&quot;:&quot;Bandingkan dengan hasil ukur&quot;,&quot;en&quot;:&quot;measure&quot;,&quot;d&quot;:&quot;&lt;code&gt;pg_relation_size&lt;/code&gt; menghitung halaman 8 KB yang terpakai.&quot;,&quot;ex&quot;:&quot;29 × 8.192 = 237.568 byte (&lt;b&gt;232 KB&lt;/b&gt;) · 7.104 × 8.192 = 58.195.968 byte (&lt;b&gt;≈ 56 MB&lt;/b&gt;). Selisih ± 6–8%: kepala halaman, perataan, sisa ruang.&quot;},{&quot;t&quot;:&quot;Pelajaran: ukuran kunci&quot;,&quot;en&quot;:&quot;keys&quot;,&quot;d&quot;:&quot;NIM &lt;code&gt;varchar(10)&lt;/code&gt; = 11 byte; surrogate key &lt;code&gt;integer&lt;/code&gt; = 4 byte.&quot;,&quot;ex&quot;:&quot;(11 − 4) × 1.035.000 = 7.245.000 byte ≈ &lt;b&gt;6,9 MB&lt;/b&gt; untuk satu kolom kunci, belum termasuk index&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Klik Play atau pilih langkah. 1 KB = 1.024 byte; 1 MB = 1.024 KB. Angka ukur dari PostgreSQL 16, data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\"><button type=\"button\" class=\"term\" data-term=\"ddl\">DDL</button></span><span>Dari berkas 01_ddl.sql · indikator 1</span></div><h2>Tabel dimensi dengan SCD tipe 2</h2><div class=\"cols w\"><div><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.62em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;overflow-x:auto;white-space:pre;max-width:100%\">CREATE TABLE dim_mahasiswa (\n  mahasiswa_key  integer     PRIMARY KEY,   -- surrogate key\n  nim            varchar(10) NOT NULL,      -- natural key\n  nama           varchar(60) NOT NULL,\n  angkatan       smallint    NOT NULL,\n  jalur_masuk    varchar(20) NOT NULL,\n  prodi          varchar(40) NOT NULL,      -- SCD tipe 2\n  fakultas       varchar(40) NOT NULL,\n  kabupaten_asal varchar(40) NOT NULL,\n  berlaku_mulai  date        NOT NULL,\n  berlaku_sampai date        NOT NULL,\n  is_current     varchar(5)  NOT NULL\n);</pre></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Perhatikan</h3><ul><li><code>mahasiswa_key</code>: surrogate key, primary key.</li><li><code>nim</code>: natural key, <b>tidak</b> unik (versi SCD).</li><li>Tiga kolom administrasi SCD tipe 2.</li><li><code>NOT NULL</code> di semua kolom: baris bawaan −1 mengisi nilai \"Tidak diketahui\".</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">DDL</span><span>Dari berkas 01_ddl.sql · indikator 1</span></div><h2>Tabel fakta: kunci asing dan grain</h2><div class=\"cols w\"><div><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.62em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;overflow-x:auto;white-space:pre;max-width:100%\">CREATE TABLE fakta_penilaian (\n  tanggal_key      integer  NOT NULL REFERENCES dim_tanggal,\n  mahasiswa_key    integer  NOT NULL REFERENCES dim_mahasiswa,\n  matakuliah_key   integer  NOT NULL REFERENCES dim_matakuliah,\n  profil_kelas_key smallint NOT NULL REFERENCES dim_profil_kelas,\n  nilai_huruf      varchar(2)   NOT NULL,\n  sks              smallint     NOT NULL,\n  mutu             numeric(4,1) NOT NULL,     -- sks x bobot\n  PRIMARY KEY (mahasiswa_key, matakuliah_key, tanggal_key)\n);</pre></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Perhatikan</h3><ul><li>Setiap kunci: <code>NOT NULL</code> + <button type=\"button\" class=\"term\" data-term=\"foreign-key\"><code>REFERENCES</code></button>.</li><li><code>PRIMARY KEY</code> gabungan = kalimat grain: satu baris per mahasiswa per MK per semester.</li><li>Fakta aditif <code>sks</code> dan <code>mutu</code>; IPK dihitung saat kueri.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dim Tanggal</span><span>Dari berkas 02_muat.sql · indikator 1</span></div><h2>Dim Tanggal dibangkitkan, bukan diketik</h2><div class=\"cols w\"><div><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.58em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;overflow-x:auto;white-space:pre;max-width:100%\">INSERT INTO dim_tanggal\nSELECT to_char(d, 'YYYYMMDD')::int, d,\n  (ARRAY['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'])\n    [extract(dow FROM d)::int + 1],\n  extract(month FROM d),\n  (ARRAY['Januari','Februari','Maret','April','Mei','Juni','Juli',\n    'Agustus','September','Oktober','November','Desember'])\n    [extract(month FROM d)::int],\n  extract(year FROM d),\n  CASE WHEN extract(month FROM d) BETWEEN 3 AND 8\n       THEN 'Genap' ELSE 'Ganjil' END,\n  CASE WHEN extract(month FROM d) &gt;= 9\n       THEN to_char(d, 'YYYY') || '/' || (extract(year FROM d)::int + 1)\n       ELSE (extract(year FROM d)::int - 1) || '/' || to_char(d, 'YYYY') END\nFROM generate_series(date '2021-01-01', date '2026-12-31',\n                     interval '1 day') AS g(d);</pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Hasil</h3><ul><li>2.191 hari (2021–2026) + 1 baris −1 = <b>2.192 baris</b>.</li><li>Kunci YYYYMMDD dari <code>to_char</code>.</li><li>Ganjil: Sep–Feb; Genap: Mar–Agu (definisi kerja).</li><li>Libur nasional: kolom tambahan diisi dari SKB.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Persiapan</span><span>PostgreSQL · 10 menit</span></div><h2>Siapkan lingkungan: PostgreSQL lokal atau Google Colab</h2><p class=\"muted\" style=\"margin:.2em 0 .5em\">Pilih salah satu; berkas SQL praktikum sama persis di keduanya. Colab tanpa instalasi tetapi butuh akun Google dan internet; PostgreSQL lokal dipasang sekali dan dipakai lagi di Tugas 1C dan Tugas 2.</p><div class=\"sim sim-env\" data-sim=\"env\" data-cfg=\"{&quot;id&quot;:&quot;p6-env&quot;,&quot;tabs&quot;:[{&quot;id&quot;:&quot;lokal&quot;,&quot;label&quot;:&quot;PostgreSQL lokal&quot;,&quot;steps&quot;:[&quot;Pasang PostgreSQL 14 atau lebih baru dari &lt;b&gt;postgresql.org/download&lt;/b&gt;. Windows: installer EDB, catat kata sandi pengguna &lt;code&gt;postgres&lt;/code&gt;, biarkan &lt;i&gt;Command Line Tools&lt;/i&gt; tercentang. macOS: Postgres.app. Linux: &lt;code&gt;sudo apt install postgresql&lt;/code&gt;.&quot;,&quot;Buat folder &lt;code&gt;praktikum-dw&lt;/code&gt; (mis. &lt;code&gt;C:/praktikum-dw&lt;/code&gt;); simpan semua berkas dari tombol &lt;b&gt;Unduh&lt;/b&gt; (CSV dan .sql) di folder itu.&quot;,&quot;Buka &lt;b&gt;SQL Shell (psql)&lt;/b&gt; (Windows) atau terminal, masuk sebagai &lt;code&gt;postgres&lt;/code&gt;, lalu jalankan kode di samping baris demi baris.&quot;,&quot;Praktikum berikutnya: cukup &lt;code&gt;\\\\c dw_praktikum&lt;/code&gt;, &lt;code&gt;\\\\cd&lt;/code&gt; ke folder, lalu &lt;code&gt;\\\\i&lt;/code&gt; berkas yang diminta.&quot;,&quot;pgAdmin boleh dipakai untuk melihat tabel, tetapi &lt;code&gt;\\\\copy&lt;/code&gt;, &lt;code&gt;\\\\cd&lt;/code&gt;, dan &lt;code&gt;\\\\i&lt;/code&gt; hanya berjalan di psql.&quot;],&quot;code&quot;:&quot;-- di psql, masuk sebagai postgres\\nCREATE DATABASE dw_praktikum;\\n\\\\c dw_praktikum\\n\\\\cd C:/praktikum-dw    -- macOS/Linux: \\\\cd ~/praktikum-dw\\n\\\\i 01_ddl.sql\\n\\\\i 02_muat.sql\\n\\\\i 03_kueri.sql&quot;},{&quot;id&quot;:&quot;colab&quot;,&quot;label&quot;:&quot;Google Colab&quot;,&quot;steps&quot;:[&quot;Buka &lt;b&gt;colab.research.google.com&lt;/b&gt;, masuk akun Google, pilih &lt;i&gt;New notebook&lt;/i&gt;.&quot;,&quot;Sel pertama memasang dan menyalakan PostgreSQL, lalu membuat pengguna dan database (± 1 menit).&quot;,&quot;Unggah semua CSV dan berkas .sql dari slide dengan &lt;code&gt;files.upload()&lt;/code&gt; atau seret ke panel &lt;i&gt;Files&lt;/i&gt;; berkas masuk ke &lt;code&gt;/content&lt;/code&gt;.&quot;,&quot;Jalankan skrip dengan &lt;code&gt;!psql -d dw_praktikum -f nama_berkas.sql&lt;/code&gt;; hasil kueri tampil di bawah sel.&quot;,&quot;Runtime direset = database hilang. Di sesi baru, jalankan ulang sel pertama, unggah ulang, lalu skrip 01–03 (± 2 menit).&quot;],&quot;code&quot;:&quot;!apt-get -qq install -y postgresql &gt; /dev/null\\n!service postgresql start\\n!sudo -u postgres createuser -s root\\n!createdb dw_praktikum\\n\\nfrom google.colab import files\\nfiles.upload()   # pilih CSV dan .sql dari slide\\n\\n!psql -d dw_praktikum -f 01_ddl.sql\\n!psql -d dw_praktikum -f 02_muat.sql\\n!psql -d dw_praktikum -f 03_kueri.sql&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Bahan · 4 CSV + 3 berkas SQL</span></div><h2>Unduh bahan, simpan dalam satu folder</h2><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;dw6-bahan1&quot;,&quot;files&quot;:[{&quot;name&quot;:&quot;dim_mahasiswa.csv&quot;,&quot;csv&quot;:&quot;mahasiswa_key,nim,nama,angkatan,jalur_masuk,prodi,fakultas,kabupaten_asal,berlaku_mulai,berlaku_sampai,is_current\\n-1,-,Tidak diketahui,0,Tidak diketahui,Tidak diketahui,Tidak diketahui,Tidak diketahui,1900-01-01,9999-12-31,Ya\\n1,2110001,Ani,2021,Reguler,Sistem Informasi,Fakultas Teknik,Gresik,2021-09-01,2023-08-31,Tidak\\n2,2110002,Putri A.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Malang,2021-09-01,9999-12-31,Ya\\n3,2110003,Arif I.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Pasuruan,2021-09-01,9999-12-31,Ya\\n4,2110004,Zahra X.,2021,Beasiswa,Sistem Informasi,Fakultas Teknik,Sidoarjo,2021-09-01,9999-12-31,Ya\\n5,2110005,Joko J.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Surabaya,2021-09-01,9999-12-31,Ya\\n6,2110006,Farhan W.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Sidoarjo,2021-09-01,9999-12-31,Ya\\n7,2110007,Dimas A.,2021,Beasiswa,Sistem Informasi,Fakultas Teknik,Jombang,2021-09-01,9999-12-31,Ya\\n8,2110008,Putri V.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Sidoarjo,2021-09-01,9999-12-31,Ya\\n9,2110009,Salma D.,2021,Prestasi,Sistem Informasi,Fakultas Teknik,Pasuruan,2021-09-01,9999-12-31,Ya\\n10,2110010,Arif K.,2021,Reguler,Sistem Informasi,Fakultas Teknik,Sid ABLE dim_matakuliah (\\n  matakuliah_key     integer     PRIMARY KEY,\\n  kode_mk            varchar(8)  NOT NULL,\\n  nama_mk            varchar(60) NOT NULL,\\n  sks                smallint    NOT NULL,\\n  semester_kurikulum smallint    NOT NULL,\\n  prodi              varchar(40) NOT NULL\\n);\\n\\nCREATE TABLE dim_profil_kelas (              -- junk dimension (P5)\\n  profil_kelas_key smallint    PRIMARY KEY,\\n  jenis_kelas      varchar(15) NOT NULL,\\n  status_ambil     varchar(15) NOT NULL,\\n  mode_kuliah      varchar(15) NOT NULL\\n);\\n\\nCREATE TABLE fakta_penilaian (\\n  tanggal_key      integer  NOT NULL REFERENCES dim_tanggal,\\n  mahasiswa_key    integer  NOT NULL REFERENCES dim_mahasiswa,\\n  matakuliah_key   integer  NOT NULL REFERENCES dim_matakuliah,\\n  profil_kelas_key smallint NOT NULL REFERENCES dim_profil_kelas,\\n  nilai_huruf      varchar(2)   NOT NULL,\\n  sks              smallint     NOT NULL,\\n  mutu             numeric(4,1) NOT NULL,     -- sks x bobot\\n  PRIMARY KEY (mahasiswa_key, matakuliah_key, tanggal_key)\\n);\\n&quot;,&quot;desc&quot;:&quot;CREATE TABLE empat dimensi dan tabel fakta&quot;},{&quot;name&quot;:&quot;02_muat.sql&quot;,&quot;csv&quot;:&quot;-- 02_muat.sql · isi dimensi tanggal, muat CSV, periksa hasil\\nINSERT INTO dim_tanggal VALUES\\n  (-1, NULL, 'Tidak diketahui', 0, 'Tidak diketahui', 0, '-', '-');\\nINSERT INTO dim_tanggal\\nSELECT to_char(d, 'YYYYMMDD')::int, d,\\n  (ARRAY['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'])\\n    [extract(dow FROM d)::int + 1],\\n  extract(month FROM d),\\n  (ARRAY['Januari','Februari','Maret','April','Mei','Juni','Juli',\\n    'Agustus','September','Oktober','November','Desember'])\\n    [extract(month FROM d)::int],\\n  extract(year FROM d),\\n  CASE WHEN extract(month FROM d) BETWEEN 3 AND 8\\n       THEN 'Genap' ELSE 'Ganjil' END,\\n  CASE WHEN extract(month FROM d) &gt;= 9\\n       THEN to_char(d, 'YYYY') || '/' || (extract(year FROM d)::int + 1)\\n       ELSE (extract(year FROM d)::int - 1) || '/' || to_char(d, 'YYYY') END\\nFROM generate_series(date '2021-01-01', date '2026-12-31',\\n                     interval '1 day') AS g(d);\\n\\n\\\\copy dim_mahasiswa FROM 'dim_mahasiswa.csv' WITH (FORMAT csv, HEADER true)\\n\\\\copy dim_matakuliah FROM 'dim_matakuliah.csv' WITH (FORMAT csv, HEADER true)\\n\\\\copy dim_profil_kelas FROM 'dim_profil_kelas.csv' WITH (FORMAT csv, HEADER true)\\n\\\\copy fakta_penilaian FROM 'fakta_penilaian.csv' WITH (FORMAT csv, HEADER true)\\n\\nSELECT 'dim_tanggal' AS tabel, count(*) AS baris FROM dim_tanggal\\nUNION ALL SELECT 'dim_mahasiswa', count(*) FROM dim_mahasiswa\\nUNION ALL SELECT 'dim_matakuliah', count(*) FROM dim_matakuliah\\nUNION ALL SELECT 'dim_profil_kelas', count(*) FROM dim_profil_kelas\\nUNION ALL SELECT 'fakta_penilaian', count(*) FROM fakta_penilaian;\\n&quot;,&quot;desc&quot;:&quot;isi Dim Tanggal, \\\\copy keempat CSV, hitung baris&quot;},{&quot;name&quot;:&quot;03_kueri.sql&quot;,&quot;csv&quot;:&quot;-- 03_kueri.sql · tiga kueri analitik\\n-- (1) IPS rata-rata per prodi per tahun akademik, menurut keadaan saat itu\\nSELECT t.tahun_akademik, m.prodi,\\n       round(SUM(f.mutu) / SUM(f.sks), 2) AS ips_rata\\nFROM fakta_penilaian f\\nJOIN dim_tanggal   t ON t.tanggal_key   = f.tanggal_key\\nJOIN dim_mahasiswa m ON m.mahasiswa_key = f.mahasiswa_key\\nGROUP BY t.tahun_akademik, m.prodi\\nORDER BY t.tahun_akademik, m.prodi;\\n\\n-- (2) SKS tahun akademik 2022/2023 per prodi: saat itu vs sekarang\\nSELECT m.prodi AS prodi_saat_itu, c.prodi AS prodi_sekarang,\\n       SUM(f.sks) AS total_sks\\nFROM fakta_penilaian f\\nJOIN dim_tanggal   t ON t.tanggal_key   = f.tanggal_key\\nJOIN dim_mahasiswa m ON m.mahasiswa_key = f.mahasiswa_key\\nJOIN dim_mahasiswa c ON c.nim = m.nim AND c.is_current = 'Ya'\\nWHERE t.tahun_akademik = '2022/2023'\\nGROUP BY m.prodi, c.prodi\\nORDER BY 1, 2;\\n\\n-- (3) Sebaran mode kuliah dan rata-rata bobot nilai\\nSELECT p.mode_kuliah, count(*) AS baris,\\n       round(SUM(f.mutu) / SUM(f.sks), 2) AS bobot_rata\\nFROM fakta_penilaian f\\nJOIN dim_profil_kelas p ON p.profil_kelas_key = f.profil_kelas_key\\nGROUP BY p.mode_kuliah\\nORDER BY baris DESC;\\n&quot;,&quot;desc&quot;:&quot;tiga kueri analitik&quot;}],&quot;compact&quot;:true}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Data ilustrasi kampus rekaan: 240 mahasiswa angkatan 2021–2024, dua prodi, nilai Feb 2022–Feb 2026. Simpan dengan nama berkas apa adanya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Jalankan dan cocokkan · indikator 1</span></div><h2>DDL, muat, kueri</h2><div class=\"cols\"><div><ol style=\"font-size:.86em;margin:0;padding-left:1.2em\"><li><code>\\i 01_ddl.sql</code> (Colab: <code>!psql -d dw_praktikum -f 01_ddl.sql</code>)</li><li><code>\\i 02_muat.sql</code>: cocokkan jumlah baris.</li><li><code>\\i 03_kueri.sql</code>: cocokkan hasil kueri 2.</li><li>Uji kunci asing:</li></ol><pre style=\"margin:.3em 0 0;font-family:var(--mono);font-size:.62em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.55em .7em;overflow-x:auto;white-space:pre;max-width:100%\">INSERT INTO fakta_penilaian\nVALUES (20250210, 9999, 1, 1, 'A', 3, 12.0);</pre></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Tabel</th><th>Baris</th></tr></thead><tbody><tr><td>dim_tanggal</td><td>2.192</td></tr><tr><td>dim_mahasiswa</td><td>245</td></tr><tr><td>dim_matakuliah</td><td>49</td></tr><tr><td>dim_profil_kelas</td><td>10</td></tr><tr><td>fakta_penilaian</td><td>4.140</td></tr></tbody></table><table class=\"t\" style=\"font-size:.8em;margin-top:.5em\"><thead><tr><th colspan=\"3\">Kueri 2 · SKS 2022/2023</th></tr><tr><th>Prodi saat itu</th><th>Prodi sekarang</th><th>SKS</th></tr></thead><tbody><tr><td>Informatika</td><td>Informatika</td><td>900</td></tr><tr><td>Sistem Informasi</td><td>Informatika</td><td>72</td></tr><tr><td>Sistem Informasi</td><td>Sistem Informasi</td><td>1.188</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan kelompok</span><span>Kelompok Tugas 1 · 15 menit</span></div><h2>DDL skema kelompok Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Langkah</th><th>Periksa</th></tr></thead><tbody><tr><td>1. Tulis <code>CREATE TABLE</code> satu dimensi dan tabel fakta dari model 1B</td><td>tipe data terkecil yang cukup</td></tr><tr><td>2. Tambah primary key, foreign key, <code>NOT NULL</code></td><td>primary key fakta = grain</td></tr><tr><td>3. Sisipkan baris bawaan −1</td><td>kunci fakta tidak pernah kosong</td></tr><tr><td>4. Jalankan di database praktikum</td><td>tanpa galat; ulangi dari awal tetap berhasil</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Pakai pola</h3><p><code>01_ddl.sql</code> sebagai contoh. Simpan sebagai awal skrip Tugas 1C.</p><p class=\"muted\" style=\"font-size:.85em\">Formatif; penilaian resmi lewat Tugas 1C.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Index</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"sequential-scan\">Sequential scan</button> vs <button type=\"button\" class=\"term\" data-term=\"b-tree-index\">B-tree index</button></h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Tanpa index</h3><p>Mencari IPK satu mahasiswa di 1.035.000 baris: semua baris dibaca, 1.032.000 dibuang.</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Dengan B-tree</h3><p>Index pada <code>mahasiswa_key</code> menunjuk langsung ke 3.000 baris yang cocok.</p></div></div><div class=\"tw\" style=\"margin-top:.6em\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>Index pada…</th><th>Untuk kueri</th><th>Harga</th></tr></thead><tbody><tr><td>kunci asing fakta</td><td>filter atau join ke satu anggota dimensi</td><td rowspan=\"2\">ruang (7 MB untuk 56 MB tabel) dan pemuatan lebih lambat</td></tr><tr><td>atribut dimensi yang sering disaring</td><td>prodi, angkatan, nama MK</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\"><button type=\"button\" class=\"term\" data-term=\"bitmap-index\">Bitmap index</button></span><span>Simulasi bertahap · indikator 2</span></div><h2>Gabungan kondisi dengan bit</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;dw6-bitmap&quot;,&quot;ms&quot;:3400,&quot;steps&quot;:[{&quot;t&quot;:&quot;Delapan baris&quot;,&quot;en&quot;:&quot;rows&quot;,&quot;d&quot;:&quot;Kolom mode dan status, contoh kecil.&quot;,&quot;ex&quot;:&quot;1 Luring·Baru · 2 Daring·Baru · 3 Daring·Mengulang · 4 Luring·Baru · 5 Hibrida·Mengulang · 6 Daring·Baru · 7 Luring·Mengulang · 8 Daring·Mengulang&quot;},{&quot;t&quot;:&quot;Bitmap Daring&quot;,&quot;en&quot;:&quot;bitmap 1&quot;,&quot;d&quot;:&quot;Bitmap untuk mode = Daring; satu bit per baris, 1 bila cocok.&quot;,&quot;ex&quot;:&quot;&lt;code&gt;0 1 1 0 0 1 0 1&lt;/code&gt;&quot;},{&quot;t&quot;:&quot;Bitmap Mengulang&quot;,&quot;en&quot;:&quot;bitmap 2&quot;,&quot;d&quot;:&quot;Bitmap kedua untuk status = Mengulang.&quot;,&quot;ex&quot;:&quot;&lt;code&gt;0 0 1 0 1 0 1 1&lt;/code&gt;&quot;},{&quot;t&quot;:&quot;Operasi AND&quot;,&quot;en&quot;:&quot;and&quot;,&quot;d&quot;:&quot;Bit 1 hanya bila kedua kondisi terpenuhi.&quot;,&quot;ex&quot;:&quot;&lt;code&gt;0 0 1 0 0 0 0 1&lt;/code&gt; → baris &lt;b&gt;3 dan 8&lt;/b&gt;&quot;},{&quot;t&quot;:&quot;Di PostgreSQL&quot;,&quot;en&quot;:&quot;bitmap scan&quot;,&quot;d&quot;:&quot;Tidak ada bitmap index permanen; bitmap dibentuk saat kueri dari index B-tree.&quot;,&quot;ex&quot;:&quot;Rencana kueri praktikum: &lt;code&gt;Bitmap Index Scan&lt;/code&gt; → &lt;code&gt;Bitmap Heap Scan&lt;/code&gt;&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Contoh ilustrasi. Bitmap index permanen tersedia di DBMS tertentu, mis. Oracle.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\"><button type=\"button\" class=\"term\" data-term=\"partitioning\">Partitioning</button></span><span>Indikator 2</span></div><h2>Satu tabel, beberapa partisi per tahun</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 240\" style=\"max-height:11em\" role=\"img\" aria-label=\"Tabel fakta dipecah menjadi lima partisi per tahun 2022 sampai 2026. Kueri untuk tahun 2025 hanya membaca partisi 2025; empat partisi lain dilewati.\"><rect x=\"20\" y=\"70\" width=\"210\" height=\"110\" rx=\"6\" class=\"s-soft\"/><text x=\"125\" y=\"104\" text-anchor=\"middle\" class=\"s-hd\">KUERI</text><text x=\"125\" y=\"128\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">tanggal_key antara</text><text x=\"125\" y=\"148\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12px\">20250101 dan 20251231</text><rect x=\"300\" y=\"20\" width=\"580\" height=\"210\" rx=\"6\" class=\"s-box\"/><text x=\"590\" y=\"46\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">fakta_part (PARTITION BY RANGE tanggal_key)</text><rect x=\"318\" y=\"66\" width=\"100\" height=\"120\" rx=\"4\" class=\"s-soft\"/><text x=\"368\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">2022</text><text x=\"368\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">90.000</text><text x=\"368\" y=\"138\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">baris</text><text x=\"368\" y=\"168\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">dilewati</text><rect x=\"430\" y=\"66\" width=\"100\" height=\"120\" rx=\"4\" class=\"s-soft\"/><text x=\"480\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">2023</text><text x=\"480\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">180.000</text><text x=\"480\" y=\"138\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">baris</text><text x=\"480\" y=\"168\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">dilewati</text><rect x=\"542\" y=\"66\" width=\"100\" height=\"120\" rx=\"4\" class=\"s-soft\"/><text x=\"592\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">2024</text><text x=\"592\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">270.000</text><text x=\"592\" y=\"138\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">baris</text><text x=\"592\" y=\"168\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">dilewati</text><rect x=\"654\" y=\"66\" width=\"100\" height=\"120\" rx=\"4\" class=\"s-acc\"/><text x=\"704\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">2025</text><text x=\"704\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">360.000</text><text x=\"704\" y=\"138\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">baris</text><text x=\"704\" y=\"168\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">dibaca</text><rect x=\"766\" y=\"66\" width=\"100\" height=\"120\" rx=\"4\" class=\"s-soft\"/><text x=\"816\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">2026</text><text x=\"816\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">135.000</text><text x=\"816\" y=\"138\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">baris</text><text x=\"816\" y=\"168\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">dilewati</text><line x1=\"230\" y1=\"125\" x2=\"654\" y2=\"125\" class=\"s-dash\"/><text x=\"590\" y=\"215\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">+ partisi DEFAULT untuk nilai di luar rentang (mis. -1)</text></svg><figcaption>Partition pruning pada tabel fakta praktikum (1.035.000 baris, data ilustrasi diperbanyak). Hasil uji PostgreSQL 16.</figcaption></figure><div class=\"cols c3\" style=\"margin-top:.3em;font-size:.84em\"><div class=\"card\"><b>Kunci partisi</b><br>kolom yang hampir selalu difilter: tanggal_key</div><div class=\"card\"><b><button type=\"button\" class=\"term\" data-term=\"partition-pruning\">Pruning</button></b><br>partisi di luar rentang dilewati</div><div class=\"card\"><b>Pengelolaan</b><br>data lama dihapus per partisi</div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 2</span><span>Index dan partisi · indikator 2</span></div><h2>Ukur dengan <button type=\"button\" class=\"term\" data-term=\"query-plan\">EXPLAIN ANALYZE</button></h2><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;dw6-bahan2&quot;,&quot;files&quot;:[{&quot;name&quot;:&quot;04_index.sql&quot;,&quot;csv&quot;:&quot;-- 04_index.sql · uji index B-tree pada tabel fakta yang diperbanyak\\n-- Data ilustrasi: setiap baris fakta disalin 250 kali agar efek index terlihat\\nDROP TABLE IF EXISTS fakta_besar CASCADE;\\nCREATE TABLE fakta_besar AS\\nSELECT f.* FROM fakta_penilaian f CROSS JOIN generate_series(1, 250) AS g(n);\\nANALYZE fakta_besar;\\nSELECT count(*) AS baris,\\n       pg_size_pretty(pg_relation_size('fakta_besar')) AS ukuran\\nFROM fakta_besar;\\n\\n-- (a) tanpa index\\nEXPLAIN ANALYZE\\nSELECT round(SUM(mutu) / SUM(sks), 2) AS ipk\\nFROM fakta_besar WHERE mahasiswa_key = 241;\\n\\n-- (b) dengan index B-tree pada kunci asing\\nCREATE INDEX ix_besar_mhs ON fakta_besar (mahasiswa_key);\\nANALYZE fakta_besar;\\nEXPLAIN ANALYZE\\nSELECT round(SUM(mutu) / SUM(sks), 2) AS ipk\\nFROM fakta_besar WHERE mahasiswa_key = 241;\\n&quot;,&quot;desc&quot;:&quot;tabel fakta diperbanyak, EXPLAIN ANALYZE sebelum dan sesudah index&quot;},{&quot;name&quot;:&quot;05_partisi.sql&quot;,&quot;csv&quot;:&quot;-- 05_partisi.sql · partisi rentang menurut tanggal_key (per tahun)\\nDROP TABLE IF EXISTS fakta_part CASCADE;\\nCREATE TABLE fakta_part (LIKE fakta_besar) PARTITION BY RANGE (tanggal_key);\\nCREATE TABLE fakta_part_2022 PARTITION OF fakta_part\\n  FOR VALUES FROM (20220101) TO (20230101);\\nCREATE TABLE fakta_part_2023 PARTITION OF fakta_part\\n  FOR VALUES FROM (20230101) TO (20240101);\\nCREATE TABLE fakta_part_2024 PARTITION OF fakta_part\\n  FOR VALUES FROM (20240101) TO (20250101);\\nCREATE TABLE fakta_part_2025 PARTITION OF fakta_part\\n  FOR VALUES FROM (20250101) TO (20260101);\\nCREATE TABLE fakta_part_2026 PARTITION OF fakta_part\\n  FOR VALUES FROM (20260101) TO (20270101);\\nCREATE TABLE fakta_part_lain PARTITION OF fakta_part DEFAULT;\\nINSERT INTO fakta_part SELECT * FROM fakta_besar;\\nANALYZE fakta_part;\\n\\nSELECT tableoid::regclass AS partisi, count(*) AS baris\\nFROM fakta_part GROUP BY 1 ORDER BY 1;\\n\\n-- tabel tanpa partisi vs tabel berpartisi, kueri satu tahun\\nEXPLAIN ANALYZE\\nSELECT round(SUM(mutu) / SUM(sks), 2) FROM fakta_besar\\nWHERE tanggal_key BETWEEN 20250101 AND 20251231;\\nEXPLAIN ANALYZE\\nSELECT round(SUM(mutu) / SUM(sks), 2) FROM fakta_part\\nWHERE tanggal_key BETWEEN 20250101 AND 20251231;\\n&quot;,&quot;desc&quot;:&quot;partisi per tahun, EXPLAIN ANALYZE&quot;}],&quot;compact&quot;:true}\"><p class=\"muted\">Loading…</p></div><div class=\"tw\" style=\"margin-top:.5em\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Uji (1.035.000 baris)</th><th>Rencana kueri</th><th>Waktu*</th></tr></thead><tbody><tr><td>IPK mahasiswa 241, tanpa index</td><td><code>Parallel Seq Scan</code></td><td>42,5 ms</td></tr><tr><td>sama, dengan index B-tree</td><td><code>Bitmap Index Scan</code> → <code>Bitmap Heap Scan</code></td><td>5,6 ms</td></tr><tr><td>IPS 2025, tabel tanpa partisi</td><td><code>Parallel Seq Scan on fakta_besar</code></td><td>56,5 ms</td></tr><tr><td>sama, tabel berpartisi</td><td><code>Parallel Seq Scan on fakta_part_2025</code> saja</td><td>39,1 ms</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.3em\">*Contoh satu kali uji di PostgreSQL 16; waktu di komputer Anda berbeda. Yang dicocokkan: nama langkah di rencana kueri.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario</span><span>Pilih strategi · indikator 2</span></div><h2>Permintaan dari BAAK dan dosen wali</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;dw6-strategi&quot;,&quot;start&quot;:&quot;a&quot;,&quot;ask&quot;:&quot;Strategi fisik mana yang paling tepat?&quot;,&quot;nodes&quot;:{&quot;a&quot;:{&quot;text&quot;:&quot;Tabel fakta Penilaian berisi 10 tahun data dan terus bertambah. Laporan BAAK hampir selalu untuk satu tahun akademik.&quot;,&quot;say&quot;:[[&quot;BAAK&quot;,&quot;Laporan IPS per prodi tahun ini makin lama makin lambat.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Partisi rentang menurut tanggal_key per tahun&quot;,&quot;tag&quot;:&quot;Partisi waktu&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Kueri satu periode hanya membaca partisi yang relevan, dan data lama mudah diarsipkan per partisi.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Index pada setiap kolom tabel fakta&quot;,&quot;tag&quot;:&quot;Index semua&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Index tidak membantu kueri yang membaca sebagian besar baris satu tahun, dan setiap index menambah ruang serta memperlambat pemuatan.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;Partisi menurut mahasiswa_key&quot;,&quot;tag&quot;:&quot;Partisi mahasiswa&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Laporan difilter menurut waktu, bukan mahasiswa, sehingga tidak ada partisi yang bisa dilewati.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Dosen wali sering membuka riwayat nilai satu mahasiswa di semua tahun.&quot;,&quot;say&quot;:[[&quot;Dosen wali&quot;,&quot;Saya perlu melihat IPK dan nilai setiap mahasiswa wali saya dengan cepat.&quot;]],&quot;ask&quot;:&quot;Tambahan apa yang paling tepat?&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Index B-tree pada mahasiswa_key di tabel fakta&quot;,&quot;tag&quot;:&quot;B-tree&quot;,&quot;k&quot;:&quot;good&quot;,&quot;fb&quot;:&quot;Tepat. Kueri mengambil sedikit baris dari banyak partisi; index langsung menunjuk baris itu.&quot;,&quot;to&quot;:&quot;end1&quot;},{&quot;t&quot;:&quot;Partisi tambahan per NIM&quot;,&quot;tag&quot;:&quot;Partisi NIM&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;fb&quot;:&quot;Ribuan partisi kecil membebani perencana kueri dan pemeliharaan; index jauh lebih sederhana.&quot;,&quot;to&quot;:&quot;end2&quot;},{&quot;t&quot;:&quot;Tidak perlu apa-apa karena tabel sudah berpartisi&quot;,&quot;tag&quot;:&quot;Tanpa index&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;fb&quot;:&quot;Partisi waktu tidak membantu kueri satu mahasiswa di semua tahun; semua partisi tetap dibaca seluruhnya.&quot;,&quot;to&quot;:&quot;end2&quot;}]},&quot;end1&quot;:{&quot;end&quot;:&quot;Partisi untuk filter waktu, index B-tree untuk mencari sedikit baris. Keduanya dipilih dari pola kueri pengguna.&quot;,&quot;title&quot;:&quot;Strategi sesuai pola kueri&quot;,&quot;k&quot;:&quot;good&quot;},&quot;end2&quot;:{&quot;end&quot;:&quot;Pilih strategi dari kueri yang benar-benar sering dijalankan. Kembali ke awal dan coba jalur lain.&quot;,&quot;title&quot;:&quot;Belum tepat&quot;,&quot;k&quot;:&quot;bad&quot;}}}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi. Formatif, tidak dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Desain fisik: tipe data, kunci dan constraint, pemuatan, index, partisi.</li><li>Kunci integer kecil menghemat ruang di setiap baris fakta dan index.</li><li>Fakta: kunci <code>NOT NULL</code> + foreign key; primary key gabungan = grain.</li><li>B-tree untuk mencari sedikit baris; bitmap untuk menggabungkan kondisi berkardinalitas rendah.</li><li>Partisi menurut tanggal agar kueri satu periode melewati partisi lain; buktikan dengan EXPLAIN ANALYZE.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;dw6-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Mengapa kunci tabel fakta sebaiknya surrogate key integer, bukan NIM varchar(10)?&quot;,&quot;o&quot;:[&quot;Lebih kecil (4 vs 11 byte) di setiap baris fakta dan index&quot;,&quot;NIM tidak boleh disimpan di data warehouse&quot;,&quot;Kolom integer tidak bisa bernilai null&quot;,&quot;Kolom varchar tidak bisa diberi index&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Selisih 7 byte per baris menjadi ±6,9 MB untuk 1.035.000 baris, belum termasuk index.&quot;},{&quot;q&quot;:&quot;Kolom mahasiswa_key di fakta_penilaian diberi NOT NULL REFERENCES dim_mahasiswa. Apa yang terjadi saat memuat baris dengan mahasiswa_key 9999 yang tidak ada di dimensi?&quot;,&quot;o&quot;:[&quot;Baris masuk dengan kunci kosong&quot;,&quot;Baris ditolak dengan galat foreign key&quot;,&quot;Baris dimensi 9999 dibuat otomatis&quot;,&quot;Baris diarahkan ke baris bawaan −1 secara otomatis&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Foreign key menolak nilai yang tidak ada di primary key tabel rujukan; pengarahan ke −1 dilakukan ETL, bukan DBMS.&quot;},{&quot;q&quot;:&quot;Primary key gabungan (mahasiswa_key, matakuliah_key, tanggal_key) di tabel fakta mencerminkan…&quot;,&quot;o&quot;:[&quot;hierarki dimensi&quot;,&quot;jenis tabel fakta&quot;,&quot;grain tabel fakta&quot;,&quot;tipe SCD&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Satu baris per mahasiswa per mata kuliah per semester; baris ganda pada grain yang sama ditolak.&quot;},{&quot;q&quot;:&quot;Bitmap Daring = 01100101 dan bitmap Mengulang = 00101011. Hasil AND-nya…&quot;,&quot;o&quot;:[&quot;01101111&quot;,&quot;00100001&quot;,&quot;00101001&quot;,&quot;01000100&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Bit 1 hanya pada posisi yang 1 di kedua bitmap: posisi 3 dan 8.&quot;},{&quot;q&quot;:&quot;Tabel fakta dipartisi per tahun menurut tanggal_key. Kueri mana yang paling diuntungkan?&quot;,&quot;o&quot;:[&quot;Jumlah nilai A pada tanggal_key 20250101–20251231&quot;,&quot;IPK satu mahasiswa di semua tahun&quot;,&quot;Jumlah seluruh baris fakta&quot;,&quot;Daftar mata kuliah prodi Sistem Informasi&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Filter rentang tanggal memungkinkan partition pruning: hanya partisi 2025 yang dibaca.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.4em\">Formatif, tidak masuk nilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Reis &amp; Housley (2022): bagian penyimpanan, partisi, dan format kolumnar. Kimball &amp; Ross (2013): bagian agregat. Bahan Pertemuan 7.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1C · Elin)</h3><ul><li>DDL skema kelompok di PostgreSQL, berjalan ulang tanpa galat.</li><li>Data contoh minimal 1.000 baris fakta (data mitra dianonimkan atau sintetis).</li><li>Minimal 3 kueri analitik dari pertanyaan Tugas 1A.</li><li>Index/partisi beralasan + bukti EXPLAIN ANALYZE.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Penilaian Praktikum. Tenggat Tugas 1C: Kamis, 5 November 2026, 23.59 WIB (penugasan Elin). Presentasi Tugas 1 di Pertemuan 7.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Physical design</span></dt><dd>Keputusan cara model disimpan di DBMS: tipe data, kunci, constraint, index, partisi. <i>(desain fisik)</i></dd></div><div><dt><span class=\"en\">DDL</span></dt><dd>Data Definition Language: perintah SQL pembuat struktur, mis. CREATE TABLE, CREATE INDEX. <i>(bahasa definisi data)</i></dd></div><div><dt><span class=\"en\">Data type</span></dt><dd>Jenis dan ukuran nilai satu kolom, mis. integer 4 byte, smallint 2 byte, date, numeric. <i>(tipe data)</i></dd></div><div><dt><span class=\"en\">Primary key</span></dt><dd>Kolom (atau gabungan kolom) yang unik dan tidak kosong untuk setiap baris tabel. <i>(kunci utama)</i></dd></div><div><dt><span class=\"en\">Foreign key</span></dt><dd>Kolom yang nilainya wajib ada di primary key tabel lain; menjaga fakta tidak menunjuk dimensi yang tidak ada. <i>(kunci asing)</i></dd></div><div><dt><span class=\"en\">Surrogate key</span></dt><dd>Kunci utama tabel dimensi berupa bilangan bulat berurutan yang dibuat data warehouse sendiri, tanpa makna bisnis. <i>(kunci pengganti)</i></dd></div><div><dt><span class=\"en\">Bulk load</span></dt><dd>Memuat banyak baris sekaligus dari berkas, mis. \\copy di psql, bukan INSERT satu per satu. <i>(pemuatan massal)</i></dd></div><div><dt><span class=\"en\">Sequential scan</span></dt><dd>Membaca seluruh baris tabel dari awal sampai akhir untuk mencari yang cocok. <i>(pemindaian berurutan)</i></dd></div><div><dt><span class=\"en\">B-tree index</span></dt><dd>Index berbentuk pohon seimbang; cepat untuk pencarian sama dengan dan rentang. Jenis bawaan PostgreSQL. <i>(index pohon-B)</i></dd></div><div><dt><span class=\"en\">Bitmap index</span></dt><dd>Satu deret bit per nilai kolom; beberapa kondisi digabung dengan operasi AND/OR bit. Cocok untuk kolom berkardinalitas rendah. <i>(index bitmap)</i></dd></div><div><dt><span class=\"en\">Query plan</span></dt><dd>Rencana langkah eksekusi kueri yang dipilih DBMS; dilihat dengan EXPLAIN (ANALYZE). <i>(rencana kueri)</i></dd></div><div><dt><span class=\"en\">Partitioning</span></dt><dd>Memecah satu tabel besar menjadi beberapa bagian fisik menurut aturan, mis. per tahun. <i>(partisi)</i></dd></div><div><dt><span class=\"en\">Partition pruning</span></dt><dd>DBMS melewati partisi yang pasti tidak memuat data yang diminta kueri. <i>(pemangkasan partisi)</i></dd></div><div><dt><span class=\"en\">Low cardinality</span></dt><dd>Kolom dengan sedikit nilai berbeda, mis. Ya/Tidak atau Reguler/Karyawan. <i>(kardinalitas rendah)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Reis, J., &amp; Housley, M. (2022). <i>Fundamentals of data engineering: Plan and build robust data systems</i>. O'Reilly Media.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Optimasi Kinerja & Presentasi Tugas 1","subtitle":"Penyimpanan kolumnar, materialized view dan agregat, DBMS untuk DW · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-2 · CPL-8</span></div><h1>Optimasi Kinerja & Presentasi Tugas 1</h1><p class=\"lead\">Penyimpanan kolumnar, materialized view dan agregat, DBMS untuk DW · presentasi Tugas 1</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengimplementasikan skema fisik data warehouse dan mengoptimalkan kinerjanya (C3–C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"ETL/ELT & Source-to- const SIMS={env(el, cfg, s){
    const T=cfg.tabs||[]; if(s.tab===undefined) s.tab=cfg.start||0;
    const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const draw=()=>{
      const t=T[s.tab];
      el.innerHTML='<div class="env-box"><div class="env-tabs" role="tablist">'+T.map((x,i)=>'<button type="button" role="tab" aria-selected="'+(i===s.tab)+'" class="wbtn'+(i===s.tab?' pri':'')+'" data-tab="'+i+'">'+x.label+'</button>').join('')+'</div>'+
        '<div class="env-p" role="tabpanel"><ol class="env-s">'+t.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>'+
        '<div class="env-c"><pre class="env-pre"><code>'+esc(t.code)+'</code></pre><button type="button" class="wbtn" data-act="cp">Salin kode</button><span class="env-msg muted" aria-live="polite"></span></div></div></div>';
    };
    draw();
    el.onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.tab!==undefined){ s.tab=+b.dataset.tab; draw(); const nb=el.querySelector('[data-tab="'+s.tab+'"]'); if(nb) nb.focus(); return; }
      if(b.dataset.act==='cp'){ const m=el.querySelector('.env-msg'), code=T[s.tab].code;
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>{m.textContent='Kode disalin.';},()=>{m.textContent='Salin gagal; blok kode lalu salin manual.';});
        else m.textContent='Salin tidak tersedia; blok kode lalu salin manual.'; }
    };
  },
dl(el, cfg, s){
    const F=cfg.files||[];
    const typ=n=>/\.csv$/.test(n)?'text/csv;charset=utf-8':'text/plain;charset=utf-8';
    el.innerHTML='<div class="dl-box">'+F.map((f,i)=>'<div class="dl-row"><div class="dl-t"><b class="dl-n">'+f.name+'</b>'+(cfg.compact?'':'<span class="dl-d">'+f.desc+'</span>')+'</div><div class="dl-b"><button type="button" class="wbtn pri" data-i="'+i+'" data-act="dl">⬇ Unduh</button><button type="button" class="wbtn" data-i="'+i+'" data-act="cp">Salin</button><button type="button" class="wbtn" data-i="'+i+'" data-act="pv">Lihat isi</button></div></div>').join('')+'<pre class="dl-pv" hidden aria-live="polite"></pre><p class="dl-msg muted" aria-live="polite"></p></div>';
    const msg=t=>{ el.querySelector('.dl-msg').textContent=t; };
    el.onclick=async e=>{
      const b=e.target.closest('button'); if(!b) return; const f=F[+b.dataset.i], act=b.dataset.act;
      if(act==='dl'){ let dd=null; try{ dd=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; }catch(x){ dd=null; }
        if(dd){ try{ await dd.save({filename:f.name,data:f.csv}); msg(f.name+' tersimpan.'); }catch(x){ msg(x&&x.code==='declined'?'Unduhan dibatalkan.':'Unduhan tidak tersedia di tampilan ini. Pakai Salin atau Lihat isi.'); } return; }
        try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([f.csv],{type:typ(f.name)})); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); msg('Mengunduh '+f.name+'. Bila tidak terunduh, pakai Salin atau Lihat isi lalu simpan sebagai '+f.name+'.'); }catch(x){ msg('Unduhan diblokir peramban. Pakai Salin atau Lihat isi.'); } }
      else if(act==='cp'){ const done=()=>msg(f.name+' disalin. Tempel ke berkas bernama '+f.name+'.'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(f.csv).then(done,()=>msg('Salin gagal. Pakai Lihat isi.')); } else msg('Salin tidak tersedia. Pakai Lihat isi.'); }
      else { const pv=el.querySelector('.dl-pv'); const same=!pv.hidden&&pv.dataset.i===String(b.dataset.i); pv.hidden=same; pv.dataset.i=b.dataset.i; if(!same){ const L=f.csv.trimEnd().split('\n'); pv.textContent=L.slice(0,9).join('\n')+(L.length>9?'\n… ('+L.length+' baris; pakai Salin untuk seluruh isi)':''); } }
    };
  }};

/* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});

  if(e.target.closest('[data-lock]')){lockNotes();return;}

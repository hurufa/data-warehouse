\" class=\"s-s\">ternormalisasi (3NF), data atomik, satu sumber kebenaran</text><line x1=\"85\" y1=\"172\" x2=\"85\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"25\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"85\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart Akademik</text><line x1=\"225\" y1=\"172\" x2=\"225\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"165\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"225\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart Keuangan</text><line x1=\"365\" y1=\"172\" x2=\"365\" y2=\"206\" class=\"s-line\" marker-end=\"url(#ar)\"/><rect x=\"305\" y=\"210\" width=\"120\" height=\"46\" rx=\"10\" class=\"s-acc\"/><text x=\"365\" y=\"238\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mart PMB</text><text x=\"225\" y=\"282\" text-anchor=\"middle\" class=\"s-s\">data mart dependen, dimensional, per departemen</text><rect x=\"475\" y=\"30\" width=\"400\" height=\"40\" rx=\"10\" class=\"s-box\"/><text x=\"675\" y=\"56\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sistem sumber</text><line x1=\"675\" y1=\"72\" x2=\"675\" y2=\"104\" class=\"s-line\" marker-end=\"url(#ar)\"/><text x=\"685\" y=\"92\" class=\"s-s\">ETL</text><rect x=\"475\" y=\"108\" width=\"400\" height=\"164\" rx=\"12\" class=\"s-dash\"/><text x=\"491\" y=\"128\" class=\"s-hd\">PRESENTATION AREA · DIMENSIONAL</text><rect x=\"495\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"550\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta KRS</text><line x1=\"550\" y1=\"188\" x2=\"550\" y2=\"214\" class=\"s-line\"/><rect x=\"615\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"670\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta Bayar</text><line x1=\"670\" y1=\"188\" x2=\"670\" y2=\"214\" class=\"s-line\"/><rect x=\"735\" y=\"140\" width=\"110\" height=\"46\" rx=\"10\" class=\"s-soft\"/><text x=\"790\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Fakta PMB</text><line x1=\"790\" y1=\"188\" x2=\"790\" y2=\"214\" class=\"s-line\"/><rect x=\"490\" y=\"214\" width=\"370\" height=\"34\" rx=\"17\" class=\"s-hl\"/><text x=\"675\" y=\"236\" text-anchor=\"middle\" class=\"s-ta\" style=\"font-size:13px\">Bus: Waktu · Mahasiswa · Prodi (conformed)</text><text x=\"675\" y=\"288\" text-anchor=\"middle\" class=\"s-s\">dibangun bertahap per proses bisnis</text></svg><figcaption>Dua arsitektur klasik, diadaptasi dari Kimball &amp; Ross (2013) dan Inmon (2005). Label kotak (akademik, KRS, PMB) adalah contoh ilustrasi.</figcaption></figure><p style=\"margin-top:.3em\"><button type=\"button\" class=\"term\" data-term=\"cif\">CIF</button> membangun gudang terpusat dulu, lalu <button type=\"button\" class=\"term\" data-term=\"data-mart\">data mart</button>; <button type=\"button\" class=\"term\" data-term=\"bus-architecture\">bus architecture</button> membangun per proses bisnis, disatukan dimensi bersama.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"data-vault\">Data Vault</button>: hub, link, satellite</h2><figure class=\"fig\"><svg viewBox=\"0 0 760 230\" style=\"max-height:12em\" role=\"img\" aria-label=\"Contoh Data Vault. Hub Mahasiswa berisi kunci bisnis NIM, Hub Mata Kuliah berisi kode mata kuliah, dan Link KRS menghubungkan keduanya. Tiap hub dan link punya satellite: satellite mahasiswa berisi nama dan alamat beserta riwayat perubahan, satellite mata kuliah berisi nama dan SKS, satellite KRS berisi nilai.\"><rect x=\"20\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-soft\"/><text x=\"115\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Hub Mahasiswa</text><text x=\"115\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">kunci bisnis: NIM</text><rect x=\"285\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-acc\"/><text x=\"380\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Link KRS</text><text x=\"380\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">NIM ↔ kode MK</text><rect x=\"550\" y=\"40\" width=\"190\" height=\"70\" rx=\"12\" class=\"s-soft\"/><text x=\"645\" y=\"68\" text-anchor=\"middle\" class=\"s-t\">Hub Mata Kuliah</text><text x=\"645\" y=\"90\" text-anchor=\"middle\" class=\"s-s\">kunci bisnis: kode MK</text><line x1=\"210\" y1=\"75\" x2=\"285\" y2=\"75\" class=\"s-line\"/><line x1=\"475\" y1=\"75\" x2=\"550\" y2=\"75\" class=\"s-line\"/><line x1=\"115\" y1=\"110\" x2=\"115\" y2=\"150\" class=\"s-dash\"/><rect x=\"20\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"115\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat Mahasiswa</text><text x=\"115\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nama, alamat + riwayat</text><line x1=\"380\" y1=\"110\" x2=\"380\" y2=\"150\" class=\"s-dash\"/><rect x=\"285\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"380\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat KRS</text><text x=\"380\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nilai, status</text><line x1=\"645\" y1=\"110\" x2=\"645\" y2=\"150\" class=\"s-dash\"/><rect x=\"550\" y=\"150\" width=\"190\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"645\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sat Mata Kuliah</text><text x=\"645\" y=\"196\" text-anchor=\"middle\" class=\"s-s\">nama, SKS + riwayat</text><text x=\"10\" y=\"24\" class=\"s-hd\">HUB = KUNCI BISNIS · LINK = HUBUNGAN · SATELLITE = ATRIBUT + RIWAYAT</text></svg><figcaption>Tiga jenis tabel Data Vault, diadaptasi dari Linstedt &amp; Olschimke (2015). Contoh akademik adalah ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>Kekuatan</b>: tahan terhadap perubahan sumber; riwayat lengkap; mudah ditambah sumber baru.</p></div><div class=\"card\"><p><b>Keterbatasan</b>: jumlah tabel banyak; sulit dikueri langsung oleh pengguna bisnis.</p></div><div class=\"card hl\"><p><b>Praktiknya</b>: di atas Data Vault tetap dibangun <b>information mart</b> dimensional untuk BI.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Perbandingan</span><span>Indikator 2</span></div><h2>Inmon, Kimball, Data Vault</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th></th><th>Inmon (CIF)</th><th>Kimball (bus)</th><th>Data Vault</th></tr></thead><tbody><tr><td><b>Arah</b></td><td>top-down, EDW dulu</td><td>bertahap per proses bisnis</td><td>bertahap per kunci bisnis</td></tr><tr><td><b>Model inti</b></td><td>ternormalisasi (3NF)</td><td>dimensional (fakta, dimensi)</td><td>hub, link, satellite</td></tr><tr><td><b>Integrasi</b></td><td>di EDW</td><td>lewat conformed dimensions</td><td>lewat kunci bisnis di hub</td></tr><tr><td><b>Kelebihan</b></td><td>satu sumber kebenaran terpusat</td><td>cepat terlihat hasilnya, mudah dipahami pengguna</td><td>tahan perubahan, jejak audit lengkap</td></tr><tr><td><b>Tantangan</b></td><td>investasi awal besar, lama</td><td>disiplin dimensi bersama</td><td>banyak tabel, perlu mart untuk BI</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Dirangkum dari Inmon (2005), Kimball &amp; Ross (2013), dan Linstedt &amp; Olschimke (2015). Baris \"Kelebihan\" dan \"Tantangan\" adalah rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur modern</span><span>Indikator 3</span></div><h2>Data warehouse, data lake, lakehouse</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 230\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Tiga generasi arsitektur. Data warehouse: data terstruktur, schema-on-write, untuk BI dan laporan. Data lake: data mentah semua format di penyimpanan murah, schema-on-read, untuk data science, dengan risiko menjadi data swamp. Lakehouse: penyimpanan data lake dengan format tabel terbuka ditambah transaksi ACID, skema, dan kinerja kueri, melayani BI dan machine learning dari satu salinan data.\"><defs><marker id=\"lv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"145\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Data Warehouse</text><text x=\"145\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">terstruktur (tabel)</text><text x=\"145\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">schema-on-write</text><text x=\"145\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ BI, laporan</text><line x1=\"282\" y1=\"105\" x2=\"308\" y2=\"105\" class=\"s-line\" marker-end=\"url(#lv)\"/><rect x=\"310\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-box\"/><text x=\"445\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Data Lake</text><text x=\"445\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">mentah, semua format</text><text x=\"445\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">schema-on-read, murah</text><text x=\"445\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ data science</text><line x1=\"582\" y1=\"105\" x2=\"608\" y2=\"105\" class=\"s-line\" marker-end=\"url(#lv)\"/><rect x=\"610\" y=\"30\" width=\"270\" height=\"150\" rx=\"14\" class=\"s-acc\"/><text x=\"745\" y=\"66\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:17px\">Lakehouse</text><text x=\"745\" y=\"100\" text-anchor=\"middle\" class=\"s-s\">lake + format tabel terbuka</text><text x=\"745\" y=\"122\" text-anchor=\"middle\" class=\"s-s\">+ ACID, skema, kinerja</text><text x=\"745\" y=\"150\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">→ BI dan ML sekaligus</text><text x=\"445\" y=\"206\" text-anchor=\"middle\" class=\"s-tw\">risiko data lake tanpa tata kelola: \"data swamp\"</text></svg><figcaption>Posisi data lake dan lakehouse, diadaptasi dari Armbrust et al. (2021) dan Serra (2024). Ketiganya masih dipakai berdampingan; lakehouse tidak otomatis menggantikan data warehouse.</figcaption></figure><p style=\"margin-top:.3em\"><button type=\"button\" class=\"term\" data-term=\"data-lake\">Data lake</button> memakai <button type=\"button\" class=\"term\" data-term=\"schema-on-read\">schema-on-read</button>; <button type=\"button\" class=\"term\" data-term=\"lakehouse\">lakehouse</button> menambahkan fitur gudang data di atasnya <span class=\"cite\">(Armbrust et al., 2021)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Arsitektur modern</span><span>Indikator 3</span></div><h2>Membaca <button type=\"button\" class=\"term\" data-term=\"modern-data-stack\">modern data stack</button></h2><div class=\"grid4\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Sumber</h3><p>aplikasi, basis data OLTP, spreadsheet, API marketplace</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Ingest &amp; transformasi</h3><p>ELT: muat dulu, ubah di gudang (mis. dengan SQL/dbt); orkestrasi terjadwal</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z\"/></svg>Penyimpanan &amp; komputasi</h3><p>cloud data warehouse atau lakehouse; komputasi terpisah dari penyimpanan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Penyajian</h3><p>semantic layer, dashboard, notebook analitik</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Alat berganti cepat; <b>prinsip</b> tidak. Reis &amp; Housley (2022) menyarankan memilih alat berdasarkan siklus hidup data dan kebutuhan, bukan tren.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Pengelompokan lapisan: definisi kerja mata kuliah ini, merujuk siklus data engineering Reis &amp; Housley (2022). Di proyek kelompok kita memakai perangkat gratis: PostgreSQL, SQL/Python atau Apache Hop, dan alat BI gratis.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kasus</span><span>Kelompok 4–5 orang · 20 menit · kasus ilustrasi</span></div><h2>Arsitektur mana yang tepat?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>A · Perguruan tinggi</h3><p>4.000 mahasiswa; SIAKAD, keuangan, PMB beda vendor; tim TI 4 orang; dashboard kelulusan untuk akreditasi dalam 6 bulan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>B · UMKM</h3><p>Produsen camilan di Sidoarjo; penjualan dari kasir, dua marketplace, dan WhatsApp (spreadsheet); satu admin.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>C · Instansi pemerintah</h3><p>Dinas perizinan kabupaten; 12 aplikasi layanan yang sering berganti versi; wajib audit dan lapor ke pusat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>D · Pesantren</h3><p>1.500 santri; data pendaftaran, syahriah, setoran hafalan, kesehatan; memantau perkembangan per angkatan.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Pilih satu kasus. Tentukan: (1) pertanyaan analitik utama, (2) pendekatan arsitektur beserta alasannya, (3) apakah perlu data lake.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>OLTP</b> mencatat transaksi (kini, ternormalisasi); <b>OLAP/DW</b> menganalisis (historis, terintegrasi, dimensional).</li><li>Data warehouse menurut Inmon: <b>subject-oriented, integrated, time-variant, nonvolatile</b>.</li><li>Kimball: empat komponen (sumber, ETL, presentation area, BI) dan tujuh tujuan DW/BI.</li><li><b>Inmon</b> top-down lewat EDW 3NF; <b>Kimball</b> bertahap lewat conformed dimensions; <b>Data Vault</b> memakai hub, link, satellite.</li><li><b>Data lake</b> menyimpan data mentah; <b>lakehouse</b> menambahkan fitur gudang data di atasnya.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Kueri analitik historis lintas sumber adalah beban OLAP; menjalankannya di OLTP memperlambat transaksi.\"><p class=\"q\">Kueri \"rata-rata IPK per prodi per angkatan, lima tahun\" paling tepat dijalankan di…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. SIAKAD saat masa KRS</button><button type=\"button\" data-o=\"b\">B. data warehouse</button><button type=\"button\" data-o=\"c\">C. spreadsheet prodi</button><button type=\"button\" data-o=\"d\">D. log server</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Nonvolatile menurut Inmon.\"><p class=\"q\">Data di gudang hanya dimuat berkala lalu dibaca, tidak diubah transaksi harian. Ini ciri…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. subject-oriented</button><button type=\"button\" data-o=\"b\">B. integrated</button><button type=\"button\" data-o=\"c\">C. time-variant</button><button type=\"button\" data-o=\"d\">D. nonvolatile</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Data Vault (Linstedt & Olschimke, 2015).\"><p class=\"q\">Pendekatan yang memakai tabel hub, link, dan satellite adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Kimball bus</button><button type=\"button\" data-o=\"b\">B. Inmon CIF</button><button type=\"button\" data-o=\"c\">C. Data Vault</button><button type=\"button\" data-o=\"d\">D. Data lake</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 1 Kimball &amp; Ross (2013), <i>The Data Warehouse Toolkit</i>, tentang tujuan DW/BI dan arsitekturnya. Pengayaan: bab tentang arsitektur dalam Serra (2024).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Membandingkan dua arsitektur</h3><p>Pilih <b>satu kasus</b> (boleh dari diskusi tadi atau organisasi yang Anda kenal). Bandingkan dua arsitektur (mis. Inmon vs Kimball) dalam 400–500 kata, bahasa Indonesia, disertai sketsa diagram sederhana. Akhiri dengan rekomendasi dan alasannya.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan <b>kasus proyek kelompok</b> dan sumber datanya. Kelompok dan kasus dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Data warehouse</span></dt><dd>Kumpulan data terintegrasi dari berbagai sistem, disimpan beserta riwayatnya, untuk analisis dan keputusan. <i>(gudang data)</i></dd></div><div><dt><span class=\"en\">OLTP</span></dt><dd>Online Transaction Processing: sistem pencatat transaksi harian, mis. SIAKAD atau kasir. <i>(pemrosesan transaksi daring)</i></dd></div><div><dt><span class=\"en\">OLAP</span></dt><dd>Online Analytical Processing: analisis data dalam jumlah besar dari berbagai sudut pandang (waktu, wilayah, produk). <i>(pemrosesan analitik daring)</i></dd></div><div><dt><span class=\"en\">Business intelligence (BI)</span></dt><dd>Proses, teknologi, dan aplikasi yang mengubah data menjadi informasi untuk keputusan. <i>(kecerdasan bisnis)</i></dd></div><div><dt><span class=\"en\">ETL</span></dt><dd>Extract, Transform, Load: mengambil data dari sumber, membersihkan dan mengubahnya, lalu memuatnya ke gudang. <i>(ekstraksi, transformasi, pemuatan)</i></dd></div><div><dt><span class=\"en\">Presentation area</span></dt><dd>Bagian DW menurut Kimball berisi data dimensional yang dikueri pengguna dan aplikasi BI. <i>(area presentasi)</i></dd></div><div><dt><span class=\"en\">Data mart</span></dt><dd>Bagian data warehouse untuk satu area bisnis atau departemen. <i>(gudang data subjek / departemen)</i></dd></div><div><dt><span class=\"en\">Corporate Information Factory (CIF)</span></dt><dd>Arsitektur Inmon: sumber → EDW ternormalisasi → data mart. <i>(arsitektur pabrik informasi korporat)</i></dd></div><div><dt><span class=\"en\">Bus architecture</span></dt><dd>Arsitektur Kimball: dibangun per proses bisnis, disatukan dimensi bersama (conformed). <i>(arsitektur bus)</i></dd></div><div><dt><span class=\"en\">Data Vault</span></dt><dd>Pendekatan Linstedt: kunci bisnis (hub), hubungan (link), atribut dan riwayatnya (satellite). <i>(Data Vault)</i></dd></div><div><dt><span class=\"en\">Data lake</span></dt><dd>Penyimpanan data mentah berbagai format; skema ditentukan saat dibaca. <i>(danau data)</i></dd></div><div><dt><span class=\"en\">Lakehouse</span></dt><dd>Fitur data warehouse (ACID, skema, kinerja) di atas penyimpanan data lake berformat terbuka. <i>(lakehouse)</i></dd></div><div><dt><span class=\"en\">Modern data stack</span></dt><dd>Rangkaian layanan cloud: ingest, cloud DW, transformasi (mis. dbt), dan BI. <i>(tumpukan data modern)</i></dd></div><div><dt><span class=\"en\">Schema-on-read</span></dt><dd>Struktur data ditentukan saat dibaca, bukan saat disimpan (lawan: schema-on-write). <i>(skema saat dibaca)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Armbrust, M., Ghodsi, A., Xin, R., &amp; Zaharia, M. (2021). Lakehouse: A new generation of open platforms that unify data warehousing and advanced analytics. Dalam <i>Proceedings of the 11th Conference on Innovative Data Systems Research (CIDR 2021)</i>.</li><li>Inmon, W. H. (2005). <i>Building the data warehouse</i> (4th ed.). Wiley.</li><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Linstedt, D., &amp; Olschimke, M. (2015). <i>Building a scalable data warehouse with Data Vault 2.0</i>. Morgan Kaufmann.</li><li>Reis, J., &amp; Housley, M. (2022). <i>Fundamentals of data engineering: Plan and build robust data systems</i>. O'Reilly Media.</li><li>Serra, J. (2024). <i>Deciphering data architectures: Choosing between a modern data warehouse, data fabric, data lakehouse, and data mesh</i>. O'Reilly Media.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Kebutuhan Bisnis & Desain Dimensional","subtitle":"Proses desain empat langkah, wawancara kebutuhan dan KPI, proses bisnis dan grain","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Data Warehouse · SII047</span></div><h1>Kebutuhan Bisnis &amp; Desain Dimensional</h1><p class=\"lead\">Proses desain empat langkah, wawancara kebutuhan dan KPI, proses bisnis dan grain</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih kasus</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengevaluasi kebutuhan bisnis dan menyusun bus matrix serta grain proses bisnis (C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 3)</span></h3><ol><li>Ketepatan mengidentifikasi proses bisnis dan pertanyaan analitik.</li><li>Ketepatan menentukan grain setiap proses bisnis.</li><li>Kelengkapan enterprise bus matrix dan dimensi terkonformasi. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan menilai ketersediaan data sumber. <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Sebutkan dua perbedaan utama OLTP dan OLAP.</li><li>Apa empat komponen arsitektur DW/BI menurut Kimball?</li><li>Dalam bus architecture, apa yang menyatukan data dari berbagai proses bisnis?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Mulai dari kebutuhan</span></div><h2>Mengapa mulai dari kebutuhan bisnis?</h2><div class=\"cols w\"><div><div class=\"grid3\" style=\"grid-template-columns:1fr\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Mulai dari data</h3><p>\"Semua tabel SIAKAD kita salin ke gudang, nanti pasti berguna.\" Hasilnya: gudang besar yang tidak menjawab pertanyaan siapa pun.</p></div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Mulai dari kebutuhan</h3><p>\"Pimpinan perlu memantau kelulusan tepat waktu per prodi.\" Data yang dimuat adalah data yang menjawab pertanyaan itu.</p></div></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Kimball Lifecycle</h3><p><b>Business requirements definition</b> adalah titik awal. Dari sana tiga jalur berjalan paralel: <b>teknologi</b>, <b>data</b> (pemodelan, desain fisik, ETL), dan <b>aplikasi BI</b>.</p><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Kimball et al., 2008)</span></p></div></div><p style=\"margin-top:.7em\">Rancangan yang baik mempertemukan <button type=\"button\" class=\"term\" data-term=\"business-requirements\">kebutuhan bisnis</button> dengan <b>realitas data</b> yang tersedia <span class=\"cite\">(Kimball &amp; Ross, 2013)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses desain</span><span>Indikator 1–2</span></div><h2>Empat langkah <button type=\"button\" class=\"term\" data-term=\"dimensional-modeling\">desain dimensional</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 230\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Proses desain dimensional empat langkah menurut Kimball dan Ross. Masukan: kebutuhan bisnis dan realitas data. Langkah 1 select the business process, langkah 2 declare the grain, langkah 3 identify the dimensions, langkah 4 identify the facts. Langkah 1 dan 2 dibahas hari ini, langkah 3 dan 4 di Pertemuan 4 sampai 5.\"><defs><marker id=\"fs\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"170\" height=\"60\" rx=\"12\" class=\"s-acc\"/><text x=\"95\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Kebutuhan bisnis</text><text x=\"95\" y=\"77\" text-anchor=\"middle\" class=\"s-s\">business requirements</text><rect x=\"10\" y=\"110\" width=\"170\" height=\"60\" rx=\"12\" class=\"s-box\"/><text x=\"95\" y=\"137\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Realitas data</text><text x=\"95\" y=\"157\" text-anchor=\"middle\" class=\"s-s\">data realities</text><path d=\"M182 60 L206 60 L206 100 L222 100\" class=\"s-line\" style=\"fill:none\" marker-end=\"url(#fs)\"/><path d=\"M182 140 L206 140 L206 100\" class=\"s-line\" style=\"fill:none\"/><rect x=\"226\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-soft\"/><text x=\"301\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"301\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Select the</text><text x=\"301\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">business process</text><text x=\"301\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">pilih proses bisnis</text><line x1=\"377\" y1=\"100\" x2=\"392\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"394\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-soft\"/><text x=\"469\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"469\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Declare</text><text x=\"469\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the grain</text><text x=\"469\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">nyatakan grain</text><line x1=\"545\" y1=\"100\" x2=\"560\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"562\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-box\"/><text x=\"637\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"637\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Identify</text><text x=\"637\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the dimensions</text><text x=\"637\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">tentukan dimensi</text><line x1=\"713\" y1=\"100\" x2=\"728\" y2=\"100\" class=\"s-line\" marker-end=\"url(#fs)\"/><rect x=\"730\" y=\"40\" width=\"150\" height=\"120\" rx=\"12\" class=\"s-box\"/><text x=\"805\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"805\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Identify</text><text x=\"805\" y=\"114\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">the facts</text><text x=\"805\" y=\"142\" text-anchor=\"middle\" class=\"s-s\">tentukan fakta</text><path d=\"M226 170 v12 h318 v-12\" class=\"s-dash\"/><text x=\"385\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">hari ini (Pertemuan 2–3)</text><path d=\"M562 170 v12 h318 v-12\" class=\"s-dash\"/><text x=\"721\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">Pertemuan 4–5</text></svg><figcaption>Proses desain dimensional empat langkah, diadaptasi dari Kimball &amp; Ross (2013). Nama langkah ditulis sesuai sumber.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Menggali kebutuhan</span><span>Indikator 1</span></div><h2>Wawancara dan lokakarya kebutuhan</h2><div class=\"cols\"><div><h3>Siapa yang ditanya?</h3><ul><li><b>Pimpinan</b>: keputusan strategis dan target (rektor, kepala dinas, pemilik usaha).</li><li><b>Analis/pengguna laporan</b>: laporan yang sekarang dibuat manual.</li><li><b>Pemilik sistem sumber</b>: data apa yang ada, seberapa lengkap.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Semua adalah <button type=\"button\" class=\"term\" data-term=\"stakeholder\">stakeholder</button>. Pisahkan sesi pengguna bisnis dan sesi teknis.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Pertanyaan pemandu</h3><ol><li>Apa tanggung jawab dan target Anda?</li><li>Bagaimana Anda tahu kinerja sedang baik atau buruk?</li><li>Keputusan apa yang sering Anda ambil, dan data apa yang Anda perlukan?</li><li>Analisis apa yang ingin dilakukan tetapi sekarang sulit?</li><li>Laporan apa yang sekarang dibuat manual?</li></ol></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Diadaptasi dari Kimball et al. (2008). Tanyakan <b>apa yang dikerjakan</b> pengguna, bukan \"data apa yang Anda mau\".</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari kebutuhan ke rancangan</span><span>Indikator 1 · kasus ilustrasi</span></div><h2>Pertanyaan analitik → <button type=\"button\" class=\"term\" data-term=\"kpi\">KPI</button> → fakta &amp; dimensi</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Pertanyaan analitik</th><th>KPI</th><th>Diukur dari (<button type=\"button\" class=\"term\" data-term=\"fact\">fakta</button>)</th><th>Dilihat per (<button type=\"button\" class=\"term\" data-term=\"dimension\">dimensi</button>)</th></tr></thead><tbody><tr><td>Berapa persen mahasiswa lulus tepat waktu per prodi per angkatan?</td><td>tingkat kelulusan tepat waktu</td><td>jumlah lulus ≤ 8 semester, jumlah mahasiswa angkatan</td><td>prodi, angkatan, jalur masuk</td></tr><tr><td>Prodi mana yang tunggakan UKT-nya naik tiap semester?</td><td>rasio tunggakan</td><td>nominal tagihan, nominal bayar</td><td>prodi, semester, jalur masuk</td></tr><tr><td>Produk apa yang paling laku di tiap kanal penjualan?</td><td>omzet per kanal</td><td>jumlah terjual, nilai penjualan</td><td>produk, kanal, tanggal</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.7em\">Tips: kata sesudah <b>\"per\"</b>, <b>\"menurut\"</b>, atau <b>\"berdasarkan\"</b> biasanya dimensi; angka yang dijumlah atau dirata-rata biasanya fakta.</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi. Tips \"per/menurut\" adalah definisi kerja mata kuliah ini.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Langkah 1</span><span>Indikator 1</span></div><h2>Memilih <button type=\"button\" class=\"term\" data-term=\"business-process\">proses bisnis</button></h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Business processes are the operational activities performed by your organization, such as taking an order, processing an insurance claim, <b>registering students for a class</b>, or snapshotting every account each month.\"</p><p class=\"tr\">\"Proses-proses bisnis adalah kegiatan-kegiatan operasional yang dilakukan oleh organisasi Anda, seperti menerima sebuah pesanan, memproses sebuah klaim asuransi, <b>mendaftarkan mahasiswa untuk sebuah kelas</b>, atau membuat snapshot setiap rekening setiap bulan.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.7em\"><li>Biasanya berupa <b>kata kerja</b>: mendaftar, membayar, menilai, menjual, melayani.</li><li>Punya <b>sistem sumber</b> yang mencatatnya.</li><li>Satu proses bisnis ≈ satu (atau beberapa) tabel fakta.</li></ul></div><div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Proses bisnis</h3><p>pendaftaran PMB · registrasi KRS · pembayaran UKT · penilaian · yudisium</p></div><div class=\"card warn\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Bukan proses bisnis</h3><p>\"Bagian Keuangan\" (unit) · \"Laporan Akreditasi\" (keluaran) · \"Data Mahasiswa\" (subjek/dimensi)</p></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Langkah 2</span><span>Indikator 2</span></div><h2>Menyatakan <button type=\"button\" class=\"term\" data-term=\"grain\">grain</button></h2><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Declaring the grain means specifying exactly what an individual fact table row represents.\"</p><p class=\"tr\">\"Menyatakan grain berarti menetapkan secara tepat apa yang diwakili oleh sebuah baris tabel fakta individual.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote><figure class=\"fig\"><svg viewBox=\"0 0 880 210\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Tiga tingkat grain data penjualan UMKM. Paling kiri, grain atomik: satu baris per item produk per struk, sekitar 30 ribu baris per bulan. Tengah: satu baris per produk per hari, sekitar 1.800 baris. Kanan: satu baris per kategori per bulan, sekitar 12 baris. Data dapat diringkas dari kiri ke kanan, tetapi ringkasan tidak dapat dirinci kembali ke kiri. Angka adalah data ilustrasi.\"><defs><marker id=\"gr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><defs><marker id=\"grw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"var(--warn)\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-acc\"/><text x=\"140\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">ATOMIK</text><text x=\"140\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per item per struk</text><text x=\"140\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 30.000 baris/bulan</text><rect x=\"310\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-soft\"/><text x=\"440\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">RINGKASAN</text><text x=\"440\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per produk per hari</text><text x=\"440\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 1.800 baris/bulan</text><rect x=\"610\" y=\"30\" width=\"260\" height=\"96\" rx=\"14\" class=\"s-box\"/><text x=\"740\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">RINGKASAN</text><text x=\"740\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">per kategori per bulan</text><text x=\"740\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">± 12 baris/bulan</text><line x1=\"272\" y1=\"64\" x2=\"306\" y2=\"64\" class=\"s-line\" marker-end=\"url(#gr)\"/><line x1=\"572\" y1=\"64\" x2=\"606\" y2=\"64\" class=\"s-line\" marker-end=\"url(#gr)\"/><path d=\"M740 130 C740 186 140 186 140 132\" class=\"s-warnline\" style=\"fill:none;stroke-dasharray:7 6\" marker-end=\"url(#grw)\"/><text x=\"440\" y=\"160\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">roll-up (diringkas) selalu bisa →</text><text x=\"440\" y=\"200\" text-anchor=\"middle\" class=\"s-tw\">← ringkasan tidak bisa dirinci kembali (drill-down ke detail yang tidak disimpan)</text></svg><figcaption>Mengapa grain atomik dianjurkan, diadaptasi dari Kimball &amp; Ross (2013). Jumlah baris adalah data ilustrasi UMKM kasir.</figcaption></figure><p style=\"margin-top:.3em\">Utamakan <button type=\"button\" class=\"term\" data-term=\"atomic-grain\">grain atomik</button>: paling rinci, paling fleksibel untuk pertanyaan yang belum terpikirkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 10 menit · kasus ilustrasi</span></div><h2>Tentukan proses bisnis dan grain-nya</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>UMKM kasir</h3><p>Toko oleh-oleh memakai aplikasi kasir. Pemilik ingin tahu produk terlaris per jam dan per hari.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Kelurahan</h3><p>Warga mengajukan surat pengantar (domisili, SKTM, usaha). Lurah ingin memantau lama layanan per jenis surat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pesantren</h3><p>Santri menyetor hafalan kepada ustaz setiap hari. Pengasuh ingin memantau kemajuan per kelas dan per ustaz.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Tulis: (1) nama proses bisnis (kata kerja), (2) kalimat grain \"satu baris per …\", (3) satu pertanyaan yang <b>tidak</b> bisa dijawab bila grain-nya diringkas.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh utuh</span><span>Kasus ilustrasi · indikator 1–2</span></div><h2>PMB kampus: dari pertanyaan ke grain</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Tahap</th><th>Hasil</th></tr></thead><tbody><tr><td><b>Kebutuhan</b></td><td>Wakil rektor ingin tahu jalur promosi dan sekolah asal mana yang paling banyak menghasilkan mahasiswa yang benar-benar daftar ulang.</td></tr><tr><td><b>Pertanyaan analitik</b></td><td>Berapa rasio pendaftar yang daftar ulang per jalur, per sumber informasi, per asal kabupaten, per gelombang?</td></tr><tr><td><b>KPI</b></td><td>rasio konversi pendaftar → daftar ulang</td></tr><tr><td><b>Proses bisnis</b></td><td>pendaftaran mahasiswa baru (PMB)</td></tr><tr><td><b>Grain</b></td><td>satu baris per pendaftar per gelombang, diperbarui saat tahapannya berubah (daftar, tes, lulus, daftar ulang)</td></tr><tr><td><b>Calon dimensi &amp; fakta</b></td><td class=\"muted\">jalur, sumber informasi, sekolah asal, wilayah, gelombang, tanggal · status tiap tahap, jumlah hari antartahap <i>(dirinci di Pertemuan 4–5)</i></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hati-hati</span><span>Indikator 1–2</span></div><h2>Kesalahan umum dalam tahap kebutuhan</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Mulai dari tabel</h3><p>Menyalin struktur SIAKAD lalu mencari-cari kegunaannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Per departemen</h3><p>Membuat model per unit, bukan per proses bisnis.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Grain campur</h3><p>Baris harian dan bulanan dalam satu tabel fakta.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 3H2l8 9.46V19l4 2v-8.54L22 3z\"/></svg>Grain terlalu ringkas</h3><p>Hanya menyimpan rekap bulanan sehingga pertanyaan baru tidak terjawab.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>KPI tanpa definisi</h3><p>\"Tepat waktu\" atau \"aktif\" belum disepakati artinya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Satu narasumber</h3><p>Hanya bertanya ke tim TI; pengguna bisnis tidak didengar.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen berdasarkan prinsip Kimball &amp; Ross (2013) dan Kimball et al. (2008).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih kasus</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 3–4 orang. Tetapkan peran awal:</p><ul><li>Koordinator dan penghubung mitra</li><li>Analis kebutuhan (wawancara, KPI)</li><li>Pemodel data</li><li>Penanggung jawab data dan dokumentasi</li></ul><p class=\"muted\">Peran boleh bergilir; semua anggota tetap harus menguasai seluruh tahap.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria kasus yang baik</h3><ul><li>Organisasi nyata: perguruan tinggi, UMKM, instansi pemerintah, atau pesantren/lembaga NU.</li><li>Punya <b>minimal dua proses bisnis</b> yang tercatat.</li><li>Ada <b>data sampel</b> (ekspor, spreadsheet, atau basis data) yang boleh dipakai dengan izin.</li><li>Ada narahubung yang bersedia diwawancarai.</li><li>Data pribadi <b>dianonimkan</b> sebelum dipakai <span class=\"cite\">(UU No. 27 Tahun 2022)</span>.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Rancangan data warehouse kelompok</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>P2–3 · 10%</h3><p>Dokumen kebutuhan (pertanyaan analitik, KPI, proses bisnis, grain) dan enterprise bus matrix.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>P4–5 · 10%</h3><p>Model dimensional: tabel fakta, dimensi, hierarki, surrogate key, dan SCD.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>P6–7 · 10%</h3><p>Skema fisik yang diimplementasikan di DBMS, laporan, dan presentasi di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai kasus yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Desain data warehouse dimulai dari <b>kebutuhan bisnis</b>, dipertemukan dengan <b>realitas data</b>.</li><li>Empat langkah Kimball: <b>proses bisnis → grain → dimensi → fakta</b>.</li><li>Kebutuhan digali lewat wawancara stakeholder, lalu dirumuskan menjadi <b>pertanyaan analitik dan KPI</b> yang terdefinisi.</li><li><b>Proses bisnis</b> adalah kegiatan (kata kerja), bukan unit atau laporan.</li><li><b>Grain</b> = arti satu baris tabel fakta; utamakan grain <b>atomik</b> dan jangan mencampur grain.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Urutannya: proses bisnis, grain, dimensi, fakta. Grain dinyatakan sebelum dimensi dan fakta.\"><p class=\"q\">Dalam proses desain dimensional Kimball &amp; Ross (2013), langkah kedua adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. identify the facts</button><button type=\"button\" data-o=\"b\">B. declare the grain</button><button type=\"button\" data-o=\"c\">C. identify the dimensions</button><button type=\"button\" data-o=\"d\">D. build the ETL</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Proses bisnis adalah kegiatan yang menghasilkan ukuran kinerja; unit, laporan, dan subjek bukan proses bisnis.\"><p class=\"q\">Manakah yang merupakan proses bisnis?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Bagian Keuangan</button><button type=\"button\" data-o=\"b\">B. Laporan Akreditasi</button><button type=\"button\" data-o=\"c\">C. Pembayaran UKT</button><button type=\"button\" data-o=\"d\">D. Data Mahasiswa</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Item per struk adalah detail terendah yang dicatat; bisa diringkas ke tingkat mana pun.\"><p class=\"q\">Grain paling atomik untuk penjualan di aplikasi kasir UMKM adalah satu baris per…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. kategori per bulan</button><button type=\"button\" data-o=\"b\">B. produk per hari</button><button type=\"button\" data-o=\"c\">C. struk (total belanja)</button><button type=\"button\" data-o=\"d\">D. item produk per struk</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 2 Kimball &amp; Ross (2013) tentang teknik dimensional modeling (bagian proses desain empat langkah) dan bagian enterprise bus matrix sebagai persiapan Pertemuan 3.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan kasus, narahubung, dan izin pemakaian data.</li><li>Wawancarai minimal satu pengguna bisnis dan satu pemegang data.</li><li>Susun draf dokumen kebutuhan: profil organisasi, 5 pertanyaan analitik, KPI beserta definisinya, daftar proses bisnis, dan kalimat grain tiap proses.</li><li>Daftar sistem sumber dan contoh data (sudah dianonimkan).</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf dan contoh data ke Pertemuan 3 untuk disusun menjadi bus matrix.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Dimensional modeling</span></dt><dd>Teknik merancang basis data analitik dalam bentuk tabel fakta (ukuran) dan tabel dimensi (konteks) agar mudah dipahami dan cepat dikueri. <i>(pemodelan dimensional)</i></dd></div><div><dt><span class=\"en\">Business requirements</span></dt><dd>Kebutuhan informasi pengguna bisnis: keputusan apa yang diambil, pertanyaan apa yang harus dijawab, dan ukuran apa yang dipakai. <i>(kebutuhan bisnis)</i></dd></div><div><dt><span class=\"en\">Business process</span></dt><dd>Kegiatan operasional organisasi yang menghasilkan atau mencatat ukuran kinerja, mis. registrasi KRS atau pembayaran UKT. <i>(proses bisnis)</i></dd></div><div><dt><span class=\"en\">Grain</span></dt><dd>Pernyataan tentang apa yang diwakili oleh satu baris tabel fakta. <i>(butir / tingkat kerincian)</i></dd></div><div><dt><span class=\"en\">Atomic grain</span></dt><dd>Tingkat kerincian paling rendah yang dicatat oleh proses bisnis; tidak dapat dipecah lagi. <i>(kerincian atomik)</i></dd></div><div><dt><span class=\"en\">Fact</span></dt><dd>Ukuran numerik hasil proses bisnis, mis. jumlah SKS, nominal bayar, atau jumlah pendaftar. <i>(fakta / ukuran)</i></dd></div><div><dt><span class=\"en\">Dimension</span></dt><dd>Konteks deskriptif sebuah fakta: siapa, apa, di mana, kapan, mengapa, dan bagaimana. <i>(dimensi)</i></dd></div><div><dt><span class=\"en\">Fact table</span></dt><dd>Tabel yang menyimpan ukuran-ukuran sebuah proses bisnis pada grain tertentu, beserta kunci ke tabel dimensi. <i>(tabel fakta)</i></dd></div><div><dt><span class=\"en\">Dimension table</span></dt><dd>Tabel yang menyimpan atribut deskriptif, mis. nama prodi, fakultas, atau kategori produk, untuk menyaring dan mengelompokkan fakta. <i>(tabel dimensi)</i></dd></div><div><dt><span class=\"en\">KPI</span></dt><dd>Key Performance Indicator: ukuran kinerja utama yang dipantau untuk menilai tercapainya tujuan. <i>(indikator kinerja utama)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang atau kelompok yang berkepentingan terhadap sistem, mis. pimpinan, analis, operator sistem sumber. <i>(pemangku kepentingan)</i></dd></div><div><dt><span class=\"en\">Enterprise bus matrix</span></dt><dd>Matriks proses bisnis (baris) terhadap dimensi (kolom) yang menjadi peta rencana data warehouse. <i>(matriks bus)</i></dd></div><div><dt><span class=\"en\">Conformed dimension</span></dt><dd>Dimensi yang dipakai bersama oleh beberapa tabel fakta dengan isi dan arti yang sama, sehingga hasil analisis bisa digabung. <i>(dimensi terkonformasi / seragam)</i></dd></div><div><dt><span class=\"en\">Data profiling</span></dt><dd>Pemeriksaan isi data sumber: jumlah baris, nilai kosong, nilai unik, pola, dan anomali. <i>(profil data)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Kimball, R., &amp; Ross, M. (2013). <i>The data warehouse toolkit: The definitive guide to dimensional modeling</i> (3rd ed.). John Wiley &amp; Sons.</li><li>Kimball, R., Ross, M., Thornthwaite, W., Mundy, J., &amp; Becker, B. (2008). <i>The data warehouse lifecycle toolkit</i> (2nd ed.). Wiley.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Enterprise Bus Matrix &amp; Data Sumber","subtitle":"Enterprise bus matrix, conformed dimension, profiling awal data sumber","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Data Warehouse · SII047</span></div><h1>Enterprise Bus Matrix &amp; Data Sumber</h1><p class=\"lead\">Enterprise bus matrix, conformed dimension, profiling awal data sumber</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + studi kasus + bus matrix kelompok</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengevaluasi kebutuhan bisnis dan menyusun bus matrix serta grain proses bisnis (C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan mengidentifikasi proses bisnis dan pertanyaan analitik. <span class=\"muted\">(Pertemuan 2)</span></li><li>Ketepatan menentukan grain setiap proses bisnis. <span class=\"muted\">(Pertemuan 2)</span></li><li>Kelengkapan enterprise bus matrix dan dimensi terkonformasi.</li><li>Ketepatan menilai ketersediaan data sumber.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu merancang arsitektur dan model dimensional data warehouse yang mendukung kecerdasan bisnis.</dd><dt>CPL-5</dt><dd class=\"id\">Menguasai konsep teoritis dalam mendesain dan mensimulasikan aplikasi multi-platform serta sistem berbasis data yang mendukung kecerdasan bisnis dan kebutuhan industri kreatif.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan empat langkah desain dimensional Kimball secara berurutan.</li><li>Apa arti grain, dan mengapa grain atomik dianjurkan?</li><li>\"Bagian Keuangan\" bukan proses bisnis. Mengapa?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Kasus dan izin data sudah pasti?</li><li>Daftar proses bisnis dan kalimat grain sudah ada?</li><li>Contoh data sumber (sudah dianonimkan) dibawa?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Kasus ilustrasi</span></div><h2>Dua laporan, dua angka</h2><div class=\"cols w\"><div><p class=\"lead\">Rapat pimpinan kampus. Dua laporan tentang Prodi Sistem Informasi semester ganjil:</p><div class=\"grid3\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>BAAK</h3><p><b>412</b> mahasiswa aktif (mengisi KRS).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Keuangan</h3><p><b>389</b> mahasiswa aktif (sudah membayar UKT).</p></div></div><p style=\"margin-top:.7em\">Di sistem keuangan kodenya \"S1-SI\", di SIAKAD \"SI\". Tidak ada yang bisa menjawab berapa mahasiswa yang mengisi KRS tetapi belum membayar.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Diskusikan berpasangan</h3><ol><li>Mengapa angkanya berbeda?</li><li>Apa yang harus <b>disepakati</b> agar kedua data bisa digabung?</li></ol></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi; angka adalah data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Apa itu enterprise bus matrix?</h2><div class=\"cols w\"><div><div class=\"callout\"><button type=\"button\" class=\"term\" data-term=\"bus-matrix\">Enterprise bus matrix</button>: matriks dengan <b>baris</b> berupa proses bisnis dan <b>kolom</b> berupa dimensi bersama. Tanda pada sel menunjukkan dimensi yang terkait dengan proses itu. <span class=\"muted\" style=\"font-size:.85em\">(diadaptasi dari Kimball &amp; Ross, 2013)</span></div><ul style=\"margin-top:.8em\"><li>Menjadi peta perencanaan <button type=\"button\" class=\"term\" data-term=\"bus-architecture\">bus architecture</button>.</li><li>Alat komunikasi dengan pimpinan dan tim TI dalam satu halaman.</li><li>Dasar menentukan urutan proses yang dibangun.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Cara membaca</h3><ul><li><b>Satu baris</b>: satu <button type=\"button\" class=\"term\" data-term=\"business-process\">proses bisnis</button> (calon tabel fakta).</li><li><b>Satu kolom</b>: satu dimensi yang mungkin dipakai bersama.</li><li><b>Kolom penuh tanda</b>: dimensi paling penting untuk dikonformasi.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · indikator 3</span></div><h2>Bus matrix sebuah kampus</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em;text-align:center\"><thead><tr><th style=\"text-align:left\">Proses bisnis</th><th>Tanggal</th><th>Semester</th><th>Mahasiswa</th><th>Prodi</th><th>Mata kuliah</th><th>Dosen</th><th>Jalur masuk</th><th>Sekolah asal</th></tr></thead><tbody><tr><td style=\"text-align:left\"><b>Pendaftaran mahasiswa baru (PMB)</b></td><td>●</td><td>●</td><td></td><td>●</td><td></td><td></td><td>●</td><td>●</td></tr><tr><td style=\"text-align:left\"><b>Registrasi KRS</b></td><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td></td><td></td></tr><tr><td style=\"text-align:left\"><b>Penilaian</b></td><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td></td><td></td></tr><tr><td style=\"text-align:left\"><b>Pembayaran UKT</b></td><td>●</td><td>●</td><td>●</td><td>●</td><td></td><td></td><td>●</td><td></td></tr><tr><td style=\"text-align:left\"><b>Kelulusan (yudisium)</b></td><td>●</td><td>●</td><td>●</td><td>●</td><td></td><td></td><td>●</td><td>●</td></tr><tr><td style=\"text-align:left\" class=\"muted\">Jumlah proses</td><td>5</td><td>5</td><td>4</td><td>5</td><td>2</td><td>2</td><td>3</td><td>2</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi. Pola matriks mengikuti Kimball &amp; Ross (2013).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Langkah</span><span>Indikator 3</span></div><h2>Menyusun bus matrix kasus Anda</h2><div class=\"cols w\"><div><ol><li><b>Baris</b>: tulis semua proses bisnis dari dokumen kebutuhan (kata kerja, bukan unit).</li><li><b>Kolom</b>: daftar calon dimensi dari pertanyaan analitik (kata sesudah \"per\", \"menurut\").</li><li><b>Sel</b>: beri tanda bila dimensi itu menjadi konteks proses pada grain-nya.</li><li><b>Hitung</b>: kolom dengan banyak tanda adalah calon dimensi terkonformasi.</li><li><b>Sepakati</b>: nama, kode, dan arti tiap dimensi bersama pemilik data.</li></ol><p class=\"muted\" style=\"font-size:.82em\">Definisi kerja mata kuliah ini, merujuk Kimball &amp; Ross (2013).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Uji cepat</h3><ul><li>Setiap baris punya kalimat grain?</li><li>Setiap kolom bisa dijelaskan dalam satu kalimat?</li><li>Tidak ada dua kolom yang sebenarnya sama (mis. \"Mhs\" dan \"Student\")?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"conformed-dimension\">Conformed dimension</button></h2><div style=\"font-size:.86em\"><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Dimension tables conform when attributes in separate dimension tables have the same column names and domain contents.\"</p><p class=\"tr\">\"Tabel-tabel dimensi terkonformasi ketika atribut-atribut di dalam tabel-tabel dimensi yang terpisah memiliki nama-nama kolom dan isi-isi domain yang sama.\"</p><div class=\"src\">Kimball &amp; Ross (2013); terjemahan harfiah penyusun</div></blockquote></div><figure class=\"fig\"><svg viewBox=\"0 0 900 250\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Dua tabel fakta, Fakta KRS di kiri dan Fakta Pembayaran UKT di kanan, sama-sama terhubung ke tiga dimensi terkonformasi di tengah: Tanggal, Mahasiswa, dan Prodi. Fakta KRS juga punya dimensi Mata Kuliah sendiri, Fakta Pembayaran punya dimensi Jenis Tagihan sendiri. Karena Prodi sama, hasil kedua fakta dapat digabung per prodi (drill across).\"><rect x=\"20\" y=\"95\" width=\"190\" height=\"60\" rx=\"6\" class=\"s-soft\"/><text x=\"115\" y=\"121\" text-anchor=\"middle\" class=\"s-t\">Fakta KRS</text><text x=\"115\" y=\"141\" text-anchor=\"middle\" class=\"s-s\">jumlah SKS diambil</text><rect x=\"690\" y=\"95\" width=\"190\" height=\"60\" rx=\"6\" class=\"s-soft\"/><text x=\"785\" y=\"121\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Fakta Pembayaran UKT</text><text x=\"785\" y=\"141\" text-anchor=\"middle\" class=\"s-s\">tagihan, dibayar</text><rect x=\"20\" y=\"190\" width=\"190\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"115\" y=\"215\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Dim Mata Kuliah</text><line x1=\"115\" y1=\"155\" x2=\"115\" y2=\"190\" class=\"s-line\"/><rect x=\"690\" y=\"190\" width=\"190\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"785\" y=\"215\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Dim Jenis Tagihan</text><line x1=\"785\" y1=\"155\" x2=\"785\" y2=\"190\" class=\"s-line\"/><rect x=\"330\" y=\"14\" width=\"240\" height=\"214\" rx=\"8\" class=\"s-dash\"/><text x=\"450\" y=\"36\" text-anchor=\"middle\" class=\"s-hd\">CONFORMED DIMENSIONS</text><rect x=\"355\" y=\"52\" width=\"190\" height=\"42\" rx=\"6\" class=\"s-acc\"/><text x=\"450\" y=\"79\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Tanggal</text><line x1=\"210\" y1=\"125\" x2=\"355\" y2=\"73\" class=\"s-line\"/><line x1=\"690\" y1=\"125\" x2=\"545\" y2=\"73\" class=\"s-line\"/><rect x=\"355\" y=\"112\" width=\"190\" height=\"42\" rx=\"6\" class=\"s-acc\"/><text x=\"450\" y=\"139\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Mahasiswa</text><line x1=\"210\" y1=\"125\" x2=\"355\" y2=\"133\" class=\"s-line\"/><line x1=\"690\" y1=\"125\" x2=\"545\" y2=\"133\" class=\"s-line\"/><rect x=\"355\" y=\"172\" width=\"190\" height=\"42\" rx=\"6\" class=\"s-acc\"/><text x=\"450\" y=\"199\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Dim Prodi</text><line x1=\"210\" y1=\"125\" x2=\"355\" y2=\"193\" class=\"s-line\"/><line x1=\"690\" y1=\"125\" x2=\"545\" y2=\"193\" class=\"s-line\"/><text x=\"450\" y=\"246\" text-anchor=\"middle\" class=\"s-s\">nama kolom dan isi sama → hasil bisa digabung (drill across)</text></svg><figcaption>Dimensi terkonformasi dipakai bersama oleh dua proses bisnis, diadaptasi dari Kimball &amp; Ross (2013). Contoh tabel kampus adalah ilustrasi.</figcaption></figure><p style=\"margin-top:.2em\">Dengan dimensi yang sama, hasil dua proses dapat digabung: <button type=\"button\" class=\"term\" data-term=\"drill-across\">drill across</button>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Variasi</span><span>Indikator 3</span></div><h2>Dimensi ringkas dan fakta terkonformasi</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"shrunken-dimension\">Shrunken dimension</button></h3><p>Dimensi terkonformasi yang berisi <b>sebagian kolom atau baris</b> dari dimensi induknya.</p><ul><li>Dimensi <b>Bulan</b> diturunkan dari dimensi <b>Tanggal</b> untuk fakta target bulanan.</li><li>Dimensi <b>Fakultas</b> diturunkan dari dimensi <b>Prodi</b>.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg><button type=\"button\" class=\"term\" data-term=\"conformed-fact\">Conformed fact</button></h3><p>Fakta yang muncul di beberapa tabel fakta boleh memakai <b>nama sama</b> hanya bila <b>definisinya sama</b>.</p><ul><li>\"Mahasiswa aktif\" versi KRS ≠ versi pembayaran.</li><li>Beri nama berbeda: <span class=\"phrase\">mhs_isi_krs</span>, <span class=\"phrase\">mhs_bayar_ukt</span>.</li></ul></div></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.6em\">Konsep mengikuti Kimball &amp; Ross (2013); contoh adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Drill across</span><span>Data ilustrasi · indikator 3</span></div><h2>Dua proses digabung per prodi</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Prodi</th><th>Mhs isi KRS<br><span style=\"font-weight:500\">(fakta KRS)</span></th><th>Mhs bayar UKT<br><span style=\"font-weight:500\">(fakta bayar)</span></th><th>Isi KRS belum bayar</th></tr></thead><tbody><tr><td>Sistem Informasi</td><td>412</td><td>389</td><td><b>31</b></td></tr><tr><td>Informatika</td><td>530</td><td>517</td><td><b>19</b></td></tr><tr><td>Teknik Industri</td><td>288</td><td>290</td><td><b>6</b></td></tr></tbody></table></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Cara kerjanya</h3><ol><li>Kueri 1 ke fakta KRS, dikelompokkan per Prodi.</li><li>Kueri 2 ke fakta bayar, dikelompokkan per Prodi.</li><li>Hasil digabung pada label Prodi yang <b>sama persis</b>.</li></ol></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Data ilustrasi. Kolom terakhir dihitung per mahasiswa (NIM), sehingga tidak sama dengan selisih kolom 2 dan 3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hati-hati</span><span>Indikator 3</span></div><h2>Kesalahan umum bus matrix</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Baris = departemen</h3><p>\"Keuangan\", \"BAAK\" sebagai baris; proses yang sama tercatat dua kali.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Baris = laporan</h3><p>\"Laporan akreditasi\" sebagai baris; terlalu sempit dan cepat usang.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Kolom terlalu umum</h3><p>Satu kolom \"Orang\" untuk mahasiswa, dosen, dan pegawai sekaligus.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Kolom per level hierarki</h3><p>Kolom terpisah untuk Prodi, Fakultas, Universitas; padahal satu dimensi.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Nama ganda</h3><p>\"Mhs\" di satu baris, \"Student\" di baris lain untuk hal yang sama.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Tanpa pemilik</h3><p>Tidak ada yang berwenang menyepakati kode dan definisi.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Empat kartu pertama mengikuti peringatan Kimball &amp; Ross (2013); dua terakhir rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Realitas data</span><span>Indikator 4</span></div><h2>Menilai ketersediaan data sumber</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>Ada?</h3><p>Apakah proses itu dicatat di <button type=\"button\" class=\"term\" data-term=\"source-system\">sistem sumber</button>, atau masih di kertas?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Riwayat?</h3><p>Sejak kapan tersimpan? Apakah data lama tertimpa?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Mutu?</h3><p>Seberapa banyak nilai kosong, duplikat, dan kode tidak seragam?</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/></svg>Akses dan izin?</h3><p>Bisa diekspor? Siapa pemiliknya? Ada data pribadi yang harus dilindungi?</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Empat pertanyaan: definisi kerja mata kuliah ini. Kebutuhan harus dipertemukan dengan realitas data <span class=\"cite\">(Kimball &amp; Ross, 2013)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Profiling awal</span><span>Indikator 4</span></div><h2>Apa yang diperiksa saat <button type=\"button\" class=\"term\" data-term=\"data-profiling\">profiling</button>?</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Aspek</th><th>Pertanyaan</th></tr></thead><tbody><tr><td><b>Volume &amp; rentang</b></td><td>Berapa baris? Tanggal paling awal dan akhir?</td></tr><tr><td><b>Kelengkapan</b></td><td>Berapa persen <button type=\"button\" class=\"term\" data-term=\"null-value\">nilai kosong</button> per kolom penting?</td></tr><tr><td><b>Keunikan</b></td><td>Apakah kunci (NIM, nomor transaksi) benar-benar unik?</td></tr><tr><td><b>Pola &amp; kode</b></td><td>Format seragam? Berapa nilai berbeda di kolom kode?</td></tr><tr><td><b>Nilai wajar</b></td><td>Ada nominal negatif, tanggal tahun 1900, IPK di atas 4?</td></tr><tr><td><b>Kecocokan</b></td><td>Apakah kode di transaksi ada di data master?</td></tr></tbody></table></div><div><pre style=\"margin:0;font-family:var(--mono);font-size:.68em;line-height:1.45;background:var(--surface-2);border:2px solid var(--line);border-radius:4px;padding:.7em .8em;overflow-x:auto;white-space:pre\">SELECT COUNT(*)            AS baris,\n  COUNT(*)-COUNT(kode_prodi)  AS prodi_kosong,\n  COUNT(DISTINCT nim)         AS nim_unik,\n  COUNT(DISTINCT kode_prodi)  AS kode_beda,\n  MIN(tgl_bayar), MAX(tgl_bayar)\nFROM
